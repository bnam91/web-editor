<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- GAP-006 CSP(Phase1): 원격 스크립트·eval·플러그인 차단. strict(주입 on* 완전차단)은 Phase2. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: ws://localhost:* http://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GODITOR — 로그인</title>
  <link rel="stylesheet" href="../assets/fonts/pretendard.css">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <style>
    /* 디자인 토큰 alias */
    :root {
      --ui-bg-app: var(--bg-app);
      --ui-bg-elevated: var(--bg-elevated);
      --ui-bg-card: var(--bg-card);
      --ui-bg-input: var(--bg-input);
      --ui-bg-hover: var(--bg-hover);
      --ui-border: var(--border-default);
      --ui-border-mid: var(--border-mid);
      --ui-text: var(--text-default);
      --ui-text-sub: var(--text-sub);
      --ui-text-muted: var(--text-muted);
      --ui-text-dim: var(--text-dim);
      --ui-danger: var(--color-danger);
      --ui-success: var(--color-success);
      --ui-accent-primary: var(--color-accent);
      --ui-accent-primary-hover: var(--color-accent-hover);
      --ui-accent-primary-active: var(--p-blue-800);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ui-bg-app);
      color: var(--ui-text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }

    .card {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      padding: 40px 36px 32px;
      width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      -webkit-app-region: no-drag;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--ui-accent-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--ui-text);
    }

    .logo-sub {
      font-size: 12px;
      color: var(--ui-text-muted);
      margin-top: 1px;
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ui-text);
    }

    .desc {
      font-size: 13px;
      color: var(--ui-text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
      word-break: keep-all;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ui-text-sub);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--ui-bg-input);
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      color: var(--ui-text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      user-select: text;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--ui-accent-primary);
    }

    input::placeholder {
      color: var(--ui-text-dim);
    }

    .field {
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      background: var(--ui-accent-primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
    }

    .btn:hover { background: var(--ui-accent-primary-hover); }
    .btn:active { background: var(--ui-accent-primary-active); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-back {
      background: var(--ui-bg-card);
      color: var(--ui-text-sub);
      margin-top: 8px;
    }

    .btn-back:hover { background: var(--ui-bg-hover); }

    .status {
      margin-top: 14px;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      line-height: 1.5;
      word-break: keep-all;
    }

    .status.error { color: var(--ui-danger); }
    .status.success { color: var(--ui-success); }
    .status.info { color: var(--ui-text-muted); }

    /* 계정 찾기·가입 한 줄. ★홈페이지 login.html의 .auth-links와 «같은 구성»이다
       (이메일 찾기 | 비밀번호 찾기 | 회원가입). 앱과 웹이 다른 문구·다른 배치를 쓰면
       같은 서비스로 안 보인다. 색도 홈페이지 기준을 따라 담백하게 — 강조색을 쓰면
       [로그인] 버튼과 시선을 다툰다. */
    .auth-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--ui-border);
      font-size: 12px;
    }

    .auth-links .sep { color: var(--ui-border-mid); }

    .link {
      color: var(--ui-text-muted);
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
    }

    .link:hover { color: var(--ui-text); text-decoration: underline; }

    /* 만료(이벤트 종료) 화면 */
    .screen { display: none; }
    .screen.visible { display: block; }

    .account-box {
      background: var(--ui-bg-card);
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .account-row:last-child { margin-bottom: 0; }
    .account-row .k { color: var(--ui-text-dim); font-size: 12px; }
    .account-row .v { color: var(--ui-text); }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div>
      <div class="logo-text">GODITOR</div>
      <div class="logo-sub" id="logoSub">Sign in</div>
    </div>
  </div>

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="screen visible">
    <h2>로그인</h2>
    <p class="desc">홈페이지에서 가입한 계정으로 로그인해 주세요.</p>

    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username" spellcheck="false" autocapitalize="off">
    </div>

    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="loginBtn">로그인</button>
    <div class="status info" id="statusMsg"></div>

    <!-- 홈페이지 login.html과 같은 한 줄. 순서·문구·구분자까지 맞춘다. -->
    <div class="auth-links">
      <span class="link" id="findEmailLink">이메일 찾기</span>
      <span class="sep">|</span>
      <span class="link" id="findPwLink">비밀번호 찾기</span>
      <span class="sep">|</span>
      <span class="link" id="signupLink">회원가입</span>
    </div>
  </div>

  <!-- 만료(이벤트 종료) 화면 -->
  <div id="expiredScreen" class="screen">
    <h2>이벤트가 종료됐습니다</h2>
    <p class="desc">무료 이용 기간이 끝났습니다.<br>계속 사용하시려면 요금제를 확인해 주세요.</p>

    <div class="account-box">
      <div class="account-row"><span class="k">계정</span><span class="v" id="expEmail">—</span></div>
      <div class="account-row"><span class="k">이용 기간</span><span class="v" id="expUntil">—</span></div>
    </div>

    <button class="btn" id="purchaseBtn">요금제 보기</button>
    <button class="btn btn-back" id="backToLoginBtn">다른 계정으로 로그인</button>
    <div class="status info" id="expiredStatus"></div>
  </div>
</div>

<script>
  const api = window.electronAPI || {};
  // 아래 값들은 auth:state가 실어 보내는 것(services/authService.js가 원본)으로 덮인다.
  // 여기 문자열은 IPC를 못 받았을 때의 최후 fallback일 뿐 — 주소를 바꿀 일이 있으면
  // authService.js의 API_BASE 한 곳만 고친다.
  let signupUrl = 'https://hompageapp.vercel.app/signup.html';
  let purchaseUrl = 'https://hompageapp.vercel.app/pricing.html';
  let findEmailUrl = 'https://hompageapp.vercel.app/find-email.html';
  let findPasswordUrl = 'https://hompageapp.vercel.app/find-password.html';

  const $ = (id) => document.getElementById(id);

  function fmtDate(iso) {
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return '—';
    return new Date(t).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function showScreen(name) {
    $('loginScreen').classList.toggle('visible', name === 'login');
    $('expiredScreen').classList.toggle('visible', name === 'expired');
    $('logoSub').textContent = name === 'expired' ? 'Subscription' : 'Sign in';
    if (name === 'login') $('email').focus();
  }

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function init() {
    try {
      const st = await api.getAuthState?.();
      if (st) {
        if (st.signupUrl) signupUrl = st.signupUrl;
        if (st.purchaseUrl) purchaseUrl = st.purchaseUrl;
        if (st.findEmailUrl) findEmailUrl = st.findEmailUrl;
        if (st.findPasswordUrl) findPasswordUrl = st.findPasswordUrl;
        if (st.expired) {
          $('expEmail').textContent = st.email || '—';
          $('expUntil').textContent = fmtDate(st.accessUntil) + ' 까지';
          $('email').value = st.email || '';
          showScreen('expired');
          return;
        }
        if (st.email) $('email').value = st.email;
      }
    } catch (_) {}
    showScreen('login');
  }

  async function handleLogin() {
    const email = $('email').value.trim();
    const password = $('password').value;
    const btn = $('loginBtn');
    const statusEl = $('statusMsg');

    if (!email) { setStatus(statusEl, '이메일을 입력해 주세요.', 'error'); return; }
    if (!password) { setStatus(statusEl, '비밀번호를 입력해 주세요.', 'error'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>로그인 중...';
    setStatus(statusEl, '', '');

    try {
      const result = await api.authLogin(email, password);

      if (result && result.ok) {
        setStatus(statusEl, '로그인 완료! 잠시 후 이동합니다...', 'success');
        setTimeout(() => { api.navigateToProjects(); }, 600);
        return;
      }

      // ★만료는 HTTP 200 + ok:false 로 온다 — 에러가 아니라 구매 안내 분기.
      if (result && result.reason === 'expired') {
        if (result.purchaseUrl) purchaseUrl = result.purchaseUrl;
        $('expEmail').textContent = email;
        $('expUntil').textContent = fmtDate(result.accessUntil) + ' 까지';
        $('password').value = '';
        showScreen('expired');
        return;
      }

      switch (result && result.reason) {
        case 'invalid_credentials':
          setStatus(statusEl, '이메일 또는 비밀번호가 올바르지 않습니다.', 'error');
          break;
        case 'email_not_verified':
          setStatus(statusEl, '이메일 인증이 완료되지 않았습니다. 받은 메일함의 인증 링크를 확인해 주세요.', 'error');
          break;
        case 'network':
          setStatus(statusEl, '서버에 연결할 수 없습니다. 네트워크를 확인하고 다시 시도해 주세요.', 'error');
          break;
        case 'server':
          setStatus(statusEl, `서버 오류가 발생했습니다 (${result.status || '?'}). 잠시 후 다시 시도해 주세요.`, 'error');
          break;
        default:
          setStatus(statusEl, '로그인에 실패했습니다. 다시 시도해 주세요.', 'error');
      }
    } catch (e) {
      setStatus(statusEl, '연결 오류: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  }

  async function openExternal(url, statusEl) {
    try {
      const r = await api.openExternalUrl?.(url);
      if (r && r.ok === false && statusEl) {
        // NOT_READY = 주소는 맞는데 홈페이지에 아직 그 페이지가 없다(main.js가 열기 전에 확인).
        // 「열지 못했습니다」로 뭉뚱그리면 사용자가 자기 탓·네트워크 탓으로 오해한다.
        if (r.error === 'NOT_READY') {
          setStatus(statusEl, '아직 준비 중인 기능입니다. 조금만 기다려 주세요.', 'info');
        } else {
          setStatus(statusEl, '링크를 열지 못했습니다: ' + url, 'error');
        }
      }
    } catch (_) {
      if (statusEl) setStatus(statusEl, '링크를 열지 못했습니다: ' + url, 'error');
    }
  }

  $('loginBtn').addEventListener('click', handleLogin);
  $('signupLink').addEventListener('click', () => openExternal(signupUrl, $('statusMsg')));
  $('findEmailLink').addEventListener('click', () => openExternal(findEmailUrl, $('statusMsg')));
  $('findPwLink').addEventListener('click', () => openExternal(findPasswordUrl, $('statusMsg')));
  $('purchaseBtn').addEventListener('click', () => openExternal(purchaseUrl, $('expiredStatus')));
  $('backToLoginBtn').addEventListener('click', () => {
    setStatus($('statusMsg'), '', '');
    showScreen('login');
  });

  // Enter 키 = 로그인 (로그인 화면에서만)
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (!$('loginScreen').classList.contains('visible')) return;
    handleLogin();
  });

  // Electron 신호등(트래픽 라이트) 영역 회피용 클래스 토글
  if (api.isElectron) {
    document.body.classList.add('electron-app');
    api.getFullscreen?.().then(isFullscreen => {
      document.body.classList.toggle('fullscreen', isFullscreen);
    });
    api.onFullscreenChange?.(isFullscreen => {
      document.body.classList.toggle('fullscreen', isFullscreen);
    });
  }

  init();
</script>
</body>
</html>
