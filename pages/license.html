<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- GAP-006 CSP(Phase1): 원격 스크립트·eval·플러그인 차단. strict(주입 on* 완전차단)은 Phase2. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: ws://localhost:* http://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GODITOR — 로그인</title>
  <link rel="stylesheet" href="../assets/fonts/pretendard.css">
  <link rel="stylesheet" href="../css/design-tokens.css">
  <!-- ★상태별 문구·판정의 «정본». license.html 인라인 스크립트는 이 사전을 그대로 쓴다 —
       화면이 자기 문구를 새로 짓지 않는다(§E3). 단위검사(license-screen.test.mjs)가 이 파일
       «그대로»를 vm 으로 돌려 잰다. -->
  <script src="../js/license-screen.js"></script>
  <style>
    /* 디자인 토큰 alias */
    :root {
      --ui-bg-app: var(--bg-app);
      --ui-bg-elevated: var(--bg-elevated);
      --ui-bg-card: var(--bg-card);
      --ui-bg-input: var(--bg-input);
      --ui-bg-hover: var(--bg-hover);
      --ui-border: var(--border-default);
      --ui-border-mid: var(--border-mid);
      --ui-text: var(--text-default);
      --ui-text-sub: var(--text-sub);
      --ui-text-muted: var(--text-muted);
      --ui-text-dim: var(--text-dim);
      --ui-danger: var(--color-danger);
      --ui-success: var(--color-success);
      --ui-accent-primary: var(--color-accent);
      --ui-accent-primary-hover: var(--color-accent-hover);
      --ui-accent-primary-active: var(--p-blue-800);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ui-bg-app);
      color: var(--ui-text);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }

    .card {
      background: var(--ui-bg-elevated);
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      padding: 40px 36px 32px;
      width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      -webkit-app-region: no-drag;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    /* ★[2026-09-06] 예전엔 `background: var(--ui-accent-primary)` (파랑) 위에 `✦` 유니코드
       «글자»를 얹은 «가짜 로고»였다. 그런데 독에 뜨는 실제 앱 아이콘은 «차콜 바탕 + 밝은 별»이라
       ⇒ 같은 제품이 «독에서와 앱 안에서 다른 얼굴»이었다. 브랜드 일관성 점검(현빈)에서 발견.
       ⇒ 그리지 말고 «그 파일 자체»를 쓴다. 다시 갈라질 여지를 없앤다. */
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: block;
      flex: none;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--ui-text);
    }

    .logo-sub {
      font-size: 12px;
      color: var(--ui-text-muted);
      margin-top: 1px;
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ui-text);
    }

    .desc {
      font-size: 13px;
      color: var(--ui-text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
      word-break: keep-all;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ui-text-sub);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--ui-bg-input);
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      color: var(--ui-text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      user-select: text;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--ui-accent-primary);
    }

    input::placeholder {
      color: var(--ui-text-dim);
    }

    .field {
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      background: var(--ui-accent-primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
    }

    .btn:hover { background: var(--ui-accent-primary-hover); }
    .btn:active { background: var(--ui-accent-primary-active); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-back {
      background: var(--ui-bg-card);
      color: var(--ui-text-sub);
      margin-top: 8px;
    }

    .btn-back:hover { background: var(--ui-bg-hover); }

    /* ── Google 로그인 (2026-09-06, 인계 규격서 §5) ──
       ★버튼은 이메일 폼 «위»다 — 「원래 쓰던 방법」이 아래에 남아 있어야 기존 사용자가 안 헤맨다.
       ★색은 구글 브랜드 사양(★라이트)을 «그대로» 쓴다. 현빈 2026-09-06 선택 —
         다크 사양(#131314/#E3E3E3/#8E918F)도 공식 변형이라 되돌리기는 이 세 줄이면 된다. 여기만 토큰을 안 쓰는 이유 =
         이 세 값은 우리 디자인이 아니라 «구글이 정한 것»이고, 바꾸면 브랜드 가이드 위반이다.
         (나머지 여백·모서리·글꼴은 전부 위 .btn 규약을 따른다) */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #FFFFFF;
      color: #1F1F1F;
      border: 1px solid #747775;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-google:hover:not(:disabled) { background: #F2F2F2; }
    .btn-google:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-google svg { flex: 0 0 auto; }

    /* 「또는」 구분선 — 두 방법이 «대등»하게 보이도록 가운데 글자 양옆에 선을 둔다. */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 4px;
      font-size: 12px;
      color: var(--ui-text-dim);
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--ui-border);
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      line-height: 1.5;
      word-break: keep-all;
    }

    .status.error { color: var(--ui-danger); }
    .status.success { color: var(--ui-success); }
    .status.info { color: var(--ui-text-muted); }

    /* 계정 찾기·가입 한 줄. ★홈페이지 login.html의 .auth-links와 «같은 구성»이다
       (이메일 찾기 | 비밀번호 찾기 | 회원가입). 앱과 웹이 다른 문구·다른 배치를 쓰면
       같은 서비스로 안 보인다. 색도 홈페이지 기준을 따라 담백하게 — 강조색을 쓰면
       [로그인] 버튼과 시선을 다툰다. */
    .auth-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--ui-border);
      font-size: 12px;
    }

    .auth-links .sep { color: var(--ui-border-mid); }

    .link {
      color: var(--ui-text-muted);
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
    }

    .link:hover { color: var(--ui-text); text-decoration: underline; }

    /* 만료(이벤트 종료) 화면 */
    .screen { display: none; }
    .screen.visible { display: block; }

    .account-box {
      background: var(--ui-bg-card);
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .account-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .account-row:last-child { margin-bottom: 0; }
    .account-row .k { color: var(--ui-text-dim); font-size: 12px; }
    .account-row .v { color: var(--ui-text); }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img class="logo-icon" src="../assets/goditor-icon-128.png" alt="">
    <div>
      <div class="logo-text">GODITOR</div>
      <div class="logo-sub" id="logoSub">Sign in</div>
    </div>
  </div>

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="screen visible">
    <h2>로그인</h2>
    <p class="desc">홈페이지에서 가입한 계정으로 로그인해 주세요.</p>
    <!-- .gdt 를 더블클릭해 들어왔을 때만 보인다. 사용자가 「내 파일이 어디 갔지」로 놀라지 않게. -->
    <div class="status info" id="pendingGdtMsg" style="display:none"></div>

    <button class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
      </svg>
      <span>Google로 계속하기</span>
    </button>

    <div class="or-divider">또는</div>

    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username" spellcheck="false" autocapitalize="off">
    </div>

    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="loginBtn">로그인</button>
    <div class="status info" id="statusMsg"></div>

    <!-- 홈페이지 login.html과 같은 한 줄. 순서·문구·구분자까지 맞춘다. -->
    <div class="auth-links">
      <span class="link" id="findEmailLink">이메일 찾기</span>
      <span class="sep">|</span>
      <span class="link" id="findPwLink">비밀번호 찾기</span>
      <span class="sep">|</span>
      <span class="link" id="signupLink">회원가입</span>
    </div>
  </div>

  <!-- 만료 화면 — ★진짜 구독 종료(서명된 사실)일 때만 뜬다. 「연결 필요」(verifyScreen)와
       문구를 절대 안 섞는다(§E3 ㉮, js/license-screen.js EXPIRED_COPY). -->
  <div id="expiredScreen" class="screen">
    <h2 id="expTitle">이용 기간이 끝났습니다</h2>
    <p class="desc" id="expDesc">구독 기간이 끝났습니다.<br>계속 사용하시려면 요금제를 확인해 주세요.</p>

    <div class="account-box">
      <div class="account-row"><span class="k">계정</span><span class="v" id="expEmail">—</span></div>
      <div class="account-row"><span class="k">이용 기간</span><span class="v" id="expUntil">—</span></div>
    </div>

    <button class="btn" id="purchaseBtn">요금제 보기</button>
    <button class="btn btn-back" id="backToLoginBtn">다른 계정으로 로그인</button>
    <div class="status info" id="expiredStatus"></div>
  </div>

  <!-- 확인 필요 화면 — ★구독은 «살아 있을 수 있다». sig_missing·sig_invalid·sub_mismatch·
       clock_rollback·grace_exceeded 전부 여기로 온다(계획서 §3-1 R). 「만료」라고 «절대» 안 쓴다.
       ㉰ 푸는 조건은 «연결»(auth:refresh, sessionToken 재사용)이지 재로그인이 아니다 —
       이 화면엔 비밀번호 입력칸이 «없다». -->
  <div id="verifyScreen" class="screen">
    <h2 id="verifyTitle">확인하는 중…</h2>
    <p class="desc" id="verifyDesc">로그인 상태를 확인하고 있어요. 잠시만 기다려 주세요.</p>

    <div class="account-box" id="verifyAccountBox" style="display:none">
      <div class="account-row"><span class="k">계정</span><span class="v" id="verifyEmail">—</span></div>
      <div class="account-row" id="verifyUntilRow"><span class="k">구독</span><span class="v" id="verifyUntil">—</span></div>
    </div>

    <div class="status info" id="verifyStatus"><span class="spinner"></span>확인하는 중…</div>

    <!-- ★디바운스 2초 — 연타가 /session 을 분당 N회 때리지 않게(§E3 적대검수 ⑶). -->
    <button class="btn" id="verifyRetryBtn" style="display:none">다시 시도</button>
    <button class="btn btn-back" id="verifyBackBtn" style="display:none">다른 계정으로 로그인</button>
  </div>
</div>

<script>
  const api = window.electronAPI || {};

  /* ── .gdt 를 더블클릭해 들어온 경우 ──
   * 비로그인이면 이 화면이 뜨는데, 파일 대기열을 «비우는» 코드가 이 페이지엔 없다.
   * 즉 파일은 유실이 아니라 «대기»했다가 로그인 뒤 projects.html 에서 열린다.
   * ★그런데 사용자는 그걸 알 방법이 없어서 「내 파일이 어디 갔지」가 된다 — 한 줄로 알린다.
   * ★반드시 peek(비우지 않음)을 쓴다. take 를 쓰면 여기서 큐가 비어 정작 안 열린다.
   */
  (async () => {
    try {
      const pending = await api.gdtPeekPendingOpen?.();
      const list = Array.isArray(pending) ? pending : (pending ? [pending] : []);
      if (!list.length) return;
      const el = document.getElementById('pendingGdtMsg');
      if (!el) return;
      const names = list.map(p => String(p).split('/').pop().split('\\').pop());
      el.textContent = names.length === 1
        ? `로그인하면 〈${names[0]}〉를 엽니다.`
        : `로그인하면 파일 ${names.length}개를 엽니다 — ${names.join(', ')}`;
      el.style.display = '';
    } catch (_) { /* 구버전 preload 등 — 표시만 생략하고 동작엔 영향 없다 */ }
  })();
  // 아래 값들은 auth:state가 실어 보내는 것(services/authService.js가 원본)으로 덮인다.
  // 여기 문자열은 IPC를 못 받았을 때의 최후 fallback일 뿐 — 주소를 바꿀 일이 있으면
  // authService.js의 API_BASE 한 곳만 고친다.
  let signupUrl = 'https://blacksheepwall.kr/signup.html';
  let purchaseUrl = 'https://blacksheepwall.kr/pricing.html';
  let findEmailUrl = 'https://blacksheepwall.kr/find-email.html';
  let findPasswordUrl = 'https://blacksheepwall.kr/find-password.html';

  const $ = (id) => document.getElementById(id);
  // ★상태별 문구·판정의 정본. js/license-screen.js(위 <script src>)가 window 에 심어 둔다.
  const LS = window.LicenseScreen;

  function fmtDate(iso) {
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return '—';
    return new Date(t).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function showScreen(name) {
    $('loginScreen').classList.toggle('visible', name === 'login');
    $('expiredScreen').classList.toggle('visible', name === 'expired');
    $('verifyScreen').classList.toggle('visible', name === 'verify');
    $('logoSub').textContent = name === 'expired' ? 'Subscription' : name === 'verify' ? 'Verifying' : 'Sign in';
    if (name === 'login') $('email').focus();
  }

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function showExpiredScreen(email, accessUntil) {
    // ★문구는 js/license-screen.js EXPIRED_COPY «하나»에서 온다 — 화면이 따로 짓지 않는다.
    $('expTitle').textContent = LS.EXPIRED_COPY.title;
    $('expDesc').textContent = LS.EXPIRED_COPY.desc;
    $('expEmail').textContent = email || '—';
    $('expUntil').textContent = fmtDate(accessUntil) + ' 까지';
    $('email').value = email || '';
    showScreen('expired');
  }

  /* ── 확인 필요 화면(verifyScreen) ──────────────────────────────────────
   * §E3 ㉮ — 「만료」와 문구를 절대 안 섞는다. js/license-screen.js 의 VERIFY_COPY/
   * EXPIRED_COPY «하나»를 그대로 쓴다(여기서 새 문구를 짓지 않는다).
   * §E3 ㉰ — 푸는 조건은 «연결»(api.refreshAuth, sessionToken 재사용)뿐이다.
   *   이 화면에는 처음부터 끝까지 비밀번호 입력칸이 없다.
   */
  let _verifyKnownState = null;   // 마지막으로 받은 auth:state — 재시도 때 계정 박스를 다시 그리는 데 쓴다
  let _lastVerifyRetryAt = 0;

  function paintVerifyAccount(st) {
    const box = $('verifyAccountBox');
    if (!st || !st.email) { box.style.display = 'none'; return; }
    $('verifyEmail').textContent = st.email;
    const kind = LS.remainingKind(st);
    $('verifyUntilRow').style.display = '';
    if (kind === 'perpetual') {
      $('verifyUntil').textContent = '무기한 이용 중';
    } else if (kind === 'until') {
      // ★남은 기간을 «숫자(날짜)»로 보여준다 — 서명 안의 accessUntil, 이미 갖고 있던 값이다.
      $('verifyUntil').textContent = fmtDate(st.accessUntil) + ' 까지 남아 있음';
    } else {
      $('verifyUntilRow').style.display = 'none';
    }
    box.style.display = '';
  }

  function paintVerifyCopy(kind) {
    const c = LS.VERIFY_COPY[kind] || LS.VERIFY_COPY.generic;
    $('verifyTitle').textContent = c.title;
    $('verifyDesc').textContent = c.desc;
  }

  function setVerifyChecking() {
    paintVerifyCopy('checking');
    $('verifyStatus').innerHTML = '<span class="spinner"></span>확인하는 중…';
    $('verifyStatus').className = 'status info';
    $('verifyRetryBtn').style.display = 'none';
    $('verifyBackBtn').style.display = 'none';
  }

  function setVerifyFailed(kind) {
    paintVerifyCopy(kind);
    $('verifyStatus').textContent = '';
    $('verifyStatus').className = 'status';
    $('verifyRetryBtn').style.display = '';
    $('verifyBackBtn').style.display = '';
  }

  /** pending:'verify' 상태를 실제로 푼다. 사용자 조작 0 —
   *  로드되자마자 한 번 자동으로 돈다(㉯의 취지: 대부분은 여기서 «조용히» 풀린다). */
  async function runVerifyFlow(st) {
    _verifyKnownState = st || _verifyKnownState;
    showScreen('verify');
    paintVerifyAccount(_verifyKnownState);
    setVerifyChecking();

    let result = null;
    try { result = await api.refreshAuth?.(); } catch (_) { result = null; }

    const outcome = LS.decideVerifyOutcome(result);
    switch (outcome) {
      case 'ok':
        paintVerifyCopy('ok');
        setStatus($('verifyStatus'), '확인됐습니다! 잠시 후 이동합니다...', 'success');
        setTimeout(() => { api.navigateToProjects(); }, 600);
        return;
      case 'session_cleared':
        // 서버가 «세션이 죽었다»고 명시적으로 답했다 — 이건 사실이라 재로그인이 맞다(㉰가 막는 건
        // «푸는 조건»으로 재로그인을 요구하는 것이지, 세션이 실제로 죽은 걸 감추라는 게 아니다).
        setStatus($('statusMsg'), '다른 기기에서 로그인해 이 세션은 종료됐어요. 다시 로그인해 주세요.', 'info');
        $('email').value = (_verifyKnownState && _verifyKnownState.email) || '';
        showScreen('login');
        return;
      case 'expired':
        showExpiredScreen(
          (_verifyKnownState && _verifyKnownState.email) || '',
          (result && result.accessUntil) || (_verifyKnownState && _verifyKnownState.accessUntil) || ''
        );
        return;
      case 'offline':
      case 'clock_rollback':
      case 'generic':
      default:
        setVerifyFailed(outcome);
        return;
    }
  }

  function handleVerifyRetry() {
    const now = Date.now();
    if (now - _lastVerifyRetryAt < 2000) return;   // ★디바운스 2초 — 연타로 서버를 때리지 않는다
    _lastVerifyRetryAt = now;
    runVerifyFlow(_verifyKnownState);
  }

  async function init() {
    try {
      const st = await api.getAuthState?.();
      if (st) {
        if (st.signupUrl) signupUrl = st.signupUrl;
        if (st.purchaseUrl) purchaseUrl = st.purchaseUrl;
        if (st.findEmailUrl) findEmailUrl = st.findEmailUrl;
        if (st.findPasswordUrl) findPasswordUrl = st.findPasswordUrl;

        const screen = LS.decideInitialScreen(st);
        if (screen === 'verify') {
          runVerifyFlow(st);
          return;
        }
        if (screen === 'expired') {
          showExpiredScreen(st.email, st.accessUntil);
          return;
        }
        if (st.email) $('email').value = st.email;
      }
    } catch (_) {}
    showScreen('login');
  }

  /* ── Google 로그인 (2026-09-06, 인계 규격서 §4) ──
     ★렌더러는 «부르기만» 한다. 브라우저 열기·루프백 수신·토큰 저장은 전부 main 이 한다
       (auth:google-login). 세션 토큰은 여기로 «안 온다» — 기존 authLogin 과 같은 규약이다.
     ★성공 뒤 화면 전환은 이메일 로그인과 «같은 자리»로 보낸다. 두 방법이 다른 곳에
       도착하면 「구글로 들어오면 뭔가 다르다」가 된다. */
  async function handleGoogleLogin() {
    const btn = $('googleBtn');
    const statusEl = $('statusMsg');
    const label = btn.innerHTML;

    btn.disabled = true;
    $('loginBtn').disabled = true;
    btn.innerHTML = '<span class="spinner"></span>브라우저에서 로그인 중...';
    setStatus(statusEl, '브라우저 창에서 구글 로그인을 마치면 자동으로 돌아옵니다.', 'info');

    let result = null;
    try {
      result = await api.authGoogleLogin();
    } catch (e) {
      result = { ok: false, reason: 'unknown' };
    }

    btn.disabled = false;
    $('loginBtn').disabled = false;
    btn.innerHTML = label;

    if (result && result.ok) {
      /* next = 추가정보 미기입 계정. main 이 이미 브라우저로 그 페이지를 열었다 —
         여기선 «왜 브라우저가 또 떴는지»만 알려준다(안 알리면 사고로 보인다). */
      setStatus(statusEl, result.next
        ? '로그인 완료! 추가 정보를 브라우저에서 입력해 주세요.'
        : '로그인 완료! 잠시 후 이동합니다...', 'success');
      setTimeout(() => { api.navigateToProjects(); }, 600);
      return;
    }

    // 만료는 오류가 아니라 구매 안내 분기 — 이메일 로그인과 같은 처리(:396).
    if (result && result.reason === 'expired') {
      showExpiredScreen(result.email || '', result.accessUntil);
      return;
    }

    switch (result && result.reason) {
      case 'timeout':
        setStatus(statusEl, '시간이 초과됐습니다. 다시 시도해 주세요.', 'error');
        break;
      case 'no_token':
        setStatus(statusEl, '구글 인증은 됐지만 로그인 정보를 받지 못했습니다. 다시 시도해 주세요.', 'error');
        break;
      case 'in_flight':
        setStatus(statusEl, '이미 로그인 창이 열려 있습니다. 브라우저를 확인해 주세요.', 'info');
        break;
      case 'network':
        setStatus(statusEl, '서버에 연결할 수 없습니다. 네트워크를 확인하고 다시 시도해 주세요.', 'error');
        break;
      case 'email_not_verified':
        setStatus(statusEl, '이메일 인증이 완료되지 않았습니다. 받은 메일함의 인증 링크를 확인해 주세요.', 'error');
        break;
      case 'open_failed':
      case 'loopback_failed':
        setStatus(statusEl, '브라우저를 열지 못했습니다. 이메일로 로그인해 주세요.', 'error');
        break;
      default:
        setStatus(statusEl, '구글 로그인에 실패했습니다. 이메일로 로그인해 주세요.', 'error');
    }
  }

  async function handleLogin() {
    const email = $('email').value.trim();
    const password = $('password').value;
    const btn = $('loginBtn');
    const statusEl = $('statusMsg');

    if (!email) { setStatus(statusEl, '이메일을 입력해 주세요.', 'error'); return; }
    if (!password) { setStatus(statusEl, '비밀번호를 입력해 주세요.', 'error'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>로그인 중...';
    setStatus(statusEl, '', '');

    try {
      const result = await api.authLogin(email, password);

      if (result && result.ok) {
        setStatus(statusEl, '로그인 완료! 잠시 후 이동합니다...', 'success');
        setTimeout(() => { api.navigateToProjects(); }, 600);
        return;
      }

      // ★만료는 HTTP 200 + ok:false 로 온다 — 에러가 아니라 구매 안내 분기.
      if (result && result.reason === 'expired') {
        if (result.purchaseUrl) purchaseUrl = result.purchaseUrl;
        $('password').value = '';
        showExpiredScreen(email, result.accessUntil);
        return;
      }

      switch (result && result.reason) {
        case 'invalid_credentials':
          setStatus(statusEl, '이메일 또는 비밀번호가 올바르지 않습니다.', 'error');
          break;
        case 'email_not_verified':
          setStatus(statusEl, '이메일 인증이 완료되지 않았습니다. 받은 메일함의 인증 링크를 확인해 주세요.', 'error');
          break;
        case 'network':
          setStatus(statusEl, '서버에 연결할 수 없습니다. 네트워크를 확인하고 다시 시도해 주세요.', 'error');
          break;
        case 'server':
          setStatus(statusEl, `서버 오류가 발생했습니다 (${result.status || '?'}). 잠시 후 다시 시도해 주세요.`, 'error');
          break;
        default:
          setStatus(statusEl, '로그인에 실패했습니다. 다시 시도해 주세요.', 'error');
      }
    } catch (e) {
      setStatus(statusEl, '연결 오류: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  }

  async function openExternal(url, statusEl) {
    try {
      const r = await api.openExternalUrl?.(url);
      if (r && r.ok === false && statusEl) {
        // NOT_READY = 주소는 맞는데 홈페이지에 아직 그 페이지가 없다(main.js가 열기 전에 확인).
        // 「열지 못했습니다」로 뭉뚱그리면 사용자가 자기 탓·네트워크 탓으로 오해한다.
        if (r.error === 'NOT_READY') {
          setStatus(statusEl, '아직 준비 중인 기능입니다. 조금만 기다려 주세요.', 'info');
        } else {
          setStatus(statusEl, '링크를 열지 못했습니다: ' + url, 'error');
        }
      }
    } catch (_) {
      if (statusEl) setStatus(statusEl, '링크를 열지 못했습니다: ' + url, 'error');
    }
  }

  $('googleBtn').addEventListener('click', handleGoogleLogin);
  $('loginBtn').addEventListener('click', handleLogin);
  $('signupLink').addEventListener('click', () => openExternal(signupUrl, $('statusMsg')));
  $('findEmailLink').addEventListener('click', () => openExternal(findEmailUrl, $('statusMsg')));
  $('findPwLink').addEventListener('click', () => openExternal(findPasswordUrl, $('statusMsg')));
  $('purchaseBtn').addEventListener('click', () => openExternal(purchaseUrl, $('expiredStatus')));
  $('backToLoginBtn').addEventListener('click', () => {
    setStatus($('statusMsg'), '', '');
    showScreen('login');
  });
  $('verifyRetryBtn').addEventListener('click', handleVerifyRetry);
  $('verifyBackBtn').addEventListener('click', () => {
    setStatus($('statusMsg'), '', '');
    showScreen('login');
  });

  // Enter 키 = 로그인 (로그인 화면에서만)
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (!$('loginScreen').classList.contains('visible')) return;
    handleLogin();
  });

  // Electron 신호등(트래픽 라이트) 영역 회피용 클래스 토글
  if (api.isElectron) {
    document.body.classList.add('electron-app');
    if (/Mac|Macintosh/i.test(navigator.userAgent)) document.body.classList.add('is-mac');
    api.getFullscreen?.().then(isFullscreen => {
      document.body.classList.toggle('fullscreen', isFullscreen);
    });
    api.onFullscreenChange?.(isFullscreen => {
      document.body.classList.toggle('fullscreen', isFullscreen);
    });
  }

  init();
</script>
</body>
</html>
