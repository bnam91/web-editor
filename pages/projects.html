<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- GAP-006 CSP(Phase1): 원격 스크립트·eval·플러그인 차단. strict(주입 on* 완전차단)은 Phase2. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: ws://localhost:* http://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'none'">
<title>GODITOR</title>
<!-- ★「없는 글꼴 대체」 대화상자용 — 편집기와 «같은» 토큰·같은 모달 껍데기를 쓰려고 물린다.
     이 페이지의 <style>이 아래에 오므로 body/* 전역은 여전히 이 페이지 것이 이긴다.
     (실측: editor-base.css와 이 페이지 사이에 id/class 충돌 0건) -->
<link rel="stylesheet" href="../css/editor-base.css">
<link rel="stylesheet" href="../css/settings-modal.css">
<link rel="stylesheet" href="../css/notice.css">
<link rel="stylesheet" href="../css/font-substitute.css">
<link rel="stylesheet" href="../css/version-history.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a1a; color: #e0e0e0;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Titlebar ── */
#titlebar {
  height: 44px; background: #1e1e1e; border-bottom: 1px solid #2a2a2a;
  display: flex; align-items: center; padding: 0 16px;
  -webkit-app-region: drag; flex-shrink: 0;
}
#titlebar * { -webkit-app-region: no-drag; }
/* ★신호등 자리는 «맥에서만». 윈도우엔 신호등이 없어 빈 공간이 된다(2026-08-29) */
/* editor-panels.css #logo-version-badge 와 같은 값 — 그 파일은 이 페이지가 로드하지 않는다 */
#logo-version-badge {
  font-size: var(--ui-fs-9); font-weight: var(--ui-fw-medium);
  color: var(--ui-text-dim); letter-spacing: 0.3px;
  border: 1px solid var(--ui-bg-hover);
  border-radius: 3px;
  padding: 1px 5px;
  margin-left: 6px;
  flex-shrink: 0;
}
.electron-app #titlebar { padding-left: 16px; }
.electron-app.is-mac #titlebar { padding-left: 80px; }
.electron-app.fullscreen #titlebar,
.electron-app.is-mac.fullscreen #titlebar { padding-left: 16px; }
#app-logo {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; color: #ccc;
  letter-spacing: 0.6px;
}

/* ── Main ── */
#main {
  flex: 1; overflow-y: auto; padding: 40px 48px;
}
#main::-webkit-scrollbar { width: 6px; }
#main::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* ── Header ── */
#header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
#header h1 { font-size: 18px; font-weight: 700; color: #f0f0f0; }

#btn-new {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 32px;
  background: #2d6fe8; border: none; border-radius: 7px;
  color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background 0.15s;
}
#btn-new:hover { background: #3a7df0; }

#btn-new-planning {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 32px;
  background: #1a7a5e; border: none; border-radius: 7px;
  color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background 0.15s;
}
#btn-new-planning:hover { background: #22976f; }

/* ── Planning card styles ── */
.project-card.planning-card {
  border-left: 3px solid #22c48a;
}
.project-card.planning-card .card-thumb {
  background: #0f2420;
}
.planning-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: #22c48a;
  background: rgba(34,196,138,0.12); border: 1px solid rgba(34,196,138,0.3);
  border-radius: 4px; padding: 1px 6px; margin-bottom: 4px;
}
/* ── 공동작업 카드 ──
 * ★위 .planning-card / .planning-badge 와 «같은 뼈대»를 쓴다(테두리 3px + 작은 배지).
 *   새 룩을 만들지 않는다 — 색만 계정 배지의 파랑(.acct-badge.is-beta)과 맞췄다.
 * 이 배지가 있는 카드는 「내 것만이 아니다」는 뜻이다. 로컬본과 눈으로 갈려야 한다. */
.project-card.collab-card {
  border-left: 3px solid #2d6fe8;
}
.collab-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: #6fa3f7;
  background: rgba(45,111,232,0.18); border: 1px solid rgba(45,111,232,0.45);
  border-radius: 4px; padding: 1px 6px; margin-bottom: 4px;
}
.header-actions {
  display: flex; align-items: center; gap: 8px;
}

/* ── 내 계정 ─────────────────────────────────────────────────────────────
 * ★평소엔 «[아바타] 이메일 [등급배지]» 한 줄뿐이다. 이용기간·동작 버튼은 접는다 —
 *   헤더에 설명이 너무 많다는 지적(2026-08-26)의 근원이 그 두 줄이었다.
 * ★메뉴 «행»은 새로 만들지 않는다 — editor-base.css 의 공용 .tab-add-item 을 그대로 쓴다
 *   (이 페이지가 이미 그 파일을 로드한다). 껍데기(#acct-menu)만 #tab-add-menu 를 본떴다.
 * ★색은 전부 --ui-* 토큰. (이 파일의 «기존» 줄들은 하드코딩 관례가 남아 있으나 별건.)
 * ── */
#acct { display: none; position: relative; }

#acct-trigger {
  display: flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 8px 0 5px;
  background: var(--ui-bg-input); border: 1px solid var(--ui-border-strong); border-radius: 7px;
  font-family: inherit; font-size: var(--ui-fs-12); color: var(--ui-text-sub);
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
#acct-trigger:hover { background: var(--ui-bg-hover); border-color: var(--ui-divider); }
/* 아바타 = 이메일 첫 글자 원형. ★외부 이미지를 쓰지 않는다(CSP·오프라인). */
.acct-avatar {
  width: 22px; height: 22px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--ui-bg-hover, #3a3a3a); color: var(--ui-text);
  border: 1px solid var(--ui-border-mid, #555);
  font-size: var(--ui-fs-base); font-weight: var(--ui-fw-bold); line-height: 1;
}
/* 열림 표시 — #publish-dropdown-wrap.open .publish-dd-chevron 과 «같은» 회전 규칙 */
.acct-chevron { flex-shrink: 0; opacity: 0.55; transition: transform 0.15s; }
#acct.open .acct-chevron { transform: rotate(180deg); }

#acct-mail  { color: #e0e0e0; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#acct-until { color: #9e9e9e; }
/* 배지는 이 파일의 .planning-badge 와 같은 꼴을 따른다 — 새 룩을 만들지 않는다 */
.acct-badge {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700; letter-spacing: .02em;
  border-radius: 4px; padding: 2px 7px;
  color: #9e9e9e; background: rgba(255,255,255,0.06); border: 1px solid #444;
}
.acct-badge.is-beta { color: #6fa3f7; background: rgba(45,111,232,0.18); border-color: rgba(45,111,232,0.45); }
.acct-badge.is-paid { color: #7fc87f; background: rgba(127,200,127,0.15); border-color: rgba(127,200,127,0.40); }

/* 드롭다운 껍데기 — editor-base.css #tab-add-menu 와 «같은» 규격(카드배경·1px·radius 8·shadow-lg) */
#acct-menu {
  display: none;
  position: absolute; top: calc(100% + 6px); right: 0;
  min-width: 244px;
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-mid);
  border-radius: 8px; padding: 6px 0;
  box-shadow: var(--ui-shadow-lg);
  z-index: 9999;
}
#acct.open #acct-menu { display: block; }
.acct-dd-head { padding: 7px 14px 6px; }
.acct-dd-mail {
  font-size: var(--ui-fs-12); color: var(--ui-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 「BETA · 2026-12-31 까지」 + (상태문구) + 새로고침 아이콘 — 한 줄 */
.acct-dd-meta {
  display: flex; align-items: center; gap: 6px; margin-top: 5px;
  font-size: var(--ui-fs-10); color: var(--ui-text-muted);
}
/* editor-panels.css .pub-dd-divider 와 같은 값 — 그 파일은 이 페이지가 로드하지 않는다 */
.acct-dd-divider { height: 1px; background: var(--ui-border); margin: 5px 0; }
/* 공용 .tab-add-item 을 <button> 으로 쓰기 위한 «중화»만 한다(룩은 그대로 물려받는다) */
#acct-menu .tab-add-item {
  width: 100%; background: transparent; border: none;
  font-family: inherit; text-align: left;
}
/* ★새로고침 = 아이콘 버튼(회전 화살표). 라벨 텍스트 없음 · title/aria-label 로 뜻을 남긴다 */
#acct-refresh {
  width: 22px; height: 22px; margin-left: auto; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent; border-radius: var(--ui-radius-sm);
  color: var(--ui-text-sub); cursor: pointer; transition: all 0.12s;
}
#acct-refresh:hover    { background: var(--ui-bg-hover); border-color: var(--ui-border); color: var(--ui-text); }
#acct-refresh:disabled { opacity: var(--ui-disabled-opacity); cursor: default; }
#acct-refresh.is-busy svg { animation: acct-spin 0.9s linear infinite; }
@keyframes acct-spin { to { transform: rotate(360deg); } }
/* 상태문구(확인 중…/갱신됨/오프라인/기간만료/다시 로그인) — 아이콘 «옆» 임시 텍스트.
   아이콘만 남기면 눌러도 아무 일이 없어 보인다. 툴팁은 마우스를 다시 올려야 보이고,
   이 페이지엔 토스트 기반이 없다(editor-toast.css 미로드) → 제자리 텍스트가 정답. */
#acct-refresh-state { flex-shrink: 0; color: var(--ui-text-sub); }

/* ── 보기 전환(그리드 / 리스트) ──────────────────────────────────────────
 * 껍데기 규격은 #acct-trigger 와 같다(높이 32 · radius 7 · 같은 배경/보더 토큰).
 * ★**선택 표시에 파랑(액센트)을 쓰지 않는다**(현빈 지시 2026-08-27).
 *   구분은 «눌린 면(배경 칩) + 아이콘 밝기» 둘로만 낸다 —
 *   선택   = 칩 var(--ui-border-mid) #3a3a3a + 아이콘 var(--ui-text) #e0e0e0
 *   비선택 = 칩 없음(투명)          + 아이콘 var(--ui-text-dim) #969696
 *   (#zoom-ctrl 의 «가라앉은 통 + 밝은 칩» 패턴과 같은 뼈대. .tb-btn 은 .active 가
 *    accent-primary 파랑이라 이번엔 쓰지 않는다.)
 * ★진짜 radio 를 쓴다(시각적으로만 숨김) — 방향키 전환·그룹 시맨틱을 브라우저가 준다.
 * ── */
#view-toggle {
  display: flex; align-items: center; gap: 2px;
  height: 32px; padding: 0 3px;
  background: var(--ui-bg-input); border: 1px solid var(--ui-border-strong); border-radius: 7px;
  margin: 0;   /* fieldset 기본 여백 제거 */
}
.vt-item {
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 24px; border-radius: var(--ui-radius-sm);
  cursor: pointer; position: relative;
  color: var(--ui-text-dim);
  transition: background 0.12s, color 0.12s;
}
.vt-item:hover { color: var(--ui-text-sub); }
/* 선택 = 칩 + 밝은 아이콘 (색상 액센트 없음) */
.vt-item:has(.vt-radio:checked) { background: var(--ui-border-mid); color: var(--ui-text); }
/* radio 는 «화면에서만» 숨긴다 — display:none 이면 포커스·방향키가 죽는다 */
.vt-radio {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}
/* 라벨은 스크린리더 전용 — 화면엔 title(툴팁)로만 뜬다 */
.vt-sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}
/* 키보드 포커스는 «보여야» 한다 — radio 를 숨겼으니 칩에 링을 그린다 */
.vt-radio:focus-visible ~ .vt-ico { outline: 1px solid var(--ui-text-sub); outline-offset: 2px; border-radius: 2px; }
.vt-ico { display: flex; }

/* ── 리스트 보기 — «같은 카드 DOM»을 한 줄 행으로 접는다(렌더러 분기 없음) ── */
#project-grid.is-list { display: flex; flex-direction: column; gap: 4px; }
#project-grid.is-list .project-card { display: flex; align-items: center; border-radius: var(--ui-radius-md); }
#project-grid.is-list .project-card:hover { transform: none; }
#project-grid.is-list .card-thumb {
  width: 46px; height: 30px; flex-shrink: 0;
  border-bottom: none; border-right: 1px solid var(--ui-bg-hover);
}
#project-grid.is-list .card-thumb svg { width: 16px; height: 16px; }
#project-grid.is-list .card-body {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  /* 오른쪽 = hover 시 뜨는 .card-actions 자리. 버튼 «최대 개수»에 맞춘다
     (공유는 조건부라 2~3개 — 예약은 최대치 기준이어야 겹침이 안 난다).
     ★산식: 3×22(버튼) + 2×4(gap) + 10(.card-actions 의 right) = 84px.
     ⚠️2026-08-28 실측으로 잡은 것: 「버전 기록(🕐)」을 걷어내며 «옛 값 76px» 로 되돌렸더니
       .card-date 가 액션과 8px 겹쳤다 — ★76 은 애초에 틀린 값이었다(3개면 84 다).
       4개 시절의 110px(=4×22+3×4+10)이 정확했던 탓에 그동안 안 드러났을 뿐이다.
       ⇒ 되돌릴 때 «옛 값»을 믿지 말고 다시 계산·실측한다. 실측: 겹침 0 · 남는 여백 0. */
  padding: 6px 84px 6px 12px;
}
#project-grid.is-list .card-name { flex: 1; min-width: 0; margin-bottom: 0; }
#project-grid.is-list .card-date { flex-shrink: 0; }
#project-grid.is-list .planning-badge,
#project-grid.is-list .collab-badge   { margin-bottom: 0; flex-shrink: 0; order: -1; }
#project-grid.is-list .fsub-card-badge { margin-top: 0; flex-shrink: 0; }
#project-grid.is-list .card-actions { top: 50%; transform: translateY(-50%); right: 10px; }

/* ── Grid ── */
#project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

/* ── Card ── */
.project-card {
  background: #242424; border: 1px solid #2e2e2e;
  border-radius: 10px; overflow: hidden;
  cursor: pointer; position: relative;
  transition: border-color 0.15s, transform 0.12s;
}
.project-card:hover { border-color: #484848; transform: translateY(-2px); }

.card-thumb {
  height: 130px; background: #1e1e1e;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid #2e2e2e;
  overflow: hidden; /* DBG-10: 썸네일 이미지 잘림 처리 */
}
.card-body { padding: 12px; }
.card-name {
  font-size: 12px; font-weight: 600; color: #e0e0e0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.card-date { font-size: 10px; color: #555; }

.card-actions {
  position: absolute; top: 8px; right: 8px;
  display: none; gap: 4px;
}
.project-card:hover .card-actions { display: flex; }
.card-action {
  width: 22px; height: 22px;
  background: rgba(24,24,24,0.9); border: 1px solid #3a3a3a;
  border-radius: 4px; color: #666; font-size: 12px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  line-height: 1;
}
.card-action:hover { background: #2d6fe8; border-color: #2d6fe8; color: #fff; }
.card-delete:hover { background: #c0392b; border-color: #c0392b; }

/* ── 즐겨찾기 ──
   ★켜진 별은 «hover 없이도» 보여야 한다. 나머지 액션은 hover 때만 뜨지만,
     즐겨찾기는 「이 카드가 즐겨찾기다」를 «알리는» 표시라 숨으면 존재 이유가 없다.
   ⛔새 버튼 «모양»을 만들지 않는다 — 칩(배경·테두리·크기)은 복제·삭제와 «똑같이» 두고
     바뀌는 건 «글리프 색»뿐이다. 켜졌다고 테두리·배경까지 금색으로 칠하면
     같은 줄에 선 세 버튼 중 하나만 다른 언어를 쓰게 된다(현빈 지적 2026-09-03).
     hover 에서 채워지는 건 기존 규율 그대로 — .card-delete:hover 가 빨강으로 차는 것과 같다. */
.project-card .card-fav.on { color: #f0b429; }
.project-card:not(:hover) .card-actions:has(.card-fav.on) { display: flex; }
.project-card:not(:hover) .card-actions:has(.card-fav.on) > :not(.card-fav) { display: none; }
.card-fav:hover { background: #f0b429; border-color: #f0b429; color: #1a1a1a; }

/* ── Empty state ── */
#empty-state {
  display: none; text-align: center; padding: 100px 0; color: #444;
}
#empty-state svg { opacity: 0.2; margin-bottom: 16px; }
#empty-state p { font-size: 13px; line-height: 1.7; }

/* ── 홈 탭바 ── */
#home-tab-bar {
  display: flex; align-items: center; gap: 3px;
  margin-left: 12px; flex-shrink: 1; min-width: 0; overflow: hidden;
  -webkit-app-region: no-drag;
}
.home-proj-tab {
  display: flex; align-items: center; gap: 5px;
  padding: 0 8px; height: 26px;
  width: 148px; flex-shrink: 0;
  background: rgba(255,255,255,0.05); border: 1px solid #333;
  border-radius: 6px; cursor: pointer;
  font-size: 12px; font-weight: 500; color: #777;
  transition: background 0.12s, color 0.12s;
  overflow: hidden;
}
.home-proj-tab:hover { background: rgba(255,255,255,0.1); color: #bbb; }
.home-proj-tab-name {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.home-proj-tab-close {

<!-- ★킬스위치 단일 원본(js/feature-flags.js) — 이 인라인 스크립트가 window.COLLAB_ENABLED 를
     읽으므로 «반드시 먼저» 실행돼야 한다. 에디터(index.html)도 같은 파일을 읽는다. -->
<script src="../js/feature-flags.js"></script>
<script src="../js/notice.js"></script>

<script>
const IS_ELECTRON = !!window.electronAPI?.isElectron;

/* ── 스토리지 추상화 (Electron: 파일, 브라우저: localStorage) ── */
const PROJECTS_KEY = 'sangpe-projects';

async function loadProjects() {
  if (IS_ELECTRON) {
    return await window.electronAPI.listProjects();
  }
  try { return JSON.parse(localStorage.getItem(PROJECTS_KEY)) || []; } catch { return []; }
}

async function saveNewProject(proj) {
  if (IS_ELECTRON) {
    await window.electronAPI.saveProject(proj);
  } else {
    const list = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
    list.push(proj);
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(list));
  }
}

async function renameProject(id, newName) {
  if (IS_ELECTRON) {
    const proj = await window.electronAPI.loadProject(id);
    if (proj) { proj.name = newName; proj.updatedAt = new Date().toISOString(); await window.electronAPI.saveProject(proj); }
  } else {
    const list = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
    const proj = list.find(p => p.id === id);
    if (proj) { proj.name = newName; localStorage.setItem(PROJECTS_KEY, JSON.stringify(list)); }
  }
}

/* [U7] ★반환값을 «버리지 않는다».
 * 이전엔 결과를 안 보고 그대로 renderGrid() 를 불러서, 삭제가 «실패해도» 화면엔 성공으로 보였다.
 * 「실패했는데 목록에서 사라진」 사용자는 지워진 줄 알고 다시 안 찾는다 — 그게 U7 의 숨은 전제조건이다. */
async function removeProject(id) {
  if (IS_ELECTRON) {
    return await window.electronAPI.deleteProject(id);
  } else {
    const list = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(list.filter(p => p.id !== id)));
  }
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function renderGrid() {
  let list = await loadProjects();
  const grid = document.getElementById('project-grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';

  if (!list.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  /* ★즐겨찾기가 맨 위로 — 그 안에서는 «원래 순서»를 그대로 둔다.
     별을 눌렀다고 최근순 정렬까지 뒤집으면 「내 목록이 왜 이렇게 됐지」가 된다.
     안정 정렬(sort 는 안정적)이라 같은 그룹 안 순서는 보존된다. */
  list = [...list].sort((a, b) => (b.favorite === true) - (a.favorite === true));

  list.forEach(proj => {
    const isPlanning = proj.type === 'planning';
    const isCollab   = !!(proj.collabRef && proj.collabRef.collabId);
    const card = document.createElement('div');
    card.className = 'project-card' + (isPlanning ? ' planning-card' : '') + (isCollab ? ' collab-card' : '');
    card.dataset.id = proj.id;
    // DBG-10: thumbnail 필드가 있으면 실제 이미지 표시, 없으면 기본 SVG
    const thumbContent = proj.thumbnail
      ? `<img src="${proj.thumbnail}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" onerror="this.style.display='none'">`
      : (isPlanning
        ? `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22c48a" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="12" y2="16"/></svg>`
        : `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#555" stroke-width="1.2"><rect x="5" y="5" width="30" height="30" rx="2"/><line x1="11" y1="15" x2="29" y2="15"/><line x1="11" y1="21" x2="29" y2="21"/><line x1="11" y1="27" x2="22" y2="27"/></svg>`);
    // 배지는 «둘 다» 붙을 수 있다(기획 프로젝트를 공유하는 경우) — 하나로 뭉치지 않는다.
    const badgeHtml = (isPlanning ? `<div class="planning-badge">📋 기획</div>` : '')
      + (isCollab ? `<div class="collab-badge" title="${proj.collabRef.role === 'owner' ? '내가 올린 공동작업본' : '초대받아 참여 중'}">👥 공동작업</div>` : '');
    /* ★「없는 글꼴」 배지는 카드를 다 그린 «뒤에» 따로 칠한다 — paintFontBadges() 참고
       (이 인라인 스크립트는 font-substitute.js보다 «먼저» 실행된다) */
    const duplicateBtnHtml = isPlanning
      ? ''
      : `<button class="card-action card-duplicate" onclick="duplicateProjectUI(event, '${proj.id}')" title="복제">⎘</button>`;
    // ★「원격으로 올리기」는 «아직 안 올린 카드»에만 뜬다. 이미 올린 카드에서 또 누르면
    //   무슨 일이 나는지 사용자가 알 수 없다 — 버튼을 없애서 그 질문 자체를 없앴다.
    //   (끊기·초대 관리는 환경설정 「협업」 탭이 맡는다. 카드에 다 넣으면 카드가 도구상자가 된다.)
    //   ★킬스위치(js/feature-flags.js COLLAB_ENABLED) 를 «여기서도» 본다 — 2026-09-02 이전에는
    //   안 봤다. 그래서 스위치를 꺼도 이 버튼만 살아남아 「눌리는데 서버가 404」였다.
    const shareBtnHtml = (!window.COLLAB_ENABLED || isCollab || !window.electronAPI?.collab)
      ? ''
      : `<button class="card-action card-share" onclick="shareProjectUI(event, '${proj.id}')" title="원격으로 올리기 — 다른 사람을 초대해 같이 편집합니다">👥</button>`;
    card.innerHTML = `
      <div class="card-thumb">${thumbContent}</div>
      <div class="card-body">
        ${badgeHtml}
        <div class="card-name" data-id="${proj.id}" ondblclick="startRename(event, '${proj.id}')" title="더블클릭하여 이름 변경">${proj.name || '이름 없음'}</div>
        <div class="card-date">${formatDate(proj.updatedAt)}</div>
      </div>
      <div class="card-actions">
        <button class="card-action card-fav${proj.favorite ? ' on' : ''}"
                onclick="toggleFavorite(event, '${proj.id}')"
                title="${proj.favorite ? '즐겨찾기 해제' : '즐겨찾기 — 목록 맨 위로'}"
                aria-pressed="${proj.favorite ? 'true' : 'false'}">${proj.favorite ? '★' : '☆'}</button>
        ${shareBtnHtml}
        ${duplicateBtnHtml}
        <button class="card-action card-delete" onclick="deleteProject(event, '${proj.id}')" title="삭제">✕</button>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.card-actions')) return;
      if (e.target.classList.contains('card-name-input')) return;
      openProject(proj.id, proj.type);
    });
    grid.appendChild(card);
  });
  paintFontBadges();
}

/* ── 카드의 「없는 글꼴」 배지 ──────────────────────────────────────────
 * ★그리드를 다시 그리지 «않고» 배지만 칠한다. 이유: 이 인라인 스크립트가
 *   font-substitute.js보다 먼저 실행돼서, 첫 renderGrid() 때는 window.gdtFontReport가
 *   «아직 없다». 실제로 그 순서 때문에 배지가 새로고침마다 사라졌다(2026-08-07 실측).
 *   그래서 load 뒤에 한 번 더 부른다 — 그리드 재빌드(IPC 포함) 없이 배지만 붙는다.
 * ★판정은 localStorage 기록 + 폰트 존재 검사뿐이라 프로젝트 파일을 읽지 않는다(목록이 느려지면 안 된다).
 */
function paintFontBadges() {
  if (!window.gdtFontReport) return;
  document.querySelectorAll('.project-card').forEach(card => {
    card.querySelector('.fsub-card-badge')?.remove();
    const st = window.gdtFontReport.state(card.dataset.id);
    if (!st.unresolved && !st.substituted) return;
    const el = document.createElement('div');
    if (st.unresolved) {
      el.className = 'fsub-card-badge';
      el.textContent = `⚠️ 없는 글꼴 ${st.unresolved}`;
      el.title = '이 기기에 없는 글꼴이 있습니다 — 대체할 글꼴 고르기';
    } else {
      el.className = 'fsub-card-badge is-done';
      el.textContent = `글꼴 대체됨 ${st.substituted}`;
      el.title = `없는 글꼴 ${st.substituted}개를 대체해 두었습니다 — 다시 고르기`;
    }
    el.onclick = (e) => openFontSubstituteUI(e, card.dataset.id);
    card.querySelector('.card-body')?.appendChild(el);
  });
}
window.addEventListener('load', paintFontBadges);

async function createProject() {
  const id = 'proj_' + Date.now();
  const now = new Date().toISOString();
  const emptySnap = JSON.stringify({
    version: 2, currentPageId: 'page_1',
    pages: [{ id: 'page_1', name: 'Page 1', label: '', pageSettings: { bg: window.PAGE_BG_DEFAULT, gap: 100, padX: 72, padY: 32, padXExcludesAsset: true }, canvas: '' }]
  });
  const proj = {
    id, name: 'Untitled',
    createdAt: now, updatedAt: now,
    version: 2,
    currentPageId: 'page_1',
    pages: [{ id: 'page_1', name: 'Page 1', label: '', pageSettings: { bg: window.PAGE_BG_DEFAULT, gap: 100, padX: 72, padY: 32, padXExcludesAsset: true }, canvas: '' }],
    currentBranch: 'dev',
    branches: {
      main: { snapshot: emptySnap, createdAt: Date.now(), updatedAt: Date.now() },
      dev:  { snapshot: emptySnap, createdAt: Date.now(), updatedAt: Date.now() }
    }
  };
  await saveNewProject(proj);
  // 자동 PM 폴더 보장 (Goditor 프로젝트만) — 실패해도 프로젝트 진입 막지 않음
  try {
    if (IS_ELECTRON && window.electronAPI?.ensureClaudePMFolder) {
      const res = await window.electronAPI.ensureClaudePMFolder({
        projectId: id,
        projectName: proj.name || 'Untitled',
      });
      if (res?.ok && res.folderPath) {
        try {
          const raw = localStorage.getItem('claudePM:folderMap') || '{}';
          const map = JSON.parse(raw);
          map[id] = res.folderPath;
          localStorage.setItem('claudePM:folderMap', JSON.stringify(map));
        } catch (_) {}
      }
    }
  } catch (e) {
    console.warn('[projects] ensureClaudePMFolder failed:', e?.message || e);
  }
  openProject(id);
}

async function createPlanningProject() {
  const id = 'plan_' + Date.now();
  const now = new Date().toISOString();
  const proj = { id, name: '기획 Untitled', type: 'planning', createdAt: now, updatedAt: now };
  await saveNewProject(proj);

/* [version-history] 카드의 🕐 버튼 → 버전 기록 모달.
 * ★js/version-history-ui.js 는 이 인라인 스크립트보다 «뒤»에 로드된다 → 옵셔널 호출로 방어한다
 *   (fsub 의 openFontSubstituteUI 와 같은 형태·같은 이유). */
/* [U7] 삭제 진행 중인 프로젝트 — 휴지통 이동은 느릴 수 있고 그 사이 ✕ 가 살아 있다. */
const _deleting = new Set();

async function deleteProject(e, id) {
  e.stopPropagation();
  const list = await loadProjects();
  const proj = list.find(p => p.id === id);
  if (!proj) return;
  // [U7] 기대되는 «되돌림 가능성»이 달라졌으니 그걸 말해준다 — 휴지통에서 되살릴 수 있다.
  if (!confirm(`"${proj.name}" 을(를) 휴지통으로 보낼까요?\n\n휴지통에서 되살릴 수 있습니다.`)) return;
  if (_deleting.has(id)) return;       // ★연타 방어 — 휴지통 이동은 느릴 수 있고, 그 사이 카드가 살아 있다
  _deleting.add(id);
  try {
    let r = await removeProject(id);
    if (r && r.ok === false) {
      // ★조용히 영구삭제로 폴백하지 «않는다» — 되돌릴 수 없다는 걸 알고 누르게 한다.
      if (r.reason === 'trash_failed' || r.reason === 'trash_partial') {
        // ★부분 이동이면 그렇게 말한다. 「옮길 수 없습니다」만 말하면 사실과 다르다
        //   (일부는 이미 휴지통에 있는데 「영구 삭제할까요」라고 물으면 사용자가 판단을 그르친다).
        // ★[A3] main 이 «잔재에서 실패하면 번들에 손대지 않고 중단»하도록 바뀌었다 —
        //   그래서 부분 이동은 이제 「낡은 잔재 몇 개만 치웠고 프로젝트는 온전하다」를 뜻한다.
        //   그 사실을 말해주지 않으면 사용자는 「반쯤 지워졌다」로 읽고 겁먹은 채 영구삭제를 누른다.
        const partial = r.reason === 'trash_partial'
          ? `\n\n낡은 잔재 ${r.deleted}개만 휴지통으로 옮겨졌고, 프로젝트 본체는 그대로 있습니다.` : '';
        if (!confirm(`휴지통으로 옮길 수 없습니다.\n(${r.message || '알 수 없는 이유'})${partial}\n\n«영구 삭제»하면 되돌릴 수 없습니다. 진행할까요?`)) return;
        r = await window.electronAPI.deleteProject(id, { permanent: true });
      }
      if (r && r.ok === false) { alert(`삭제하지 못했습니다 — ${r.message || r.reason}`); return; }
    }
    window.gdtFontReport?.clear?.(id);   // 글꼴 기록도 같이 거둔다(안 지우면 localStorage에 계속 쌓인다)
  } finally {
    // ★★어느 경로로 빠져나가도 «화면을 디스크와 맞춘다».
    //   초판은 실패/취소 return 이 renderGrid() 를 건너뛰어, 이미 휴지통에 간 프로젝트의 카드가 남았다.
    //   그 카드를 누르면 projects:load 폴백이 옛 잔재로 «좀비»를 되살린다.
    _deleting.delete(id);
    renderGrid();
  }
}

/* ── 원격으로 올리기 ────────────────────────────────────────────────────────
 * 이 프로젝트를 «방»으로 만든다. 내용은 여기서 안 올라간다 —
 * 에디터를 열어 동기화 루프가 섹션을 한 개씩 올린다.
 *   왜: proj.json 은 캔버스에 base64 이미지가 인라인돼 수십 MB 까지 간다(실측 85MB).
 *   서버리스 본문 한도(≈4.5MB)로는 통째 업로드가 «구조적으로» 불가능하다.
 * ★초대는 여기서 안 받는다 — Electron 은 native prompt() 를 «차단»한다(복제 기능이
 *   그것 때문에 한 번 죽었다, duplicateProjectUI 주석 참고). 초대는 환경설정 「협업」 탭.
 */
async function shareProjectUI(e, id) {
  e.stopPropagation();
  // ★킬스위치는 «버튼을 안 그리는 것»으로 끝나지 않는다 — 이 함수는 전역이라 남은 경로(콘솔·
  //   나중에 붙는 메뉴)로도 불릴 수 있다. 문을 두 겹으로 닫아 둔다(js/feature-flags.js).
  if (!window.COLLAB_ENABLED) return;
  if (!window.electronAPI?.collab) { alert('공동작업은 데스크탑 앱에서만 사용할 수 있습니다.'); return; }
  const st = await window.electronAPI.getAuthState?.();
  if (!st || !st.signedIn) { alert('공동작업은 로그인한 뒤에 쓸 수 있습니다.\n(계정이 있어야 상대를 초대할 수 있습니다.)'); return; }

  const list = await loadProjects();
  const src = list.find(p => p.id === id);
  if (!src) return;
  if (!confirm(`"${src.name || '이름 없음'}" 을(를) 원격으로 올릴까요?\n\n올리면 이메일로 다른 사람을 초대해 «같이» 편집할 수 있습니다.\n초대·끊기는 환경설정 › 협업 에서 관리합니다.`)) return;

  // ★없으면 «만들어서» 보낸다 — 빈 actorId 를 넘기면 서버가 내 패치를 못 걸러낸다.
  //   키·형식은 js/drag-utils.js getActorId 와 «같다»(블록 ID 에 박히는 값과 같아야 한다).
  const actorId = (() => {
    try {
      let v = localStorage.getItem('goditor.actorId') || '';
      if (!/^[a-z0-9]{4,8}$/.test(v)) { v = Math.random().toString(36).slice(2, 7); localStorage.setItem('goditor.actorId', v); }
      return v;
    } catch (_) { return ''; }
  })();
  const r = await window.electronAPI.collab.register({ projectId: id, name: src.name || '이름 없음', actorId });
  if (!r?.ok) { alert('원격으로 올리지 못했습니다: ' + collabReasonText(r?.reason, r)); return; }

  await renderGrid();
  requestAnimationFrame(() => {
    const card = document.querySelector(`.project-card[data-id="${id}"]`);
    if (card) { card.style.outline = '2px solid #2d6fe8'; setTimeout(() => { card.style.outline = ''; }, 1500); }
  });
}

/* 서버가 준 reason 을 «사용자가 다음에 뭘 할지 아는» 문장으로. 코드값을 그대로 보여주면
 * 사용자는 아무것도 못 한다. 모르는 값은 그대로 노출한다(빈칸이면 무슨 일인지조차 모른다). */
function collabReasonText(reason, r) {
  switch (reason) {
    case 'not_signed_in':  return '로그인이 필요합니다.';
    case 'invalid_session':return '로그인이 만료됐습니다. 다시 로그인해 주세요.';
    case 'offline':        return '서버에 닿지 못했습니다. 네트워크를 확인해 주세요.';
    case 'not_deployed':   return '서버에 공동작업 기능이 아직 배포되지 않았습니다.';
    case 'not_a_member':   return '이 공동작업본에 접근 권한이 없습니다.';
    case 'too_large':
    case 'section_too_large': return '섹션 하나가 너무 큽니다(이미지가 인라인으로 박혀 있습니다).';
    case 'server':         return `서버 오류(${r?.status || '5xx'}) — 잠시 뒤 다시 시도해 주세요.`;
    case 'bad_response':   return `서버가 알 수 없는 응답을 보냈습니다(${r?.status || '?'}).`;
    default:               return reason || '알 수 없는 오류';
  }
}

async function duplicateProjectUI(e, id) {
  e.stopPropagation();
  const list = await loadProjects();
  const src = list.find(p => p.id === id);
  if (!src) return;
  if (!IS_ELECTRON || !window.electronAPI?.duplicateProject) {
    alert('복제 기능은 데스크탑 앱에서만 사용 가능합니다.');
    return;
  }
  const defaultName = `${src.name || '이름 없음'} (사본)`;
  // Electron Chromium은 native prompt()를 차단함 — null/undefined만 반환되어 복제 불가했음.
  // window.prompt가 사용 가능한 경우(비-Electron)에만 시도, 실패하면 기본 이름으로 자동 복제.
  let input = null;
  try {
    if (typeof window.prompt === 'function') {
      input = window.prompt('새 프로젝트 이름', defaultName);
    }
  } catch (_) { /* Electron에서 throw 가능 */ }
  // input이 null이면 사용자가 cancel했거나 prompt 차단. 모달이 없으니 자동 진행 (취소 별도 제공).
  const newName = (input ?? '').trim() || defaultName;
  const res = await window.electronAPI.duplicateProject({ sourceProjectId: id, newName });
  if (!res?.ok) { alert('복제 실패: ' + (res?.error || '알 수 없는 오류')); return; }
  await renderGrid();
  requestAnimationFrame(() => {
    const card = document.querySelector(`.project-card[data-id="${res.newProjectId}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.outline = '2px solid #2d6fe8';
      setTimeout(() => { card.style.outline = ''; }, 1500);
    }
  });
}

function startRename(e, id) {
  e.stopPropagation();
  const nameEl = e.target;
  const current = nameEl.textContent;
  const input = document.createElement('input');
  input.className = 'card-name-input';
  input.value = current;
  nameEl.replaceWith(input);
  input.focus(); input.select();

  async function commit() {
    const newName = input.value.trim() || current;
    await renameProject(id, newName);
    renderGrid();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
  });
}

     projects:save-meta 는 read-merge-write 라 thumbnail·collabRef 를 지우지 않는다. */
async function toggleFavorite(ev, id) {
  ev.stopPropagation();                       // 카드 열기로 번지지 않게
  const btn = ev.currentTarget;
  const next = !btn.classList.contains('on');
  // ★먼저 화면을 바꾸고 저장한다 — 별 하나 누르는 데 디스크를 기다리게 하지 않는다.
  //   실패하면 되돌리고 «말한다»(조용히 되돌아가면 사용자는 눌린 줄 안다).
  btn.classList.toggle('on', next);
  btn.textContent = next ? '★' : '☆';
  btn.setAttribute('aria-pressed', String(next));
  btn.title = next ? '즐겨찾기 해제' : '즐겨찾기 — 목록 맨 위로';
  try {
    await window.electronAPI.saveProjectMeta(id, { favorite: next });
    /* ★한 틱 쉬고 다시 그린다 — 저장(파일 쓰기)과 목록 읽기가 붙어 있으면
       meta 의 mtime 이 아직 갱신 전이라 «방금 켠 별이 꺼진 채»로 그려질 수 있다.
       실제로 한 번 「저장은 됐는데 목록엔 안 뜬다」를 봤다. */
    await new Promise(r => setTimeout(r, 60));
    await renderGrid();                       // 정렬 반영
  } catch (e) {
    btn.classList.toggle('on', !next);
    btn.textContent = next ? '☆' : '★';
    alert('즐겨찾기를 저장하지 못했습니다.');
  }
}

function removeHomeTab(id) {

    if (!saved) return;
    saved.tabs = saved.tabs.filter(t => t.id !== id);
    if (saved.activeId === id) saved.activeId = saved.tabs[0]?.id || null;

    renderHomeTabs();
  } catch {}
}

        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.6" style="flex-shrink:0">
          <rect x="1" y="1" width="10" height="10" rx="1.5"/>
          <line x1="3.5" y1="4" x2="8.5" y2="4"/><line x1="3.5" y1="6.5" x2="8.5" y2="6.5"/><line x1="3.5" y1="9" x2="6.5" y2="9"/>
        </svg>
        <span class="home-proj-tab-name">${tab.name}</span>
        <button class="home-proj-tab-close" onclick="event.stopPropagation();removeHomeTab('${tab.id}')" title="닫기">
          <svg width="7" height="7" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="1" y1="1" x2="7" y2="7"/><line x1="7" y1="1" x2="1" y2="7"/>
          </svg>
        </button>
      </div>`).join('');
  } catch {}
}

/* ── .gdt 불러오기 (「파일 → 프로젝트 불러오기…」) ──
   실제 흐름은 js/io/gdt-import.js가 갖고 있다(편집기 페이지와 공용). 여기선
   «불러온 뒤 목록을 다시 그리는 것»만 등록한다 — 안 하면 새 프로젝트가 새로고침 전까지 안 보인다. */
window.__gdtOnImported = async () => { await renderGrid(); };

/* ── 「없는 글꼴」 다시 열기 ──
   불러올 때 뜬 대화상자를 닫았어도, 카드 배지로 언제든 다시 연다.
   ★열 때마다 문서를 다시 훑는다 — 그 사이에 글꼴을 설치했으면 목록에서 사라지는 게 맞다. */
async function openFontSubstituteUI(e, id) {
  e.stopPropagation();
  const list = await loadProjects();
  const proj = list.find(p => p.id === id);
  await window.openFontSubstitute?.({ projectId: id, projectName: proj?.name || '' });
  await renderGrid();
}

/* ── 내 계정 ────────────────────────────────────────────────────────────
 * 지금 앱엔 자기 등급을 볼 방법이 «아예 없어서», 등급이 제대로 내려왔는지
 * 확인하려면 DB 를 열어봐야 했다. 이 한 줄이 그걸 대신한다.
 *
 * ★표시명과 코드값을 가른다 — 서버가 주는 건 코드값(beta/free/starter/pro/promax),
 *   화면에 쓰는 건 표시명이다. 코드값을 그대로 그리면 서버가 이름을 바꾸는 순간 깨진다.
 * ★event_free 는 «옛 서버»가 주던 값이다. 뜻이 지금의 beta 와 같으므로 같이 받아준다.
 */
const PLAN_LABEL = {
  beta: 'BETA', event_free: 'BETA',
  free: 'FREE', starter: 'STARTER', pro: 'PRO', promax: 'PRO MAX',
};
const PLAN_CLASS = { beta: 'is-beta', event_free: 'is-beta', starter: 'is-paid', pro: 'is-paid', promax: 'is-paid' };

function paintAcct(st) {
  const box = document.getElementById('acct');
  if (!box) return;
  if (!st || !st.signedIn) { box.style.display = 'none'; closeAcctMenu(); return; }
  const code = String(st.plan || '').toLowerCase();
  const badge = document.getElementById('acct-plan');
  // ★모르는 코드값이면 «그 값을 그대로» 보여준다. 빈칸으로 두면 서버가 뭘 줬는지 알 수 없다.
  const planLabel = PLAN_LABEL[code] || (code ? code.toUpperCase() : '—');
  badge.textContent = planLabel;
  badge.className = 'acct-badge ' + (PLAN_CLASS[code] || '');
  const email = st.email || '';
  document.getElementById('acct-mail').textContent = email;
  document.getElementById('acct-menu-mail').textContent = email;
  // 아바타는 이니셜 한 글자 — 외부 이미지를 부르지 않는다(CSP img-src·오프라인).
  const av = document.getElementById('acct-avatar');
  if (av) av.textContent = (email.trim().charAt(0) || '?').toUpperCase();
  let until = '';
  if (st.accessUntil) {
    const d = new Date(st.accessUntil);
    if (!isNaN(d)) {
      const left = Math.ceil((d - Date.now()) / 86400000);
      until = d.toISOString().slice(0, 10) + ' 까지' + (left >= 0 && left <= 30 ? ' · ' + left + '일 남음' : '');
    }
  }
  // ★기간은 «평소엔 안 보인다» — 드롭다운 안에서만 「BETA · 2026-12-31 까지」 한 줄로.
  document.getElementById('acct-until').textContent = until ? (planLabel + ' · ' + until) : planLabel;
  box.style.display = 'block';
}

/* ── 계정 드롭다운 ───────────────────────────────────────────────────────
 * ★리스너는 «한 번만» 묶는다(acctWired). 이 페이지는 renderGrid()를 여러 번 도는데,
 *   그때마다 묶으면 클릭 한 번이 두 번 나간다 — 2026-08-15 설정 pane 이 두 번 그려져
 *   「클릭 한 번에 초대 두 번」이 나갔던 사고와 같은 계열이다.
 * ★키보드: Enter/Space(버튼 기본) 열기 · Esc 닫고 트리거로 복귀 · ↑↓ 항목 이동.
 */
let acctWired = false;
function acctItems() {
  return Array.from(document.querySelectorAll('#acct-menu [data-acct-item]'))
              .filter(el => !el.disabled);
}
function openAcctMenu(focusFirst) {
  const box = document.getElementById('acct');
  if (!box || box.style.display === 'none') return;
  box.classList.add('open');
  document.getElementById('acct-trigger')?.setAttribute('aria-expanded', 'true');
  if (focusFirst) acctItems()[0]?.focus();
}
function closeAcctMenu(focusTrigger) {
  const box = document.getElementById('acct');
  if (!box || !box.classList.contains('open')) return;
  box.classList.remove('open');
  const tr = document.getElementById('acct-trigger');
  tr?.setAttribute('aria-expanded', 'false');
  if (focusTrigger) tr?.focus();
}
function wireAcctMenu(api) {
  if (acctWired) return;                 // ★이중 결선 금지
  acctWired = true;

  const box  = document.getElementById('acct');
  const tr   = document.getElementById('acct-trigger');
  const menu = document.getElementById('acct-menu');
  if (!box || !tr || !menu) return;

  tr.addEventListener('click', (e) => {
    e.stopPropagation();
    box.classList.contains('open') ? closeAcctMenu() : openAcctMenu(false);
  });
  tr.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); openAcctMenu(true); }
  });
  // 바깥 클릭 — 문서에 «하나»만 건다
  document.addEventListener('click', (e) => {
    if (box.classList.contains('open') && !e.target.closest('#acct')) closeAcctMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && box.classList.contains('open')) { e.preventDefault(); closeAcctMenu(true); }
  });
  menu.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const items = acctItems();
    if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    items[n < 0 ? 0 : n].focus();
  });

  /* ★새로고침 = «서버에 물어 plan·accessUntil 을 새로 받는» 유일한 경로다.
   *   (auth:state 는 로컬 auth.json 을 다시 그릴 뿐이고, 이 앱엔 사용자용 ⌘R·리로드 메뉴가 없다.)
   *   아이콘 버튼으로 바뀌었을 뿐 분기(오프라인/기간만료/invalid_session)는 그대로 산다. */
  const rf = document.getElementById('acct-refresh');
  const rs = document.getElementById('acct-refresh-state');
  const setState = (t) => { if (rs) rs.textContent = t || ''; };
  if (rf) rf.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (rf.disabled) return;
    rf.disabled = true; rf.classList.add('is-busy'); setState('확인 중…');
    try {
      const r = await (api.refreshAuth ? api.refreshAuth() : null);
      // ★세션이 폐기됐으면(다른 기기 로그인 등) 이 화면에 머물게 두면 안 된다 —
      //   등급 표시가 사라진 채 「왜 안 되지」로 남는다. 만료 화면으로 넘겨서 다시 로그인하게 한다.
      if (r && r.reason === 'invalid_session') {
        rf.classList.remove('is-busy');
        setState('다시 로그인');
        setTimeout(() => { window.location.href = 'license.html'; }, 900);
        return;
      }
      paintAcct(await api.getAuthState());
      // ★오프라인이면 «조용히 실패»하면 안 된다 — 눌렀는데 아무 일도 안 일어난 걸로 보인다.
      //   만료도 마찬가지다 — 서버는 대답했는데 「갱신됨」이라고 쓰면 거짓말이 된다.
      setState((r && r.ok) ? '갱신됨'
             : (r && r.reason === 'offline') ? '오프라인'
             : (r && r.reason === 'expired') ? '기간만료'
             : '');
    } catch (_) { setState(''); }
    rf.classList.remove('is-busy');
    setTimeout(() => { setState(''); rf.disabled = false; }, 1600);
  });

  const up = document.getElementById('acct-upgrade');
  if (up) up.addEventListener('click', async (e) => {
    e.stopPropagation();
    closeAcctMenu();
    const st = await api.getAuthState();
    if (st && st.purchaseUrl && api.openExternalUrl) await api.openExternalUrl(st.purchaseUrl);
  });

  /* ★로그아웃 — 세션(userData/auth.json)을 지우고 로그인 화면으로 «되돌린다».
   *   ⛔새 IPC 를 만들지 않는다 — 이미 있는 auth:logout(main.js) / authLogout(preload) 을 쓴다.
   *   ★확인을 «받는다»: 위 두 항목(새로고침·요금제 열기)은 잘못 눌러도 되돌아오는데,
   *     이건 다시 들어오려면 이메일·비밀번호를 «다시» 쳐야 한다(오프라인이면 못 들어온다).
   *     좁은 드롭다운에서 한 칸 아래를 누르는 실수의 대가가 다른 항목과 다르다.
   *     (Electron 은 prompt() 만 막는다 — confirm() 은 이 파일이 이미 여러 곳에서 쓴다.)
   *   ★화면을 «반드시» 되돌린다: 지우기만 하고 이 화면에 남으면 프로젝트가 열리는데
   *     로그인은 안 된 «반쯤 로그아웃» 상태가 된다. 이동 경로는 위 acct-refresh 의
   *     invalid_session 분기와 «같은» license.html 이다(입구를 두 벌 만들지 않는다). */
  const out = document.getElementById('acct-logout');
  if (out) out.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('로그아웃할까요?\n\n다시 쓰려면 이메일·비밀번호로 다시 로그인해야 합니다.\n(작업한 프로젝트는 이 컴퓨터에 그대로 남습니다.)')) return;
    closeAcctMenu();
    try { await api.authLogout?.(); } catch (_) {}
    window.location.href = 'license.html';
  });
}

(async () => {
  const api = window.electronAPI;
  if (!api || !api.getAuthState) return;          // 브라우저에서 열었을 때 — 조용히 생략
  paintAcct(await api.getAuthState());
  wireAcctMenu(api);
})();

/* ── 보기 전환(그리드 / 리스트) ──────────────────────────────────────────
 * ★렌더러를 새로 만들지 않는다 — 카드 DOM 은 그대로 두고 #project-grid 의 클래스만 바꿔
 *   같은 카드를 한 줄 행으로 «접는다». 그래서 카드 열기·삭제·이름변경·배지·글꼴배지가
 *   두 보기에서 «같은 코드»로 돈다(분기 = 클래스 하나).
 * ★저장은 이 페이지가 이미 쓰는 localStorage 를 그대로 쓴다(새 저장소 신설 금지 —
 *   web-editor-open-tabs·claudePM:folderMap 과 같은 자리, Electron 이 ud 에 디스크로 남긴다).
 */
const VIEW_KEY = 'goditor_projects_view';
function getViewMode() {
  try { return localStorage.getItem(VIEW_KEY) === 'list' ? 'list' : 'grid'; } catch (_) { return 'grid'; }
}
function applyViewMode(mode, persist) {
  const m = (mode === 'list') ? 'list' : 'grid';
  document.getElementById('project-grid')?.classList.toggle('is-list', m === 'list');
  // ★선택 표시는 radio 의 checked 하나로 끝난다 — 클래스 토글을 따로 두지 않는다
  //   (두 개면 반드시 어긋난다). CSS 가 :has(.vt-radio:checked) 로 칩을 그린다.
  document.querySelectorAll('#view-toggle .vt-radio').forEach(r => { r.checked = (r.dataset.view === m); });
  if (persist) { try { localStorage.setItem(VIEW_KEY, m); } catch (_) {} }
}
(function wireViewToggle() {
  const wrap = document.getElementById('view-toggle');
  if (!wrap) return;
  // 클릭도 방향키도 결국 radio 의 change 로 모인다 — 결선은 «한 곳»뿐이다.
  wrap.addEventListener('change', (e) => {
    const r = e.target.closest('.vt-radio');
    if (r) applyViewMode(r.dataset.view, true);
  });
  applyViewMode(getViewMode(), false);   // 저장된 값으로 복원(첫 렌더 전에 켜도 무해)
})();
</script>

     카드의 🕐 버튼은 renderGrid() 가 «인라인 onclick» 으로 그리므로 별도 후처리가 필요 없다. -->
