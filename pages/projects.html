<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- GAP-006 CSP(Phase1): 원격 스크립트·eval·플러그인 차단. strict(주입 on* 완전차단)은 Phase2. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: ws://localhost:* http://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'none'">
<title>GODITOR</title>
<!-- ★「없는 글꼴 대체」 대화상자용 — 편집기와 «같은» 토큰·같은 모달 껍데기를 쓰려고 물린다.
     이 페이지의 <style>이 아래에 오므로 body/* 전역은 여전히 이 페이지 것이 이긴다.
     (실측: editor-base.css와 이 페이지 사이에 id/class 충돌 0건) -->
<link rel="stylesheet" href="../css/editor-base.css">
<link rel="stylesheet" href="../css/settings-modal.css">
<link rel="stylesheet" href="../css/notice.css">
<link rel="stylesheet" href="../css/font-substitute.css">
<link rel="stylesheet" href="../css/version-history.css">
<!-- ★[H3] 신고 창을 이 화면에서도 연다(복구 배너 → 원인 보내기). settings-modal.css 는 이미 위에 있다. -->
<link rel="stylesheet" href="../css/report-modal.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a1a; color: #e0e0e0;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Titlebar ── */
#titlebar {
  height: 44px; background: #1e1e1e; border-bottom: 1px solid #2a2a2a;
  display: flex; align-items: center; padding: 0 16px;
  -webkit-app-region: drag; flex-shrink: 0;
}
#titlebar * { -webkit-app-region: no-drag; }
/* ★신호등 자리는 «맥에서만». 윈도우엔 신호등이 없어 빈 공간이 된다(2026-08-29) */
/* editor-panels.css #logo-version-badge 와 같은 값 — 그 파일은 이 페이지가 로드하지 않는다 */
#logo-version-badge {
  font-size: var(--ui-fs-9); font-weight: var(--ui-fw-medium);
  color: var(--ui-text-dim); letter-spacing: 0.3px;
  border: 1px solid var(--ui-bg-hover);
  border-radius: 3px;
  padding: 1px 5px;
  margin-left: 6px;
  flex-shrink: 0;
}
.electron-app #titlebar { padding-left: 16px; }
.electron-app.is-mac #titlebar { padding-left: 80px; }
.electron-app.fullscreen #titlebar,
.electron-app.is-mac.fullscreen #titlebar { padding-left: 16px; }
#app-logo {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; color: #ccc;
  letter-spacing: 0.6px;
}

/* ── Main ── */
#main {
  flex: 1; display: flex; padding: 0; overflow: hidden;
}

/* ── 폴더 «한 화면»(시안 B, 2026-09-19) — 왼쪽 레일(#folder-rail)을 걷고 갤러리 위에 «폴더 타일 줄» ──
 * 정본: ~/.claude/skills/지디/dashboard/mockups/folder-layout-abc.html 의 B(.ftiles/.ftile/.crumb).
 * ★선택·강조 표시 — 파란 액센트 금지(현빈 2026-08-27). 보더 토큰·배경 var(--ui-border-mid)·밝기로만.
 * ★타일 안에 ⋯ 버튼을 «넣지» 않는다 — <button> 안에 <button> 은 HTML 파서가 바깥을 미리 닫는다
 *   (09-16 실기). ⇒ .ft-cell 감싸개 + 형제(.ft-tile, .ft-more), ⋯ 은 절대배치. */
#folder-zone { margin-bottom: 30px; }
#folder-zone.is-empty { margin-bottom: 16px; }
.fz-label {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
  font-size: 12px; font-weight: 700; letter-spacing: .3px; color: var(--ui-text-sub);
}
.fz-label .fz-count { color: var(--ui-text-dim); font-weight: 600; }
#folder-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.ft-cell { position: relative; min-width: 0; }
.ft-tile {
  width: 100%; min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; font: inherit; text-align: left; cursor: pointer; color: var(--ui-text);
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-mid); border-radius: var(--ui-radius-md);
  transition: border-color .15s;
}
.ft-tile:hover { border-color: var(--ui-divider); }
.ft-cell .ft-tile { padding-right: 36px; }   /* ⋯ 자리(hover 때만 보임) 예약 */
.ft-ico { display: flex; flex-shrink: 0; color: var(--ui-text-dim); }
.ft-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ft-name { font-size: 12px; font-weight: 600; color: var(--ui-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ft-sub { font-size: 11px; color: var(--ui-text-dim); white-space: nowrap; }
.ft-add { background: transparent; border-style: dashed; color: var(--ui-text-dim); }
.ft-add .ft-name { font-weight: 500; color: inherit; }
.ft-add:hover { color: var(--ui-text-sub); }
.ft-tile.is-drop-target { outline: 1px dashed var(--ui-text-dim); outline-offset: -2px; }
.ft-tile.is-fresh { background: var(--ui-border-mid); border-color: var(--ui-divider); }
.ft-editing { cursor: default; }
.ft-more {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  width: 22px; height: 22px; display: flex; opacity: 0; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 3px; color: var(--ui-text-dim);
  cursor: pointer; font-size: 14px; line-height: 1;
}
/* ★평소엔 display:none 이 아니라 «투명»으로 숨긴다 — display:none 은 Tab 포커스를 못 받아 키보드로 메뉴(이름변경·삭제)에
 *   갈 길이 없었다(09-19 이벨류). 투명이어도 Tab 으로 오면 :focus-visible 로 드러난다. */
.ft-cell:hover .ft-more, .ft-cell:focus-within .ft-more, .ft-more:focus-visible, .ft-more[aria-expanded="true"] { opacity: 1; }
.ft-more:hover { background: var(--ui-bg-hover, #3a3a3a); color: #fff; }
/* 이름 입력 중(.ft-editing)엔 ⋯ 를 감춘다 — ★JS 인라인 display:none 으로 하지 않는다. 그렇게 하면 «되돌리는» 코드가
 *   확정 갈래에만 있어 Esc 취소 뒤 ⋯ 가 영영 안 보였다(09-19 2라운드 ①). :has 는 입력칸이 «있는 동안만» 참이라
 *   확정·취소·실패·blur 어느 갈래로 끝나도 저절로 풀린다(되돌릴 상태가 없다). */
.ft-cell:has(.ft-editing) .ft-more { display: none; }
/* 인라인 이름 입력(새 폴더·이름 바꾸기) — 레일 시절 규칙에서 #folder-rail 한정자만 벗겼다 */
.fr-name-input {
  flex: 1; min-width: 0; font: inherit; font-size: 12px; color: #e0e0e0; background: #333; border: 1px solid #555;
  border-radius: 4px; padding: 1px 5px; outline: none;
}
/* 메뉴 구분선 — 카드 📁 메뉴·타일 ⋯ 메뉴가 같이 쓴다 */
.fr-divider { height: 1px; background: var(--ui-border); margin: 8px 4px; }
/* ★목록 보기 — 타일 줄은 «유지»하고 압축형으로만(분기 = #gallery-col.is-list-mode 클래스 하나) */
/* ★고정폭 칸 금지(09-20 polish5) — auto-fill minmax 격자는 모든 타일을 같은 폭(~185~210px)으로 묶어,
 *   줄에 자리가 남아도 긴 이름이 먼저 잘렸다. 목록 보기에선 «줄 바꿈 flex»로 타일이 제 내용만큼 쓰게 한다:
 *   짧은 이름은 그만큼만, 긴 이름은 줄 폭까지 넓어지고(이름 우선), 줄보다 길 때만 말줄임(max-width:100%). */
.is-list-mode #folder-tiles { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; }
.is-list-mode #folder-tiles > * { flex: 0 1 auto; min-width: 0; max-width: 100%; }
.is-list-mode #folder-tiles > .ft-tile { width: auto; }   /* 「+ 새 폴더」는 #folder-tiles 의 직계 — width:100% 면 줄을 통째로 먹는다 */
.is-list-mode .ft-tile { padding: 6px 10px; }
.is-list-mode .ft-cell .ft-tile { padding-right: 36px; }
.is-list-mode .ft-text { flex-direction: row; align-items: baseline; gap: 8px; flex: 1; overflow: hidden; }
/* ★이름 우선(09-19 2라운드 ②) — 가로 줄에선 .ft-sub(nowrap, min-width:auto)는 안 줄고 .ft-name(overflow:hidden → 최소폭 0)만
 *   줄어 이름이 먼저 잘렸다. 이름은 줄지 않게(칸보다 길 때만 말줄임), 「N개 · 언제」가 먼저 줄고 먼저 사라진다. 목록 보기 한정. */
.is-list-mode .ft-name { flex: 0 0 auto; max-width: 100%; }
.is-list-mode .ft-sub { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.is-list-mode .ft-ico svg { width: 14px; height: 14px; }
.is-list-mode #folder-zone { margin-bottom: 22px; }
.is-list-mode #folder-zone.is-empty { margin-bottom: 16px; }

/* ── 경로(폴더 안) — 「Projects › 폴더명」. Projects 는 흐리게(누르면 밖으로), 폴더명은 밝게 ── */
#gallery-title.is-inside #gal-tab-projects { color: var(--ui-text-dim); margin-right: 8px; }
#gallery-title.is-inside #gal-tab-projects:hover { color: #bbb; }
#gal-tab-projects.is-drop-target { outline: 1px dashed var(--ui-text-dim); outline-offset: 3px; border-radius: 3px; }
.gal-crumb-sep { color: var(--ui-text-dim); font-weight: 400; margin-right: 8px; }
/* ★h1 을 flex(세로 가운데)로 — 말줄임용 inline-block 은 baseline 이 아래 가장자리로 내려가 이름만 떠 보인다(9370 실측) */
#gallery-title { display: flex; align-items: center; }
#gal-crumb { display: inline-flex; align-items: center; min-width: 0; }
#gal-crumb-name {
  display: inline-block; max-width: 28ch; margin-right: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee;
}
#gal-crumb .fr-name-input { width: 22ch; flex: 0 1 22ch; min-width: 6ch; font-size: 14px; font-weight: 600; margin-right: 14px; }

/* ── 갤러리 칼럼 — 기존 #main 의 padding·스크롤을 «그대로» 물려받는다(그리드 위치 1px도 안 움직임) ── */
#gallery-col { flex: 1; min-width: 0; overflow-y: auto; padding: 40px 48px; }
#gallery-col::-webkit-scrollbar { width: 6px; }
#gallery-col::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* ── Header ── */
#header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
#header h1 { font-size: 18px; font-weight: 700; color: #f0f0f0; flex-shrink: 0; }
/* ★검색칸 자리 고정(B안 09-19) — 폴더 안에서 경로(Projects › 이름)만큼 h1 이 길어져도 검색칸이 출렁이지 않게,
 *   양옆(h1 · .header-actions)이 «같은 몫(flex 1 1 0)»을 나눠 갖는다. 검색칸은 늘 가운데. 내용이 몫보다 크면
 *   (min-width:auto 라) 그때만 밀린다 — 경로 이름은 28ch 말줄임이라 보통 폭에선 일어나지 않는다. */
#header > h1 { flex: 1 1 0; min-width: 0; }
/* h1 이 제 몫보다 길어지면 «폴더명»만 더 줄여 말줄임 — Projects·휴지통 탭은 안 줄인다 */
#gallery-title > .gal-tab { flex-shrink: 0; }
#gal-crumb { flex: 0 1 auto; }
#gal-crumb-name { min-width: 0; flex: 0 1 auto; }
/* ★min-width:max-content 가 «왜» 붙어 있나 (2026-09-21, 현빈 제보: New Design 글자가 두 줄로 깨짐)
 *   바로 위 #proj-search 주석은 「h1/.header-actions 는 flex-shrink:0」이라고 «말하지만» 사실이 아니었다 —
 *   .header-actions 의 flex-shrink:0(아래 .header-actions 규칙)을 이 줄의 `flex: 1 1 0` 이 덮어
 *   계산값이 shrink:1 이 됐다(실측: getComputedStyle(.header-actions).flexShrink === "1").
 *   ⇒ 창이 좁아지면 «줄어들면 안 되는 쪽»이 줄고, 버튼 높이는 32px 고정이라 글자가 상자 밖으로 삐져나왔다.
 *   실측 경계: 창 1300px 이상 한 줄 / 1280px 이하 두 줄(★깨짐).
 *   ⛔`flex: 1 1 0` 을 지우지 마라 — 그건 검색칸을 가운데 고정하는 B안(09-19)이다.
 *     대신 «내용보다 작아지지 않게» 바닥을 깐다. 폭이 모자라면 설계 의도대로 #proj-search 만 줄어든다
 *     (그 칸만 flex-shrink:1 · min-width:140px).
 *   회귀: tests/unit/projects-header-no-shrink.test.mjs */
#header > .header-actions { flex: 1 1 0; justify-content: flex-end; min-width: max-content; }
#header > #proj-search { flex: 0 1 320px; margin-left: 16px; margin-right: 16px; }

/* ── 프로젝트 검색(T-B, 2026-09-16) ──────────────────────────────────────
 * 껍데기는 #acct-trigger/#view-toggle 과 «같은 값»(높이32·radius7·같은 배경·보더 토큰) — 새 룩 신설 금지.
 * ★폭이 부족하면 «이 칸만» 줄어든다(flex-shrink 는 여기서만 1) — h1/.header-actions 는 flex-shrink:0. */
#proj-search {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 8px; margin-left: 16px;
  flex: 1 1 auto; min-width: 140px; max-width: 320px;
  background: var(--ui-bg-input); border: 1px solid var(--ui-border-strong); border-radius: 7px;
  color: var(--ui-text-dim);
}
#proj-search:focus-within { border-color: var(--ui-divider); color: var(--ui-text-sub); }
#proj-search svg { flex-shrink: 0; opacity: 0.7; }
#proj-search-input {
  flex: 1; min-width: 0; background: transparent; border: none; outline: none;
  font: inherit; font-size: var(--ui-fs-12); color: var(--ui-text-sub);
}
#proj-search-input::placeholder { color: var(--ui-text-dim); }
#proj-search-clear {
  flex-shrink: 0; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 3px; color: var(--ui-text-dim); cursor: pointer; font-size: 11px; line-height: 1;
}
#proj-search-clear:hover { background: var(--ui-bg-hover, #3a3a3a); color: #fff; }

/* ── 검색이 찾은 폴더 — 결과 위에 «칩»으로 (T-B) ── */
#search-folder-hits { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.sfc-chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px; border-radius: 13px; cursor: pointer;
  background: var(--ui-bg-input); border: 1px solid var(--ui-border-strong);
  color: var(--ui-text-sub); font-size: var(--ui-fs-12);
}
.sfc-chip:hover { background: var(--ui-bg-hover); color: #fff; }
.sfc-chip svg { opacity: 0.6; }

/* ── E3-b ㉯ 예고 배너 ── 정보지 제한이 아니다: [hidden]이면 레이아웃 자리도 안 먹는다
   (기본이 거의 언제나 이 상태다 — 창 밖이면 뜰 일이 없다). 모달·오버레이 금지, 한 줄. */
#sig-stale-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-mid);
  border-radius: var(--ui-radius-sm);
  padding: 8px 12px; margin-bottom: 14px;
  font-size: var(--ui-fs-12); color: var(--ui-text-sub);
}
#sig-stale-banner-close {
  background: transparent; border: none; cursor: pointer;
  color: var(--ui-text-dim); font-size: var(--ui-fs-12); line-height: 1; padding: 2px 4px;
}
#sig-stale-banner-close:hover { color: var(--ui-text); }

/* ── [H3] 지난 실행 복구 배너 ────────────────────────────────────────────
   ★#sig-stale-banner 와 «같은 꼴»이다 — 새 배너 모양을 만들지 않는다(변수도 그대로).
     다른 점은 색 하나뿐: 이건 「알림」이 아니라 「잃을 뻔한 것」이라 테두리를 세운다.
   ★모달이 아니다 — 자리를 차지하는 한 줄이고, 사용자가 하던 일을 막지 않는다.
   ⛔`hidden` 속성을 쓰지 않는다 — ID 셀렉터의 display 가 [hidden] UA 규칙을 이겨서
     «빈 회색 줄»이 남는다(#sig-stale-banner 에서 실제로 났던 회귀. PSB-1 참조). */
#recovery-banner {
  background: var(--ui-bg-card); border: 1px solid var(--ui-accent-primary);
  border-radius: var(--ui-radius-sm);
  padding: 10px 12px; margin-bottom: 14px;
  font-size: var(--ui-fs-12); color: var(--ui-text-sub);
}
#recovery-banner-row { display: flex; align-items: center; gap: 10px; }
#recovery-banner-msg { flex: 1; min-width: 0; }
#recovery-banner-headline { color: var(--ui-text); font-weight: 600; }
#recovery-banner-sub { display: block; margin-top: 2px; color: var(--ui-text-dim); }
#recovery-banner button {
  background: transparent; border: 1px solid var(--ui-border-mid); border-radius: var(--ui-radius-sm);
  color: var(--ui-text-sub); font-size: var(--ui-fs-12); line-height: 1;
  padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
#recovery-banner button:hover { color: var(--ui-text); border-color: var(--ui-text-dim); }
#recovery-banner button.primary { background: var(--ui-accent-primary); border-color: var(--ui-accent-primary); color: #fff; font-weight: 600; }
#recovery-banner button.primary:hover { background: var(--ui-accent-primary-hover); }
#recovery-banner button:disabled { opacity: .5; cursor: default; }
#recovery-banner-close { border: none !important; padding: 4px 6px !important; color: var(--ui-text-dim); }

#recovery-say { display: block; margin-top: 8px; color: var(--ui-text); }
#recovery-detail { display: none; margin-top: 10px; border-top: 1px solid var(--ui-border-mid); padding-top: 10px; }
#recovery-detail.on { display: block; }
#recovery-detail .rec-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid var(--ui-border-mid);
}
#recovery-detail .rec-item:last-child { border-bottom: none; }
#recovery-detail .rec-item-txt { flex: 1; min-width: 0; }
#recovery-detail .rec-item-title { color: var(--ui-text); }
#recovery-detail .rec-item-meta { display: block; margin-top: 2px; color: var(--ui-text-dim); word-break: break-all; }
#recovery-detail .rec-acts { display: flex; gap: 6px; flex-shrink: 0; }
#recovery-send-box { margin-top: 10px; }
#recovery-outgoing {
  display: none; margin-top: 8px; max-height: 220px; overflow: auto;
  background: var(--ui-bg-app); border: 1px solid var(--ui-border-mid);
  border-radius: var(--ui-radius-sm); padding: 8px 10px;
  font-family: 'SF Mono', 'Menlo', monospace;   /* ★레포 관례와 «같은 값» — design-gate 「기존 값과 대조」 항목 */
  font-size: 11px; line-height: 1.5; color: var(--ui-text-sub);
  white-space: pre-wrap; word-break: break-all;
}
#recovery-outgoing.on { display: block; }

#btn-new {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 32px;
  background: #2d6fe8; border: none; border-radius: 7px;
  color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background 0.15s;
}
#btn-new:hover { background: #3a7df0; }
/* 버튼 «글자»는 어떤 경우에도 두 줄이 되지 않는다 — 위 min-width 가 뚫려도 여기서 한 번 더 막는다.
   (버튼 height 가 32px 고정이라 두 줄이 되면 글자가 상자 밖으로 나간다 = 현빈이 본 그 모양) */
#btn-new, #btn-new-planning, #btn-new-label, #btn-new-planning-label { white-space: nowrap; }

#btn-new-planning {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 32px;
  background: #1a7a5e; border: none; border-radius: 7px;
  color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background 0.15s;
}
#btn-new-planning:hover { background: #22976f; }
/* [0920b] 비활성 — 「여기 있음」 색(초록)은 그대로 두고 «흐림»만 더한다(폴더 메뉴 비활성과 같은 규율).
   hover 도 같이 잠가야 «눌리는 것처럼» 안 보인다. */
#btn-new-planning[aria-disabled="true"],
#btn-new-planning[aria-disabled="true"]:hover {
  opacity: var(--ui-disabled-opacity); cursor: not-allowed; background: #1a7a5e;
}

/* ── Planning card styles ── */
.project-card.planning-card {
  border-left: 3px solid #22c48a;
}
.project-card.planning-card .card-thumb {
  background: #0f2420;
}
.planning-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: #22c48a;
  background: rgba(34,196,138,0.12); border: 1px solid rgba(34,196,138,0.3);
  border-radius: 4px; padding: 1px 6px; margin-bottom: 4px;
}
/* ── 공동작업 카드 ──
 * ★위 .planning-card / .planning-badge 와 «같은 뼈대»를 쓴다(테두리 3px + 작은 배지).
 *   새 룩을 만들지 않는다 — 색만 계정 배지의 파랑(.acct-badge.is-beta)과 맞췄다.
 * 이 배지가 있는 카드는 「내 것만이 아니다」는 뜻이다. 로컬본과 눈으로 갈려야 한다. */
.project-card.collab-card {
  border-left: 3px solid #2d6fe8;
}
.collab-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: #6fa3f7;
  background: rgba(45,111,232,0.18); border: 1px solid rgba(45,111,232,0.45);
  border-radius: 4px; padding: 1px 6px; margin-bottom: 4px;
}
/* ── 소속 폴더 배지(T-B) — 검색 결과일 때만 뜬다(평소엔 레일 선택이 이미 말해준다) ──
 * ★.planning-badge/.collab-badge 와 «같은 꼴»(크기·굵기·radius·padding) — 새 룩 신설 금지.
 *   색만 다르다: 파란/초록 액센트가 아니라 --ui-text-dim + 옅은 흰 배경(중립 정보 배지). */
.folder-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: var(--ui-text-dim, #969696);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  border-radius: 4px; padding: 1px 6px; margin-bottom: 4px;
}
.header-actions {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

/* ── 내 계정 ─────────────────────────────────────────────────────────────
 * ★평소엔 «[아바타] 이메일 [등급배지]» 한 줄뿐이다. 이용기간·동작 버튼은 접는다 —
 *   헤더에 설명이 너무 많다는 지적(2026-08-26)의 근원이 그 두 줄이었다.
 * ★메뉴 «행»은 새로 만들지 않는다 — editor-base.css 의 공용 .tab-add-item 을 그대로 쓴다
 *   (이 페이지가 이미 그 파일을 로드한다). 껍데기(#acct-menu)만 #tab-add-menu 를 본떴다.
 * ★색은 전부 --ui-* 토큰. (이 파일의 «기존» 줄들은 하드코딩 관례가 남아 있으나 별건.)
 * ── */
#acct { display: none; position: relative; }

#acct-trigger {
  display: flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 8px 0 5px;
  background: var(--ui-bg-input); border: 1px solid var(--ui-border-strong); border-radius: 7px;
  font-family: inherit; font-size: var(--ui-fs-12); color: var(--ui-text-sub);
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
#acct-trigger:hover { background: var(--ui-bg-hover); border-color: var(--ui-divider); }
/* 아바타 = 이메일 첫 글자 원형. ★외부 이미지를 쓰지 않는다(CSP·오프라인). */
.acct-avatar {
  width: 22px; height: 22px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--ui-bg-hover, #3a3a3a); color: var(--ui-text);
  border: 1px solid var(--ui-border-mid, #555);
  font-size: var(--ui-fs-base); font-weight: var(--ui-fw-bold); line-height: 1;
}
/* 열림 표시 — #publish-dropdown-wrap.open .publish-dd-chevron 과 «같은» 회전 규칙 */
.acct-chevron { flex-shrink: 0; opacity: 0.55; transition: transform 0.15s; }
#acct.open .acct-chevron { transform: rotate(180deg); }

#acct-mail  { color: #e0e0e0; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#acct-until { color: #9e9e9e; }
/* 배지는 이 파일의 .planning-badge 와 같은 꼴을 따른다 — 새 룩을 만들지 않는다 */
.acct-badge {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700; letter-spacing: .02em;
  border-radius: 4px; padding: 2px 7px;
  color: #9e9e9e; background: rgba(255,255,255,0.06); border: 1px solid #444;
}
.acct-badge.is-beta { color: #6fa3f7; background: rgba(45,111,232,0.18); border-color: rgba(45,111,232,0.45); }
.acct-badge.is-paid { color: #7fc87f; background: rgba(127,200,127,0.15); border-color: rgba(127,200,127,0.40); }

/* 드롭다운 껍데기 — editor-base.css #tab-add-menu 와 «같은» 규격(카드배경·1px·radius 8·shadow-lg) */
#acct-menu {
  display: none;
  position: absolute; top: calc(100% + 6px); right: 0;
  min-width: 244px;
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-mid);
  border-radius: 8px; padding: 6px 0;
  box-shadow: var(--ui-shadow-lg);
  z-index: 9999;
}
#acct.open #acct-menu { display: block; }
.acct-dd-head { padding: 7px 14px 6px; }
.acct-dd-mail {
  font-size: var(--ui-fs-12); color: var(--ui-text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 「BETA · 2026-12-31 까지」 + (상태문구) + 새로고침 아이콘 — 한 줄 */
.acct-dd-meta {
  display: flex; align-items: center; gap: 6px; margin-top: 5px;
  font-size: var(--ui-fs-10); color: var(--ui-text-muted);
}
/* editor-panels.css .pub-dd-divider 와 같은 값 — 그 파일은 이 페이지가 로드하지 않는다 */
.acct-dd-divider { height: 1px; background: var(--ui-border); margin: 5px 0; }
/* 공용 .tab-add-item 을 <button> 으로 쓰기 위한 «중화»만 한다(룩은 그대로 물려받는다) */
#acct-menu .tab-add-item {
  width: 100%; background: transparent; border: none;
  font-family: inherit; text-align: left;
}
/* ★새로고침 = 아이콘 버튼(회전 화살표). 라벨 텍스트 없음 · title/aria-label 로 뜻을 남긴다 */
#acct-refresh {
  width: 22px; height: 22px; margin-left: auto; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent; border-radius: var(--ui-radius-sm);
  color: var(--ui-text-sub); cursor: pointer; transition: all 0.12s;
}
#acct-refresh:hover    { background: var(--ui-bg-hover); border-color: var(--ui-border); color: var(--ui-text); }
#acct-refresh:disabled { opacity: var(--ui-disabled-opacity); cursor: default; }
#acct-refresh.is-busy svg { animation: acct-spin 0.9s linear infinite; }
@keyframes acct-spin { to { transform: rotate(360deg); } }
/* 상태문구(확인 중…/갱신됨/오프라인/기간만료/다시 로그인) — 아이콘 «옆» 임시 텍스트.
   아이콘만 남기면 눌러도 아무 일이 없어 보인다. 툴팁은 마우스를 다시 올려야 보이고,
   이 페이지엔 토스트 기반이 없다(editor-toast.css 미로드) → 제자리 텍스트가 정답. */
#acct-refresh-state { flex-shrink: 0; color: var(--ui-text-sub); }

/* ── 보기 전환(그리드 / 리스트) ──────────────────────────────────────────
 * 껍데기 규격은 #acct-trigger 와 같다(높이 32 · radius 7 · 같은 배경/보더 토큰).
 * ★**선택 표시에 파랑(액센트)을 쓰지 않는다**(현빈 지시 2026-08-27).
 *   구분은 «눌린 면(배경 칩) + 아이콘 밝기» 둘로만 낸다 —
 *   선택   = 칩 var(--ui-border-mid) #3a3a3a + 아이콘 var(--ui-text) #e0e0e0
 *   비선택 = 칩 없음(투명)          + 아이콘 var(--ui-text-dim) #969696
 *   (#zoom-ctrl 의 «가라앉은 통 + 밝은 칩» 패턴과 같은 뼈대. .tb-btn 은 .active 가
 *    accent-primary 파랑이라 이번엔 쓰지 않는다.)
 * ★진짜 radio 를 쓴다(시각적으로만 숨김) — 방향키 전환·그룹 시맨틱을 브라우저가 준다.
 * ── */
#view-toggle {
  display: flex; align-items: center; gap: 2px;
  height: 32px; padding: 0 3px;
  background: var(--ui-bg-input); border: 1px solid var(--ui-border-strong); border-radius: 7px;
  margin: 0;   /* fieldset 기본 여백 제거 */
}
.vt-item {
  display: flex; align-items: center; justify-content: center;
  width: 26px; height: 24px; border-radius: var(--ui-radius-sm);
  cursor: pointer; position: relative;
  color: var(--ui-text-dim);
  transition: background 0.12s, color 0.12s;
}
.vt-item:hover { color: var(--ui-text-sub); }
/* 선택 = 칩 + 밝은 아이콘 (색상 액센트 없음) */
.vt-item:has(.vt-radio:checked) { background: var(--ui-border-mid); color: var(--ui-text); }
/* radio 는 «화면에서만» 숨긴다 — display:none 이면 포커스·방향키가 죽는다 */
.vt-radio {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}
/* 라벨은 스크린리더 전용 — 화면엔 title(툴팁)로만 뜬다 */
.vt-sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}
/* 키보드 포커스는 «보여야» 한다 — radio 를 숨겼으니 칩에 링을 그린다 */
.vt-radio:focus-visible ~ .vt-ico { outline: 1px solid var(--ui-text-sub); outline-offset: 2px; border-radius: 2px; }
.vt-ico { display: flex; }

/* ── 리스트 보기 — «같은 카드 DOM»을 한 줄 행으로 접는다(렌더러 분기 없음) ── */
#project-grid.is-list { display: flex; flex-direction: column; gap: 4px; }
#project-grid.is-list .project-card { display: flex; align-items: center; border-radius: var(--ui-radius-md); }
#project-grid.is-list .project-card:hover { transform: none; }
#project-grid.is-list .card-thumb {
  width: 46px; height: 30px; flex-shrink: 0;
  border-bottom: none; border-right: 1px solid var(--ui-bg-hover);
}
#project-grid.is-list .card-thumb svg { width: 16px; height: 16px; }
#project-grid.is-list .card-body {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  /* 오른쪽 = hover 시 뜨는 .card-actions 자리. 버튼 «최대 개수»에 맞춘다
     (공유는 조건부라 2~3개 — 예약은 최대치 기준이어야 겹침이 안 난다).
     ★산식: 3×22(버튼) + 2×4(gap) + 10(.card-actions 의 right) = 84px.
     ⚠️2026-08-28 실측으로 잡은 것: 「버전 기록(🕐)」을 걷어내며 «옛 값 76px» 로 되돌렸더니
       .card-date 가 액션과 8px 겹쳤다 — ★76 은 애초에 틀린 값이었다(3개면 84 다).
       4개 시절의 110px(=4×22+3×4+10)이 정확했던 탓에 그동안 안 드러났을 뿐이다.
       ⇒ 되돌릴 때 «옛 값»을 믿지 말고 다시 계산·실측한다. 실측: 겹침 0 · 남는 여백 0.
     ★2026-09-16(T-A) — 「폴더로 이동」 버튼(📁)이 상시로 추가돼 기본이 «4개»(즐겨찾기·폴더·복제·삭제)가
       됐다. 다시 4×22+3×4+10=110px 로 올린다(공유까지 겹치면 5개지만 그건 이 표의 기존 한계 밖). */
  padding: 6px 110px 6px 12px;
}
#project-grid.is-list .card-name { flex: 1; min-width: 0; margin-bottom: 0; }
#project-grid.is-list .card-date { flex-shrink: 0; }
#project-grid.is-list .planning-badge,
#project-grid.is-list .collab-badge,
#project-grid.is-list .folder-badge   { margin-bottom: 0; flex-shrink: 0; order: -1; }
#project-grid.is-list .fsub-card-badge { margin-top: 0; flex-shrink: 0; }
#project-grid.is-list .card-actions { top: 50%; transform: translateY(-50%); right: 10px; }

/* ── Grid ── */
#project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

/* ── Card ── */
.project-card {
  background: #242424; border: 1px solid #2e2e2e;
  border-radius: 10px; overflow: hidden;
  cursor: pointer; position: relative;
  transition: border-color 0.15s, transform 0.12s;
}
.project-card:hover { border-color: #484848; transform: translateY(-2px); }

.card-thumb {
  height: 130px; background: #1e1e1e;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid #2e2e2e;
  overflow: hidden; /* DBG-10: 썸네일 이미지 잘림 처리 */
}
/* ★카드 그림은 «첫 화면»(맨 윗머리)을 보여준다 — object-position: top.
 * 썸네일은 첫 섹션 «통째»를 200px 너비로 줄인 그림이라 «세로로 아주 길다»
 * (js/io/save-load.js captureThumbnail — 실측 200×330, 긴 상세페이지면 200×1000 도 나온다).
 * object-position 의 기본값은 center 라, cover 가 그 긴 그림의 «가운데 띠»만 130px 칸에 남긴다.
 * 상세페이지의 가운데는 대개 본문 여백이다 ⇒ 카드가 «하얀 빈 칸»이 된다.
 *   실측(2026-09-21, 이 워크트리 9549): 200×330 썸네일 · 칸 210.3×130 · cover 배율 1.0516 →
 *   원본 y 103~227 만 보였다. 제목·배지·이미지가 전부 잘려 카드가 흰 칸이었다.
 * 페이지를 알아보게 하는 것은 «맨 위»(제목·배너·히어로)다. 그래서 위를 맞춘다.
 * ⛔ 인라인 style 로 되돌리지 마라 — 리스트 보기(46×30)도 «같은 img»를 쓴다. 한 자리에서 정한다.
 * 기계 검사: tests/dom/card-thumb-top.dom.spec.js (보이는 띠가 원본 y=0 을 포함하는지 «계산»으로 잰다). */
.card-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: top;
  display: block;
}
.card-body { padding: 12px; }
.card-name {
  font-size: 12px; font-weight: 600; color: #e0e0e0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.card-date { font-size: 10px; color: #555; }

.card-actions {
  position: absolute; top: 8px; right: 8px;
  display: none; gap: 4px;
}
.project-card:hover .card-actions { display: flex; }
.card-action {
  width: 22px; height: 22px;
  background: rgba(24,24,24,0.9); border: 1px solid #3a3a3a;
  border-radius: 4px; color: #666; font-size: 12px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  line-height: 1;
}
.card-action:hover { background: #2d6fe8; border-color: #2d6fe8; color: #fff; }
/* [R1] 비활성 카드 버튼(기획 카드의 📁) — ⛔disabled 속성 대신 aria-disabled: disabled 버튼은 크로미움에서 hover 가 안 와 title 툴팁이 안 뜬다 */
.card-action.is-disabled, .card-action.is-disabled:hover { opacity: .4; cursor: not-allowed; background: rgba(24,24,24,0.9); border-color: #3a3a3a; color: #666; }
.card-delete:hover { background: #c0392b; border-color: #c0392b; }

/* ── 즐겨찾기 ──
   ★켜진 별은 «hover 없이도» 보여야 한다. 나머지 액션은 hover 때만 뜨지만,
     즐겨찾기는 「이 카드가 즐겨찾기다」를 «알리는» 표시라 숨으면 존재 이유가 없다.
   ⛔새 버튼 «모양»을 만들지 않는다 — 칩(배경·테두리·크기)은 복제·삭제와 «똑같이» 두고
     바뀌는 건 «글리프 색»뿐이다. 켜졌다고 테두리·배경까지 금색으로 칠하면
     같은 줄에 선 세 버튼 중 하나만 다른 언어를 쓰게 된다(현빈 지적 2026-09-03).
     hover 에서 채워지는 건 기존 규율 그대로 — .card-delete:hover 가 빨강으로 차는 것과 같다. */
.project-card .card-fav.on { color: #f0b429; }
.project-card:not(:hover) .card-actions:has(.card-fav.on) { display: flex; }
.project-card:not(:hover) .card-actions:has(.card-fav.on) > :not(.card-fav) { display: none; }
.card-fav:hover { background: #f0b429; border-color: #f0b429; color: #1a1a1a; }

/* ── 카드의 「폴더로 이동」 작은 메뉴(T-A) — #tab-add-menu 와 «같은» 껍데기 규격 ── */
.card-folder-menu {
  position: absolute; z-index: 9999;
  min-width: 200px; max-height: 260px; overflow-y: auto;
  background: var(--ui-bg-card); border: 1px solid var(--ui-border-mid);
  border-radius: 8px; padding: 6px 0;
  box-shadow: var(--ui-shadow-lg);
}
.card-folder-menu .tab-add-item { width: 100%; background: transparent; border: none; font-family: inherit; text-align: left; }
.card-folder-menu .tab-add-item.is-current { color: var(--ui-text); background: var(--ui-border-mid); }
/* [polish3] 눌러도 달라질 게 없는 항목(폴더 밖 프로젝트의 「폴더에서 빼기」) — 기획 카드 📁 와 같은 규율:
   ⛔disabled 속성 대신 aria-disabled(툴팁이 뜨게). 「여기 있음」 배경은 그대로 두고 «흐림»만 더한다. */
.card-folder-menu .tab-add-item[aria-disabled="true"],
.card-folder-menu .tab-add-item[aria-disabled="true"]:hover {
  opacity: var(--ui-disabled-opacity); cursor: not-allowed; color: var(--ui-text-dim);
}

/* ── Empty state ── */
#empty-state {
  display: none; text-align: center; padding: 100px 0; color: #444;
}
#empty-state svg { opacity: 0.2; margin-bottom: 16px; }
#empty-state p { font-size: 13px; line-height: 1.7; }
/* ★루트인데 «폴더 밖 프로젝트»만 0개 — 큰 빈 화면(100px)을 쓰지 않는다. 라벨 아래 한 줄 안내뿐. */
#empty-state.is-compact { padding: 0 0 24px; text-align: left; color: var(--ui-text-dim); }
#empty-state.is-compact svg { display: none; }
#empty-state.is-compact p { font-size: 12px; }

/* ── 갤러리 탭(프로젝트/휴지통) — 제목 자리를 나눠 쓴다 ── */
.gal-tab {
  background: none; border: 0; padding: 0; margin: 0 14px 0 0; cursor: pointer;
  font: inherit; color: #666; letter-spacing: inherit;
}
.gal-tab.is-on { color: #eee; }
.gal-tab:hover { color: #bbb; }
.gal-tab:focus-visible { outline: 2px solid var(--ui-accent-primary, #2d6fe8); outline-offset: 3px; border-radius: 3px; }
/* ★아이콘 탭 — h1 을 그대로 상속하면 이모지가 글자보다 과하게 크다.
     크기만 낮추고 색·hover·is-on 규칙은 .gal-tab 것을 «그대로» 쓴다(새 색 0). */
.gal-tab-icon { font-size: 0.72em; line-height: 1; vertical-align: baseline; }

/* ── 휴지통 목록 — 카드가 아니라 «행»이다(되살릴 것을 고르는 화면이지 둘러보는 화면이 아니다) ── */
#trash-list { padding: 4px 0 40px; }
.trash-note {
  color: #888; font-size: 12px; padding: 10px 12px; margin-bottom: 10px;
  border: 1px solid var(--ui-border, #333); border-radius: 6px; background: rgba(255,255,255,.02);
}
.trash-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-bottom: 1px solid var(--ui-border, #2c2c2c);
}
.trash-row:hover { background: rgba(255,255,255,.03); }
.trash-name { flex: 1 1 auto; color: #ddd; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trash-when { flex: 0 0 auto; color: #777; font-size: 12px; font-variant-numeric: tabular-nums; }
/* ★남은 날짜는 «경고»가 아니라 «정보»다 — 3일 이하일 때만 눈에 띄게 한다 */
.trash-left { flex: 0 0 auto; color: #777; font-size: 12px; font-variant-numeric: tabular-nums; }
.trash-left.soon { color: #e0a06c; }
.trash-btn {
  flex: 0 0 auto; background: #2a2a2a; border: 1px solid var(--ui-border-strong, #444);
  color: #ccc; border-radius: 4px; height: 24px; padding: 0 10px; font-size: 12px; cursor: pointer;
}
.trash-btn:hover { background: #333; color: #eee; }
.trash-btn.danger:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
#trash-empty { color: #666; font-size: 13px; padding: 40px 0; text-align: center; }

/* ── 홈 탭바 ── */
#home-tab-bar {
  display: flex; align-items: center; gap: 3px;
  margin-left: 12px; flex-shrink: 1; min-width: 0; overflow: hidden;
  -webkit-app-region: no-drag;
}
.home-proj-tab {
  display: flex; align-items: center; gap: 5px;
  padding: 0 8px; height: 26px;
  width: 148px; flex-shrink: 0;
  background: rgba(255,255,255,0.05); border: 1px solid #333;
  border-radius: 6px; cursor: pointer;
  font-size: 12px; font-weight: 500; color: #777;
  transition: background 0.12s, color 0.12s;
  overflow: hidden;
}
.home-proj-tab:hover { background: rgba(255,255,255,0.1); color: #bbb; }
.home-proj-tab-name {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.home-proj-tab-close {
  width: 14px; height: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 3px;
  color: #555; cursor: pointer; transition: all 0.1s;
}
.home-proj-tab-close:hover { background: #555; color: #ccc; }

/* ── Rename input ── */
.card-name-input {
  font-size: 12px; font-weight: 600; color: #e0e0e0;
  background: #333; border: 1px solid #555;
  border-radius: 4px; padding: 1px 5px; width: 100%;
  outline: none;
}
</style>
</head>

             그건 2026-09-21 T-064 로 «사실이 아니게» 됐다(실측: 목록에 뜨고 📋 기획 배지·열기·이름변경·삭제 전부 된다).
             꺼 둔 이유가 「기술이 안 된다」에서 「현빈이 그러라고 했다」로 바뀌었으면 툴팁도 같이 바뀌어야 한다 —

       ⛔`hidden` 속성이 아니라 style="display:none" — PSB-1 회귀 방지(위 CSS 주석 참조).
       ★★[보낼 내용 그대로 보기]가 이 화면의 «가장 중요한» 버튼이다. 「진단 정보가
         포함됩니다」 같은 뭉뚱그린 문장 금지 — 나갈 줄을 그대로 보여준다.
       ★★비상 사본은 «문서 본문 그 자체»라 신고에 절대 안 붙는다. 되살리기·파일 열기는
         전부 «로컬»이다(main.js recovery:restore / recovery:reveal). -->
  <div id="recovery-banner" style="display:none" role="status">
    <div id="recovery-banner-row">
      <span id="recovery-banner-msg">
        <span id="recovery-banner-headline"></span>
        <small id="recovery-banner-sub"></small>
      </span>
      <button type="button" id="recovery-restore" class="primary" style="display:none">되살리기</button>
      <button type="button" id="recovery-toggle" aria-expanded="false" aria-controls="recovery-detail">자세히</button>
      <button type="button" id="recovery-banner-close" aria-label="나중에 보기" title="나중에 — 다음 실행 때 다시 보여줍니다">✕</button>
    </div>
    <!-- 결과 한 줄(되살렸다·못 했다). ⛔alert 가 아니다 — 이 배너는 사용자를 막지 않는다. -->
    <small id="recovery-say" role="status" aria-live="polite" style="display:none"></small>
    <div id="recovery-detail"></div>
  </div>
  <!-- ── 폴더 구역(B안) — 루트에서만 보인다. 폴더 안·검색 중·휴지통에선 renderFolderChrome() 이 숨긴다. -->
  <section id="folder-zone" aria-label="폴더">
    <div class="fz-label" id="fz-label">폴더 <span class="fz-count"></span></div>
    <div id="folder-tiles"></div>
  </section>
  <div class="fz-label" id="loose-label" style="display:none"><span class="fz-label-text">폴더 밖 프로젝트</span> <span class="fz-count"></span></div>
  <div id="search-folder-hits"></div>
  <div id="project-grid"></div>
  <div id="trash-list" style="display:none"></div>
  <div id="empty-state">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#888" stroke-width="1.2">
      <rect x="8" y="6" width="32" height="36" rx="3"/>
      <line x1="15" y1="18" x2="33" y2="18"/>
      <line x1="15" y1="25" x2="33" y2="25"/>
      <line x1="15" y1="32" x2="24" y2="32"/>
    </svg>
    <p id="empty-state-text">아직 프로젝트가 없어요.<br>새 프로젝트를 만들어보세요.</p>
  </div>
  </div><!-- /#gallery-col -->
</div>

<!-- ★킬스위치 단일 원본(js/feature-flags.js) — 이 인라인 스크립트가 window.COLLAB_ENABLED 를
     읽으므로 «반드시 먼저» 실행돼야 한다. 에디터(index.html)도 같은 파일을 읽는다. -->
<script src="../js/feature-flags.js"></script>
<script src="../js/notice.js"></script>
<script src="../js/entitlement-banner.js"></script>
<!-- ★[H3] 지난 실행 복구. recovery-banner.js = 판정·문구(DOM 의존 0),
     report-modal.js = «기존» 신고 창 그대로(새 전송 경로를 만들지 않는다 — 재사용).
     ⛔js/report-buffer.js 는 «일부러» 안 싣는다: 이 화면에 새 console 후킹을 들이는 건
       이 단위의 일이 아니다. 없으면 ReportBuffer.list() 자리가 빈 배열이 될 뿐이고
       (report-modal.js 가 이미 그렇게 방어한다), 복구 줄은 메인이 만들어 준다. -->
<script src="../js/recovery-banner.js"></script>
<script src="../js/report-modal.js"></script>

<script>
const IS_ELECTRON = !!window.electronAPI?.isElectron;

/* ── 스토리지 추상화 (Electron: 파일, 브라우저: localStorage) ── */
const PROJECTS_KEY = 'sangpe-projects';

async function loadProjects() {
  if (IS_ELECTRON) {
    return await window.electronAPI.listProjects();
  }
  try { return JSON.parse(localStorage.getItem(PROJECTS_KEY)) || []; } catch { return []; }
}

async function saveNewProject(proj) {
  if (IS_ELECTRON) {
    await window.electronAPI.saveProject(proj);
  } else {
    const list = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
    list.push(proj);
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(list));
  }
}

async function renameProject(id, newName) {
  if (IS_ELECTRON) {
    const proj = await window.electronAPI.loadProject(id);
    if (proj) { proj.name = newName; proj.updatedAt = new Date().toISOString(); await window.electronAPI.saveProject(proj); }
  } else {
    const list = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
    const proj = list.find(p => p.id === id);
    if (proj) { proj.name = newName; localStorage.setItem(PROJECTS_KEY, JSON.stringify(list)); }
  }
}

/* [U7] ★반환값을 «버리지 않는다».
 * 이전엔 결과를 안 보고 그대로 renderGrid() 를 불러서, 삭제가 «실패해도» 화면엔 성공으로 보였다.
 * 「실패했는데 목록에서 사라진」 사용자는 지워진 줄 알고 다시 안 찾는다 — 그게 U7 의 숨은 전제조건이다. */
async function removeProject(id) {
  if (IS_ELECTRON) {
    return await window.electronAPI.deleteProject(id);
  } else {
    const list = JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
    localStorage.setItem(PROJECTS_KEY, JSON.stringify(list.filter(p => p.id !== id)));
  }
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ★사용자 제어 문자열(프로젝트 이름·폴더 이름)을 innerHTML 에 넣기 전 «반드시» 거친다.
 *   CSP 가 script-src 'unsafe-inline' 이라, 이걸 건너뛰면 이름에 심은 <img onerror=…> 가 돈다. */
function _escHtml(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ══════════════════════════════════════════════════════════════════════════
 * 폴더(T-A) + 검색(T-B) — 공유 상태
 * ★★필터(검색어·선택 폴더)는 여기 «모듈 상태»로만 있고, 실제 그리기는
 *   renderGrid() → _renderGridFromCache() 안에서 «매번 다시» 읽는다.
 *   renderGrid() 의 호출부가 12곳(이름변경·삭제·복제·즐겨찾기·공유·가져오기·탭전환…)이라
 *   필터를 바깥 딴 함수에 두면 그런 조작 때마다 필터가 조용히 풀린다.
 * ══════════════════════════════════════════════════════════════════════════ */
const FOLDER_VIEW_KEY = 'goditor_projects_folder';   // ⛔'claudePM:folderMap' 재사용 금지(다른 용도로 이미 쓰임)
let _foldersCache = [];             // folders:list 캐시 — 검색(폴더명 매칭)과 폴더 타일이 같이 쓴다
let _allProjectsCache = [];         // 마지막 loadProjects() 결과 — 검색은 이걸 재사용하고 IPC 를 다시 안 부른다
let _selectedFolderId = null;       // [B안] null=루트(폴더 타일 + 폴더 밖 프로젝트) · 그 외=그 폴더 «안»
let _freshFolderId = null;          // 방금 만든 폴더 — 타일을 잠깐 강조한다(루트에 머무니까 어디 생겼는지 보여야 한다)
let _searchQuery = '';              // 트리밍 «안 된» 원본(포커스 유지를 위해 입력값 그대로 들고 있는다)

function _getSelectedFolder() {
  try {
    const v = localStorage.getItem(FOLDER_VIEW_KEY) || null;
    // ★[R8] 옛 레일 시절 값 이주 — '__unassigned__'(미분류 보기)는 이제 «루트»가 곧 그 보기다.
    //   이주하지 않으면 어떤 폴더와도 안 맞아 «텅 빈 폴더 안»처럼 보인다.
    if (v === '__unassigned__') { localStorage.removeItem(FOLDER_VIEW_KEY); return null; }
    return v;
  } catch (_) { return null; }
}
function _setSelectedFolder(v) {
  _selectedFolderId = v;
  try { v ? localStorage.setItem(FOLDER_VIEW_KEY, v) : localStorage.removeItem(FOLDER_VIEW_KEY); } catch (_) {}
}

async function _loadFoldersCache() {
  try {
    if (!IS_ELECTRON || !window.electronAPI?.folders) { _foldersCache = []; return; }
    const r = await window.electronAPI.folders.list();
    _foldersCache = (r && r.ok && Array.isArray(r.folders)) ? [...r.folders].sort((a, b) => (a.order||0) - (b.order||0)) : [];
  } catch (_) { _foldersCache = []; }
  // ★자가치유 — 보고 있던 폴더가 사라졌으면(다른 곳에서 삭제 등) «루트»로 내려앉는다.
  if (_selectedFolderId && !_foldersCache.some(f => f.id === _selectedFolderId)) {
    _setSelectedFolder(null);
  }
}

function _folderNameById(id) {
  const f = _foldersCache.find(x => x.id === id);
  return f ? f.name : null;
}

/* 검색 정규화 — trim + 소문자 + NFC. 이름·ID(«proj_» 접두어 뗀 값도)·소속 폴더명 부분일치. */
function _norm(s) { return String(s == null ? '' : s).trim().toLowerCase().normalize('NFC'); }
function _matchesQuery(proj, nq) {
  if (!nq) return true;
  if (_norm(proj.name).includes(nq)) return true;
  const rawId = String(proj.id || '');
  if (_norm(rawId).includes(nq)) return true;
  if (_norm(rawId.replace(/^(proj|plan)_/, '')).includes(nq)) return true;
  if (proj.folderId) {
    const fname = _folderNameById(proj.folderId);
    if (fname && _norm(fname).includes(nq)) return true;
  }
  return false;
}

/* 검색어에 매칭된 «폴더 자체»(폴더 이름이 검색어를 포함) — 결과 위 칩으로 보여준다. */
function _matchingFolders(nq) {
  if (!nq) return [];
  return _foldersCache.filter(f => _norm(f.name).includes(nq));
}

/* ★검색 중엔 폴더 필터가 무시되므로(전체범위 검색), 폴더 타일 줄·경로도 «숨긴다» —
 *   안 그러면 폴더 안을 보는 척 하면서 실제로는 전체를 찾아 사용자가 헷갈린다.
 *   _selectedFolderId 값 자체는 그대로 둔다(검색을 지우면 보던 폴더로 «돌아가야» 하니까). */
function _isSearching() { return !!_norm(_searchQuery); }

/* [R4] 폴더 선택 «진입점» — 타일 클릭·검색 칩 클릭·경로 「Projects」(null=밖으로)가 «전부» 이걸 거친다.
 *   검색어를 지우는 것까지 여기서 책임진다 — 칩을 눌러 폴더로 갈 땐 검색 결과를 보던 게 아니라
 *   그 폴더 «안»을 보고 싶다는 뜻이라 검색은 끝난 것으로 다룬다. */
function selectFolder(folderId) {
  _setSelectedFolder(folderId || null);
  _searchQuery = '';
  const input = document.getElementById('proj-search-input');
  if (input) input.value = '';
  const clearBtn = document.getElementById('proj-search-clear');
  if (clearBtn) clearBtn.style.display = 'none';
  renderFolderChrome();
  _renderGridFromCache();
  const col = document.getElementById('gallery-col');
  if (col) col.scrollTop = 0;   // 들어가고 나올 때 위에서부터 — 긴 루트를 스크롤한 채 들어가면 경로가 안 보인다
}

/* ── 파생 모드(B안) — 상태는 _galleryView·_searchQuery·_selectedFolderId 셋뿐이고 모드는 «계산»한다.
 *   trash  : 휴지통 탭 — 폴더 구역·경로·라벨·검색 전부 숨김
 *   search : 검색어 있음 — 폴더 구역·경로 숨김, 전체 범위 결과 + .folder-badge + #search-folder-hits 칩
 *   inside : 폴더 안 — 폴더 구역 숨김, 경로 「Projects › 이름」, 그 폴더 프로젝트만
 *   root   : 폴더 구역 + 「폴더 밖 프로젝트 N」 + 미분류만
 * ⚠️_galleryView 는 이 파일 «아래»에서 let 으로 선언된다 — 이 함수는 이벤트/렌더 때만 불리므로 TDZ 에 안 걸린다. */
function _viewMode() {
  if (_galleryView === 'trash') return 'trash';
  if (_isSearching()) return 'search';
  return _selectedFolderId ? 'inside' : 'root';
}

/** 모드별 목록 — 순수 함수(테스트가 떼어내 실행한다).
 *  ★루트의 «폴더 밖»은 folderId 가 없거나 «없는 폴더»를 가리키는 것까지다 —
 *    폴더 버그가 프로젝트를 «안 보이게» 만들면 안 된다(main/folders.js 자가치유와 같은 규율). */
function _filterForView(list, nq, folderId, knownFolderIds) {
  if (nq) return list.filter(p => _matchesQuery(p, nq));
  if (folderId) return list.filter(p => p.folderId === folderId);
  return list.filter(p => !p.folderId || !knownFolderIds.has(p.folderId));
}

/** 「오늘 / 어제 / N일 전 / N주 전 / N개월 전 / N년 전」 — 타일의 「N개 · 언제」용(기존 formatDate 는 절대시각). */
function _relTime(iso, now) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return '';
  const base = now ? new Date(now) : new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((day(base) - day(d)) / 86400000);
  if (days <= 0) return '오늘';
  if (days === 1) return '어제';
  if (days < 7) return `${days}일 전`;
  if (days < 30) return `${Math.floor(days / 7)}주 전`;
  if (days < 365) return `${Math.floor(days / 30)}개월 전`;
  return `${Math.floor(days / 365)}년 전`;
}

const _FT_ICON_FOLDER = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" opacity=".85" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.3l2 2h8.7A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
const _FT_ICON_PLUS = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

/** 폴더 «크롬» 한 벌 — 타일·라벨 개수·경로 표시/숨김·구역 표시/숨김을 «이 함수 하나»가 맡는다.
 *  호출: renderGrid()·selectFolder()·검색 apply()·빈 상태 「검색 지우기」·_setGalleryView(). */
function renderFolderChrome() {
  const zone = document.getElementById('folder-zone');
  const tiles = document.getElementById('folder-tiles');
  if (!zone || !tiles) return;
  const mode = _viewMode();
  const searching = _isSearching();   // (search 모드면 구역·경로 둘 다 숨김)

  // 경로 — ★이름은 textContent 로만(XSS 경로 0)
  const inside = mode === 'inside' && !searching;
  const crumb = document.getElementById('gal-crumb');
  let crumbName = document.getElementById('gal-crumb-name');
  // 자가치유 — 이름변경 입력칸이 이름 자리를 차지한 채 남았으면(어떤 경로로든) 입력칸을 걷고 이름 자리를 되살린다.
  if (crumb && !crumbName) {
    crumb.querySelectorAll('.fr-name-input').forEach(el => el.remove());
    crumbName = document.createElement('span');
    crumbName.id = 'gal-crumb-name';
    crumb.appendChild(crumbName);
  }
  const fname = inside ? (_folderNameById(_selectedFolderId) || '') : '';
  if (crumb) crumb.style.display = inside ? '' : 'none';
  if (crumbName) { crumbName.textContent = fname; crumbName.title = fname ? `${fname} — 더블클릭하여 이름 변경` : ''; }
  document.getElementById('gallery-title')?.classList.toggle('is-inside', inside);

  // 구역·라벨 — 루트에서만
  const showRoot = mode === 'root';
  zone.style.display = showRoot ? '' : 'none';
  zone.classList.toggle('is-empty', !_foldersCache.length);
  const known = new Set(_foldersCache.map(f => f.id));
  const looseN = _allProjectsCache.filter(p => !p.folderId || !known.has(p.folderId)).length;
  const loose = document.getElementById('loose-label');
  if (loose) {
    // 프로젝트가 «하나도» 없으면 라벨 대신 큰 빈 화면이 말한다(라벨+빈화면 이중 안내 금지)
    loose.style.display = (showRoot && _allProjectsCache.length) ? '' : 'none';
    loose.querySelector('.fz-label-text').textContent = _foldersCache.length ? '폴더 밖 프로젝트' : '프로젝트';
    loose.querySelector('.fz-count').textContent = String(looseN);
  }
  const zc = document.querySelector('#fz-label .fz-count');
  if (zc) zc.textContent = _foldersCache.length ? String(_foldersCache.length) : '';

  // 타일 — 폴더 0개면 「+ 새 폴더」 하나만
  const counts = new Map(), latest = new Map();
  for (const p of _allProjectsCache) {
    if (!p.folderId || !known.has(p.folderId)) continue;
    counts.set(p.folderId, (counts.get(p.folderId) || 0) + 1);
    if (p.updatedAt && (!latest.has(p.folderId) || String(p.updatedAt) > String(latest.get(p.folderId)))) latest.set(p.folderId, p.updatedAt);
  }
  const addTile = `<button type="button" class="ft-tile ft-add" id="ft-add-folder" title="새 폴더 만들기"><span class="ft-ico">${_FT_ICON_PLUS}</span><span class="ft-name">새 폴더</span></button>`;
  tiles.innerHTML = _foldersCache.map(f => {
    const n = counts.get(f.id) || 0;
    const rel = _relTime(latest.get(f.id) || f.updatedAt);
    return `
    <div class="ft-cell">
      <button type="button" class="ft-tile${f.id === _freshFolderId ? ' is-fresh' : ''}" data-folder-key="${_escHtml(f.id)}" data-folder-name="${_escHtml(f.name)}" title="${_escHtml(f.name)}">
        <span class="ft-ico">${_FT_ICON_FOLDER}</span>
        <span class="ft-text"><span class="ft-name">${_escHtml(f.name)}</span><span class="ft-sub">${n}개${rel ? ' · ' + _escHtml(rel) : ''}</span></span>
      </button>
      <button type="button" class="ft-more" data-folder-menu="${_escHtml(f.id)}" aria-label="폴더 메뉴" aria-haspopup="menu" title="이름 바꾸기 · 삭제">⋯</button>
    </div>`;
  }).join('') + addTile;
  if (_freshFolderId) {
    const fresh = _freshFolderId;
    setTimeout(() => {
      if (_freshFolderId === fresh) _freshFolderId = null;
      tiles.querySelectorAll('.ft-tile.is-fresh').forEach(t => t.classList.remove('is-fresh'));
    }, 1400);
  }
}

/** 폴더 배정 — 결과를 «버리지 않는다»(U7 규율). moved 0 이면 조용히 성공처럼 보이지 않게 알린다.
 *  [R1] main/folders.js 의 isProjId 가 proj_* 만 받는다 — 기획(plan_*) 프로젝트는 폴더에 못 들어간다.
 *    ⇒ UI 에서 막는다(카드 📁 비활성 + 드래그 표지 text/x-goditor-planning 을 타일·경로가 거절). moved 0 알림은 마지막 방어선. */
async function _assignToFolder(projectIds, folderId) {
  let r;
  try { r = await window.electronAPI.folders.assign({ projectIds, folderId }); }
  catch (e) { r = { ok: false, error: e && e.message }; }
  if (!r || r.ok !== true) { alert('폴더로 옮기지 못했습니다: ' + ((r && r.error) || '알 수 없는 오류')); return r; }
  if (r.moved === 0) alert('이 프로젝트는 폴더에 넣을 수 없습니다.\n(기획 프로젝트는 아직 폴더를 지원하지 않습니다.)');
  return r;
}

/** 인라인 이름 입력 — 새 폴더·이름 바꾸기·카드 메뉴 「새 폴더 만들어 넣기」가 «같은 한 벌»을 쓴다.
 *  ⛔prompt() 금지 — Electron 이 native prompt 를 차단한다(duplicateProjectUI 주석).
 *  el 을 입력칸으로 «바꿔 끼운다»(버튼 안에 input 을 넣으면 클릭이 타일 진입으로 새어 나간다).
 *  Enter/blur = 확정, Esc = 취소(원래 요소로 되돌림). ★한글 조합 중 Enter 는 확정으로 안 친다. */
function _swapToNameInput(el, opts, onCommit) {
  const { initial = '', placeholder = '폴더 이름', holder: kind = 'tile' } = opts || {};
  const input = document.createElement('input');
  input.className = 'fr-name-input';
  input.value = initial;
  input.placeholder = placeholder;
  input.setAttribute('aria-label', placeholder);
  let holder = input;
  if (kind === 'tile') {
    holder = document.createElement('div');
    holder.className = 'ft-tile ft-editing';
    holder.innerHTML = `<span class="ft-ico">${_FT_ICON_FOLDER}</span>`;
    holder.appendChild(input);
  } else if (kind === 'menu') {
    holder = document.createElement('div');
    holder.style.padding = '4px 10px';
    holder.appendChild(input);
  }
  el.replaceWith(holder);
  input.focus(); input.select();
  let done = false;
  const finish = async (commit) => {
    if (done) return; done = true;
    const nm = input.value.trim();
    if (!commit) { if (holder.isConnected) holder.replaceWith(el); return; }
    await onCommit(nm, () => { if (holder.isConnected) holder.replaceWith(el); });
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('click', (ev) => ev.stopPropagation());
  input.addEventListener('keydown', (ev) => {
    ev.stopPropagation();   // 검색·계정메뉴·«폴더 밖으로(Esc)» 전역 키로 새지 않게
    if (ev.isComposing || ev.keyCode === 229) return;
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  });
  return input;
}

/** 「+ 새 폴더」 타일 → 그 자리에서 이름 입력. 성공하면 «루트에 머물고» 새 타일을 잠깐 강조한다. */
function startNewFolderTile() {
  const add = document.getElementById('ft-add-folder');
  if (!add) return null;
  return _swapToNameInput(add, { placeholder: '폴더 이름', holder: 'tile' }, async (nm, restore) => {
    if (!nm) { restore(); return; }
    const r = await window.electronAPI.folders.create({ name: nm });
    if (r && r.ok) { _freshFolderId = r.folder.id; await renderGrid(); }
    else { alert('폴더를 만들지 못했습니다: ' + ((r && r.error) || '알 수 없는 오류')); restore(); }
  });
}

/** 이름 바꾸기 — 루트면 타일에서, 폴더 안이면 경로의 이름 자리에서. */
function startRenameFolder(id) {
  const f = _foldersCache.find(x => x.id === id);
  if (!f) return null;
  const inside = _viewMode() === 'inside' && _selectedFolderId === id;
  const target = inside
    ? document.getElementById('gal-crumb-name')
    : [...document.querySelectorAll('#folder-tiles .ft-tile[data-folder-key]')].find(t => t.dataset.folderKey === id);
  if (!target) return null;
  return _swapToNameInput(target, { initial: f.name, placeholder: '폴더 이름', holder: inside ? 'inline' : 'tile' }, async (nm, restore) => {
    // ★확정·실패·취소 «모든» 갈래에서 먼저 원래 요소로 되돌린다. 경로(inline)에선 input 이 #gal-crumb-name
    //   «자체»를 갈아 끼웠으므로, 안 되돌리면 그 span 이 DOM 에서 영영 사라지고 경로가 옛 이름에 굳는다(09-19 이벨류 실측).
    restore();
    if (!nm || nm === f.name) { renderFolderChrome(); return; }
    const r = await window.electronAPI.folders.rename({ id, name: nm });
    if (!r || r.ok !== true) alert('이름을 바꾸지 못했습니다: ' + ((r && r.error) || '알 수 없는 오류'));
    await renderGrid();
  });
}

/** 삭제 — ⋯/우클릭 메뉴에서. ★확인 문구의 «뜻»(프로젝트는 안 지워지고 폴더 밖으로)은 레일 시절 그대로(PF-7).
 *  용어만 «미분류» → «폴더 밖»으로 통일(CONTEXT 결정 ④ — 섹션 라벨 「폴더 밖 프로젝트」와 같은 말). */
async function deleteFolderUI(id) {
  const name = _folderNameById(id) || '이 폴더';
  if (!confirm(`"${name}" 폴더를 지울까요?\n\n안에 있는 프로젝트는 지워지지 않고 «폴더 밖»으로 갑니다.`)) return;
  const r = await window.electronAPI.folders.delete({ id });
  if (!r || r.ok !== true) { alert('폴더를 지우지 못했습니다: ' + ((r && r.error) || '알 수 없는 오류')); return; }
  if (_selectedFolderId === id) _setSelectedFolder(null);   // 보던 폴더를 지웠으면 밖(루트)으로
  await renderGrid();
}

/** 떠 있는 메뉴(타일 ⋯ · 카드 📁) 닫기 규약 «한 벌» — 두 메뉴가 같이 쓴다(09-19 2라운드 ③: 카드 📁 만 Esc 가 안 먹었다).
 *  · Esc 는 캡처 단계에서 «바로» 받는다(키보드로 열자마자 Esc 가 새지 않게) + stopPropagation·preventDefault
 *    → 전역 «폴더 밖으로(Esc)»까지 안 간다(우선순위: 메뉴 → 입력칸 → 폴더 밖).
 *  · ★메뉴 «안» 이름 입력칸(.fr-name-input, 카드 메뉴 「+ 새 폴더 만들어 넣기」)의 Esc 는 그 입력칸의 것이다 —
 *    캡처가 먼저 받아 메뉴째 닫으면 안 된다. 첫 Esc = 입력 취소, 두 번째 Esc = 메뉴 닫기. 한글 조합 중 Esc 도 넘긴다.
 *  · 바깥 클릭은 한 틱 미뤄 받는다(여는 클릭에 바로 닫히지 않게). 닫을 때 리스너 둘 다 뗀다.
 *  · 새 메뉴를 열면 앞 메뉴의 리스너까지 정리한다(DOM 만 지우면 옛 Esc 리스너가 남아 다음 Esc 를 삼킨다). */
let _openMenuClose = null;
function _wireMenuDismiss(menu, anchor) {
  if (_openMenuClose) _openMenuClose();
  let closed = false;
  const close = (opts) => {
    if (closed) return;
    closed = true;
    menu.remove();
    if (anchor) anchor.removeAttribute('aria-expanded');
    document.removeEventListener('click', onDocClick, true);
    document.removeEventListener('keydown', onKey, true);
    if (_openMenuClose === close) _openMenuClose = null;
    if (opts && opts.refocus && anchor && anchor.isConnected) anchor.focus();   // Esc 로 닫으면 누른 버튼으로 포커스 복귀
  };
  const onDocClick = (ev) => { if (!menu.contains(ev.target)) close(); };
  const onKey = (ev) => {
    if (ev.key !== 'Escape') return;
    if (ev.isComposing || ev.keyCode === 229) return;
    if (menu.contains(ev.target) && ev.target.closest?.('.fr-name-input')) return;
    ev.stopPropagation(); ev.preventDefault();
    close({ refocus: true });
  };
  if (anchor) anchor.setAttribute('aria-expanded', 'true');
  document.addEventListener('keydown', onKey, true);
  setTimeout(() => { if (!closed) document.addEventListener('click', onDocClick, true); }, 0);
  _openMenuClose = close;
  return close;
}

/** 타일 ⋯ 메뉴(우클릭도 같은 메뉴) — 껍데기는 카드 📁 메뉴(.card-folder-menu)·항목은 .tab-add-item 재사용. */
function openFolderTileMenu(anchor, folderId, pt) {
  if (_openMenuClose) _openMenuClose();
  document.querySelectorAll('.card-folder-menu').forEach(m => m.remove());
  if (!_foldersCache.some(f => f.id === folderId)) return null;
  const menu = document.createElement('div');
  menu.className = 'card-folder-menu ft-menu';
  menu.setAttribute('role', 'menu');
  menu.style.minWidth = '150px';
  menu.innerHTML = `
    <button type="button" class="tab-add-item" role="menuitem" data-ft-act="rename"><span class="tab-add-item-name">이름 바꾸기</span></button>
    <button type="button" class="tab-add-item" role="menuitem" data-ft-act="delete"><span class="tab-add-item-name">삭제</span></button>`;
  document.body.appendChild(menu);
  let top, left;
  if (pt) { top = pt.y; left = pt.x; }
  else { const r = anchor.getBoundingClientRect(); top = r.bottom + 4; left = r.right - menu.offsetWidth; }
  menu.style.top = Math.max(8, Math.min(top, window.innerHeight - menu.offsetHeight - 8)) + 'px';
  menu.style.left = Math.max(8, Math.min(left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
  const close = _wireMenuDismiss(menu, anchor);
  menu.addEventListener('click', async (ev) => {
    const it = ev.target.closest('[data-ft-act]');
    if (!it) return;
    ev.stopPropagation();
    close();
    if (it.dataset.ftAct === 'rename') startRenameFolder(folderId);
    else await deleteFolderUI(folderId);
  });
  return menu;
}

/** [R1] 끌고 있는 게 기획 카드인가 — dragstart 가 붙인 종류 표지로 본다(dragover 는 값 대신 types 만 읽힌다). */
function _isPlanningDrag(e) {
  const types = e.dataTransfer && e.dataTransfer.types;
  return !!types && Array.from(types).includes('text/x-goditor-planning');
}

/* ── 폴더 구역 결선(한 번만) — 타일은 매번 다시 그려지므로 «위임»으로 받는다 ── */
(function wireFolderZone() {
  const tiles = document.getElementById('folder-tiles');
  if (!tiles) return;
  _selectedFolderId = _getSelectedFolder();

  tiles.addEventListener('click', (e) => {
    const more = e.target.closest('[data-folder-menu]');
    if (more) { e.stopPropagation(); openFolderTileMenu(more, more.dataset.folderMenu); return; }
    if (e.target.closest('#ft-add-folder')) { startNewFolderTile(); return; }
    if (e.target.closest('.ft-editing')) return;
    const tile = e.target.closest('.ft-tile[data-folder-key]');
    if (tile) selectFolder(tile.dataset.folderKey);
  });
  tiles.addEventListener('contextmenu', (e) => {
    const tile = e.target.closest('.ft-tile[data-folder-key]');
    if (!tile) return;
    e.preventDefault();
    openFolderTileMenu(null, tile.dataset.folderKey, { x: e.clientX, y: e.clientY });
  });

  // 드롭 — 카드를 폴더 타일로 끌어다 놓으면 그 폴더로(레일 is-drop-target 동작 이식)
  tiles.addEventListener('dragover', (e) => {
    const tile = e.target.closest('.ft-tile[data-folder-key]');
    if (!tile || tile.classList.contains('ft-add')) return;   // 「+ 새 폴더」엔 못 놓는다(뜻이 없다)
    if (_isPlanningDrag(e)) return;                            // [R1] 기획 카드는 폴더에 못 들어간다 — 드롭 표시도 안 한다
    e.preventDefault();
    tile.classList.add('is-drop-target');
  });
  tiles.addEventListener('dragleave', (e) => {
    const tile = e.target.closest('.ft-tile');
    if (tile && !tile.contains(e.relatedTarget)) tile.classList.remove('is-drop-target');
  });
  tiles.addEventListener('drop', async (e) => {
    const tile = e.target.closest('.ft-tile[data-folder-key]');
    if (!tile || tile.classList.contains('ft-add')) return;
    if (_isPlanningDrag(e)) return;   // [R1]
    e.preventDefault();
    tile.classList.remove('is-drop-target');
    const projectId = e.dataTransfer.getData('text/x-goditor-project-id');
    if (!projectId) return;
    await _assignToFolder([projectId], tile.dataset.folderKey);
    await renderGrid();
  });

  // 경로의 폴더명 더블클릭 = 이름 바꾸기(폴더 안에서)
  document.getElementById('gal-crumb')?.addEventListener('dblclick', (e) => {
    if (!e.target.closest('#gal-crumb-name') || !_selectedFolderId) return;
    startRenameFolder(_selectedFolderId);
  });

  // [R5] 폴더 안에선 타일이 숨어 있다 — 경로 「Projects」에 놓으면 «폴더에서 빼기»(레일 「미분류」 행 드롭의 대체)
  const up = document.getElementById('gal-tab-projects');
  const canDropUp = () => _viewMode() === 'inside';
  up.addEventListener('dragover', (e) => {
    if (!canDropUp()) return;
    if (_isPlanningDrag(e)) return;   // [R1] 기획 카드는 원래 폴더 밖이다 — 뺄 것도 없다
    e.preventDefault();
    up.classList.add('is-drop-target');
  });
  up.addEventListener('dragleave', () => up.classList.remove('is-drop-target'));
  up.addEventListener('drop', async (e) => {
    if (!canDropUp()) return;
    if (_isPlanningDrag(e)) return;
    e.preventDefault();
    up.classList.remove('is-drop-target');
    const projectId = e.dataTransfer.getData('text/x-goditor-project-id');
    if (!projectId) return;
    await _assignToFolder([projectId], null);
    await renderGrid();
  });

  // Esc — 폴더 안에서 입력칸 밖에 포커스가 있을 때 «밖으로». 계정메뉴·메뉴·입력칸이 먼저다.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    if (_viewMode() !== 'inside') return;
    const t = e.target;
    // «글자 입력칸»만 막는다 — 보기전환 radio·체크박스 같은 input 은 Esc 를 쓰지 않으므로 통과(09-19 이벨류 실측)
    if (t && (t.closest?.('input:not([type="radio"]):not([type="checkbox"]):not([type="button"]):not([type="range"]), textarea, select, [contenteditable="true"], #acct'))) return;
    if (document.getElementById('acct')?.classList.contains('open')) return;
    if (document.querySelector('.card-folder-menu')) return;
    // 모달(공지·신고·버전기록·글꼴대체)이 떠 있으면 Esc 는 «그 모달»의 것이다 — notice.js otherModalOpen() 과 같은 판정
    if ([...document.querySelectorAll('.settings-modal-overlay')].some(el => getComputedStyle(el).display !== 'none')) return;
    selectFolder(null);
  });
})();

/* ── 검색 결선(한 번만) ── */
(function wireSearch() {
  const input = document.getElementById('proj-search-input');
  const clearBtn = document.getElementById('proj-search-clear');
  const box = document.getElementById('proj-search');
  if (!input) return;
  let composing = false;   // ★한글 IME 조합 가드 — 없으면 조합 중 자모 단위로 쪼개져 필터가 전멸한다
  let debounceT = null;

  const apply = () => {
    _searchQuery = input.value;
    clearBtn.style.display = _searchQuery ? '' : 'none';
    _renderGridFromCache();
    renderFolderChrome();   // ★검색 시작/종료에 따라 폴더 구역·경로를 숨기거나 되살린다
  };
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; apply(); });
  input.addEventListener('input', () => {
    if (composing) return;   // 조합 «완료 후»에만 필터링한다
    clearTimeout(debounceT);
    debounceT = setTimeout(apply, 130);
  });
  input.addEventListener('keydown', (e) => {
    // ★검색칸에 포커스가 있을 때만 가로챈다(stopPropagation) — 그 밖엔 기존 계정메뉴 Esc 로직이
    //   그대로 동작해야 한다(document 레벨 리스너와 겹쳐 이중 반응하면 안 된다).
    if (e.key === 'Escape') { e.stopPropagation(); input.value = ''; apply(); input.blur(); }
  });
  clearBtn.addEventListener('click', () => { input.value = ''; input.focus(); apply(); });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
      if (_galleryView !== 'projects') return;
      e.preventDefault(); input.focus(); input.select();
    }
  });
})();

function _setEmptyState(html, compact) {
  const empty = document.getElementById('empty-state');
  const txt = document.getElementById('empty-state-text');
  if (txt) txt.innerHTML = html;
  empty.classList.toggle('is-compact', !!compact);   // 루트의 «폴더 밖 0개» — 라벨 아래 한 줄로
  empty.style.display = 'block';
}

/** 검색·폴더 필터를 적용해 «다시 그린다» — IPC 를 새로 부르지 않는다(캐시 재사용, T-B). */
function _renderGridFromCache() {
  const grid = document.getElementById('project-grid');
  const chipsBox = document.getElementById('search-folder-hits');
  const nq = _norm(_searchQuery);
  // ★검색 중엔 폴더 선택과 «무관하게» 항상 전체 범위 · 폴더 안=그 폴더만 · 루트=폴더 밖만(B안)
  let list = _filterForView(_allProjectsCache, nq, _selectedFolderId, new Set(_foldersCache.map(f => f.id)));

  if (nq) {
    const chips = _matchingFolders(nq);
    if (chips.length) {
      chipsBox.style.display = 'flex';
      chipsBox.innerHTML = chips.map(f => `
        <button type="button" class="sfc-chip" data-goto-folder="${_escHtml(f.id)}">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          ${_escHtml(f.name)}
        </button>`).join('');
    } else {
      chipsBox.style.display = 'none'; chipsBox.innerHTML = '';
    }
  } else {
    chipsBox.style.display = 'none'; chipsBox.innerHTML = '';
  }

  grid.innerHTML = '';

  if (!list.length) {
    if (nq) _setEmptyState(`"${_escHtml(_searchQuery.trim())}"에 맞는 프로젝트가 없어요.<br><a href="#" id="empty-clear-search" style="color:var(--ui-text-sub)">검색 지우기</a>`);
    else if (_selectedFolderId) _setEmptyState('이 폴더에 프로젝트가 없습니다 — 밖에서 카드를 폴더 타일로 끌어다 놓거나 📁 메뉴로 넣어보세요.');
    else if (_allProjectsCache.length) _setEmptyState('폴더 밖 프로젝트가 없어요 — 모두 폴더 안에 있습니다.', true);
    else _setEmptyState('아직 프로젝트가 없어요.<br>새 프로젝트를 만들어보세요.');
    const clr = document.getElementById('empty-clear-search');
    if (clr) clr.addEventListener('click', (e) => {
      e.preventDefault();
      const input = document.getElementById('proj-search-input');
      input.value = ''; input.dispatchEvent(new Event('input'));
      _searchQuery = ''; document.getElementById('proj-search-clear').style.display = 'none';
      _renderGridFromCache();
      renderFolderChrome();
    });
    return;
  }
  document.getElementById('empty-state').style.display = 'none';

  /* ★즐겨찾기가 맨 위로 — 그 안에서는 «원래 순서»를 그대로 둔다.
     별을 눌렀다고 최근순 정렬까지 뒤집으면 「내 목록이 왜 이렇게 됐지」가 된다.
     안정 정렬(sort 는 안정적)이라 같은 그룹 안 순서는 보존된다. */
  list = [...list].sort((a, b) => (b.favorite === true) - (a.favorite === true));

  list.forEach(proj => {
    const isPlanning = proj.type === 'planning';
    const isCollab   = !!(proj.collabRef && proj.collabRef.collabId);
    const card = document.createElement('div');
    card.className = 'project-card' + (isPlanning ? ' planning-card' : '') + (isCollab ? ' collab-card' : '');
    card.dataset.id = proj.id;
    card.draggable = true;
    // DBG-10: thumbnail 필드가 있으면 실제 이미지 표시, 없으면 기본 SVG
    const thumbContent = proj.thumbnail
      ? `<img src="${_escHtml(proj.thumbnail)}" loading="lazy" onerror="this.style.display='none'">`  /* 크기·자르기 위치는 .card-thumb img (CSS) 가 정한다 — object-position:top */
      : (isPlanning
        ? `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22c48a" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="12" y2="16"/></svg>`
        : `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#555" stroke-width="1.2"><rect x="5" y="5" width="30" height="30" rx="2"/><line x1="11" y1="15" x2="29" y2="15"/><line x1="11" y1="21" x2="29" y2="21"/><line x1="11" y1="27" x2="22" y2="27"/></svg>`);
    // 검색 중일 때만 소속 폴더 배지를 붙인다(T-B) — 평소엔 경로(폴더 안)·루트(폴더 밖)가 이미 말해준다.
    //   ★.planning-badge/.collab-badge 와 «같은 자리»(badgeHtml)에 «같은 꼴»로 합류시킨다 —
    //     이름 아래 별도 줄(옛 .card-folder-tag)로 두면 배지 두 종류가 카드마다 다른 언어를 쓰게 된다.
    const folderBadgeHtml = (nq && proj.folderId && _folderNameById(proj.folderId))
      ? `<div class="folder-badge">📁 ${_escHtml(_folderNameById(proj.folderId))}</div>` : '';
    // 배지는 «셋 다» 붙을 수 있다(기획+공동작업+검색중 폴더매치) — 하나로 뭉치지 않는다.
    const badgeHtml = (isPlanning ? `<div class="planning-badge">📋 기획</div>` : '')
      + (isCollab ? `<div class="collab-badge" title="${proj.collabRef.role === 'owner' ? '내가 올린 공동작업본' : '초대받아 참여 중'}">👥 공동작업</div>` : '')
      + folderBadgeHtml;
    /* ★「없는 글꼴」 배지는 카드를 다 그린 «뒤에» 따로 칠한다 — paintFontBadges() 참고
       (이 인라인 스크립트는 font-substitute.js보다 «먼저» 실행된다) */
    // ★id 는 신 레이아웃 디렉터리명(/^proj_\d+$/)·검증된 레거시·plan_<숫자> 뿐이라 원래도 안전하지만,
    //   onclick="fn(event, '${id}')" 는 HTML속성+JS문자열 이중 문맥이라 «방어 두 겹»으로 이스케이프한다.
    const safeId = _escHtml(proj.id);
    const duplicateBtnHtml = isPlanning
      ? ''
      : `<button class="card-action card-duplicate" onclick="duplicateProjectUI(event, '${safeId}')" title="복제">⎘</button>`;
    // ★「원격으로 올리기」는 «아직 안 올린 카드»에만 뜬다. 이미 올린 카드에서 또 누르면
    //   무슨 일이 나는지 사용자가 알 수 없다 — 버튼을 없애서 그 질문 자체를 없앴다.
    //   (끊기·초대 관리는 환경설정 「협업」 탭이 맡는다. 카드에 다 넣으면 카드가 도구상자가 된다.)
    //   ★킬스위치(js/feature-flags.js COLLAB_ENABLED) 를 «여기서도» 본다 — 2026-09-02 이전에는
    //   안 봤다. 그래서 스위치를 꺼도 이 버튼만 살아남아 「눌리는데 서버가 404」였다.
    const shareBtnHtml = (!window.COLLAB_ENABLED || isCollab || !window.electronAPI?.collab)
      ? ''
      : `<button class="card-action card-share" onclick="shareProjectUI(event, '${safeId}')" title="원격으로 올리기 — 다른 사람을 초대해 같이 편집합니다">👥</button>`;
    // [T-A] 폴더로 이동 — 항상 뜬다.
    //   [R1] 기획(plan_*) 프로젝트는 main/folders.js isProjId 가 거른다(moved 0) ⇒ UI 에서 막는다: 버튼은 «보이되» 비활성 + 이유 툴팁.
    //     ⛔disabled 속성 금지 — 크로미움은 disabled 버튼에 hover 를 안 줘 title 툴팁이 안 뜬다. onclick 도 안 단다.
    const folderBtnHtml = !window.electronAPI?.folders ? ''
      : isPlanning
        ? `<button type="button" class="card-action card-folder-move is-disabled" aria-disabled="true" title="기획 프로젝트는 아직 폴더에 넣을 수 없습니다">📁</button>`
        : `<button class="card-action card-folder-move" onclick="openFolderMenuUI(event, '${safeId}')" title="폴더로 이동">📁</button>`;
    card.innerHTML = `
      <div class="card-thumb">${thumbContent}</div>
      <div class="card-body">
        ${badgeHtml}
        <div class="card-name" data-id="${safeId}" ondblclick="startRename(event, '${safeId}')" title="더블클릭하여 이름 변경">${_escHtml(proj.name || '이름 없음')}</div>
        <div class="card-date">${formatDate(proj.updatedAt)}</div>
      </div>
      <div class="card-actions">
        <button class="card-action card-fav${proj.favorite ? ' on' : ''}"
                onclick="toggleFavorite(event, '${safeId}')"
                title="${proj.favorite ? '즐겨찾기 해제' : '즐겨찾기 — 목록 맨 위로'}"
                aria-pressed="${proj.favorite ? 'true' : 'false'}">${proj.favorite ? '★' : '☆'}</button>
        ${folderBtnHtml}
        ${shareBtnHtml}
        ${duplicateBtnHtml}
        <button class="card-action card-delete" onclick="deleteProject(event, '${safeId}')" title="삭제">✕</button>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.card-actions')) return;
      if (e.target.classList.contains('card-name-input')) return;
      openProject(proj.id, proj.type);
    });
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/x-goditor-project-id', proj.id);
      // [R1] 기획 카드 표지 — dragover 에선 데이터 «값»을 못 읽고 «종류(types)»만 보이므로 종류로 알린다(타일·경로가 거절)
      if (isPlanning) e.dataTransfer.setData('text/x-goditor-planning', '1');
      e.dataTransfer.effectAllowed = 'move';
    });
    grid.appendChild(card);
  });
  paintFontBadges();
}

/* [T-A] 카드의 📁 버튼 — 「폴더에서 빼기 / 폴더들 / 새 폴더 만들어 넣기」 작은 메뉴.
 * ★prompt() 는 Electron 이 차단한다(duplicateProjectUI 주석 참고) — 새 폴더는 인라인 input. */
async function openFolderMenuUI(e, projectId) {
  e.stopPropagation();
  if (_openMenuClose) _openMenuClose();
  document.querySelectorAll('.card-folder-menu').forEach(m => m.remove());
  const btn = e.currentTarget;
  const proj = _allProjectsCache.find(p => p.id === projectId);
  // ★«지금 어느 폴더에 있나»는 화면이 쓰는 규칙과 «같게» 본다 — folderId 가 없거나 «없는 폴더»를 가리키면
  //   화면상 「폴더 밖」이다(_filterForView 의 폴더 밖 판정·카드 폴더 배지와 동일). undefined 도 null 로 모은다.
  const curFolderId = (proj && proj.folderId && _foldersCache.some(f => f.id === proj.folderId)) ? proj.folderId : null;

  const menu = document.createElement('div');
  menu.className = 'card-folder-menu';
  /* [polish3·6라운드 foldermenu/T-062] «지금 그 자리»인 항목은 할 일이 없다 → 비활성.
   *   폴더 밖 프로젝트의 「폴더에서 빼기」(key=null)든, 지금 들어있는 그 폴더(key=폴더id)든 규칙은 하나 —
   *   curFolderId === key 면 비활성. 누르면 «자기 폴더로 다시 배정»(meta 를 같은 값으로 덮어쓰는 빈 쓰기)이
   *   한 번 돌고 목록이 통째로 다시 그려졌다(2026-09-20 DOM 실측: assign {folderId:'fold_a'} 1회).
   *   ⛔disabled 속성 금지 — 크로미움은 disabled 버튼에 hover 를 안 줘 title 툴팁이 안 뜬다(기획 카드 📁 와 같은 규율). */
  const itemHtml = (key, name) => {
    const isCur = curFolderId === key;
    const off = isCur;
    const offTitle = key === null ? '이미 폴더 밖에 있습니다' : '이미 이 폴더에 있습니다';
    return `
    <button type="button" class="tab-add-item${isCur ? ' is-current' : ''}${off ? ' is-disabled' : ''}"${off ? ` aria-disabled="true" title="${_escHtml(offTitle)}"` : ''} data-goto="${key === null ? '' : _escHtml(key)}">
      <span class="tab-add-item-name">${_escHtml(name)}</span>
    </button>`;
  };
  menu.innerHTML = itemHtml(null, '폴더에서 빼기')
    + (_foldersCache.length ? '<div class="fr-divider"></div>' : '')
    + _foldersCache.map(f => itemHtml(f.id, f.name)).join('')
    + '<div class="fr-divider"></div>'
    + `<button type="button" class="tab-add-item" id="cfm-new-folder"><span class="tab-add-item-name">+ 새 폴더 만들어 넣기</span></button>`;
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect();
  menu.style.top = (r.bottom + 4 + window.scrollY) + 'px';
  menu.style.left = Math.max(8, r.right - menu.offsetWidth) + 'px';

  const close = _wireMenuDismiss(menu, btn);   // Esc·바깥 클릭·aria-expanded — 타일 ⋯ 메뉴와 같은 규약

  menu.addEventListener('click', async (ev) => {
    const item = ev.target.closest('[data-goto]');
    if (item) {
      // 비활성 항목(이미 폴더 밖) — 아무 일도 하지 않고 메뉴도 닫지 않는다
      if (item.getAttribute('aria-disabled') === 'true') { ev.stopPropagation(); return; }
      const key = item.dataset.goto || null;
      close();
      await _assignToFolder([projectId], key);
      await renderGrid();
      return;
    }
    const newItem = ev.target.closest('#cfm-new-folder');
    if (newItem) {
      // ★[B안] 메뉴 «안»에서 바로 이름을 받아 만들고 넣는다. (레일 시절엔 prompt 가 막히면 레일의
      //   [+ 새 폴더]를 대신 눌렀는데, 그건 폴더만 만들고 «이 카드»는 안 넣었다. 게다가 폴더 안·검색 중엔
      //   타일 줄이 숨어 있어 누를 곳도 없다.) ⛔prompt() 금지 — Electron 이 차단한다.
      ev.stopPropagation();
      _swapToNameInput(newItem, { placeholder: '새 폴더 이름', holder: 'menu' }, async (nm) => {
        close();
        if (!nm) return;
        const r2 = await window.electronAPI.folders.create({ name: nm });
        if (!r2 || !r2.ok) { alert('폴더를 만들지 못했습니다: ' + ((r2 && r2.error) || '알 수 없는 오류')); return; }
        await _assignToFolder([projectId], r2.folder.id);
        await renderGrid();
      });
    }
  });
}

/* 검색 칩(매칭된 폴더) 클릭 → 그 폴더로 이동 — 위임(칩이 검색 재실행마다 다시 그려지므로) */
document.getElementById('search-folder-hits').addEventListener('click', (e) => {

async function renderGrid() {
