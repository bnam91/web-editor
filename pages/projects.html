/* ── 카드의 「없는 글꼴」 배지 ──────────────────────────────────────────
 * ★그리드를 다시 그리지 «않고» 배지만 칠한다. 이유: 이 인라인 스크립트가
 *   font-substitute.js보다 먼저 실행돼서, 첫 renderGrid() 때는 window.gdtFontReport가
 *   «아직 없다». 실제로 그 순서 때문에 배지가 새로고침마다 사라졌다(2026-08-07 실측).
 *   그래서 load 뒤에 한 번 더 부른다 — 그리드 재빌드(IPC 포함) 없이 배지만 붙는다.
 * ★판정은 localStorage 기록 + 폰트 존재 검사뿐이라 프로젝트 파일을 읽지 않는다(목록이 느려지면 안 된다).
 */
function paintFontBadges() {
  if (!window.gdtFontReport) return;
  document.querySelectorAll('.project-card').forEach(card => {
    card.querySelector('.fsub-card-badge')?.remove();
    const st = window.gdtFontReport.state(card.dataset.id);
    if (!st.unresolved && !st.substituted) return;
    const el = document.createElement('div');
    if (st.unresolved) {
      el.className = 'fsub-card-badge';
      el.textContent = `⚠️ 없는 글꼴 ${st.unresolved}`;
      el.title = '이 기기에 없는 글꼴이 있습니다 — 대체할 글꼴 고르기';
    } else {
      el.className = 'fsub-card-badge is-done';
      el.textContent = `글꼴 대체됨 ${st.substituted}`;
      el.title = `없는 글꼴 ${st.substituted}개를 대체해 두었습니다 — 다시 고르기`;
    }
    el.onclick = (e) => openFontSubstituteUI(e, card.dataset.id);
    card.querySelector('.card-body')?.appendChild(el);
  });
}
window.addEventListener('load', paintFontBadges);

/** 폴더 «안»에서 새로 생긴 프로젝트(새로 만들기·가져오기·복제)를 «지금 보고 있는» 폴더 소속으로 — 한 벌.
 *  ★루트·검색 중·휴지통에선 아무것도 안 한다(_viewMode() === 'inside' 일 때만). 실패해도 흐름은 막지 않는다(경고만).
 *  (meta 는 projects:save-meta·folders:assign 이 read-merge-write 라 뒤이은 저장이 folderId 를 지우지 않는다.)
 *  ★기획(plan_*)은 main 이 거른다(moved 0) — 여기선 알림을 띄우지 않는다(사용자가 «넣으려 한» 게 아니다). */
async function _adoptIntoCurrentFolder(id) {
  if (!id || _viewMode() !== 'inside' || !window.electronAPI?.folders) return;
  try { await window.electronAPI.folders.assign({ projectIds: [id], folderId: _selectedFolderId }); }
  catch (e) { console.warn('[projects] 새 프로젝트 폴더 배정 실패:', e?.message || e); }
}

async function createProject() {
  const id = 'proj_' + Date.now();
  const now = new Date().toISOString();
  const emptySnap = JSON.stringify({
    version: 2, currentPageId: 'page_1',
    pages: [{ id: 'page_1', name: 'Page 1', label: '', pageSettings: { bg: window.PAGE_BG_DEFAULT, gap: 100, padX: 72, padY: 32, padXExcludesAsset: true }, canvas: '' }]
  });
  const proj = {
    id, name: 'Untitled',
    createdAt: now, updatedAt: now,
    version: 2,
    currentPageId: 'page_1',
    pages: [{ id: 'page_1', name: 'Page 1', label: '', pageSettings: { bg: window.PAGE_BG_DEFAULT, gap: 100, padX: 72, padY: 32, padXExcludesAsset: true }, canvas: '' }],
    currentBranch: 'dev',
    branches: {
      main: { snapshot: emptySnap, createdAt: Date.now(), updatedAt: Date.now() },
      dev:  { snapshot: emptySnap, createdAt: Date.now(), updatedAt: Date.now() }
    }
  };
  await saveNewProject(proj);
  // [B안] 폴더 «안»에서 만들면 그 폴더 소속으로 — 실패해도 프로젝트 진입은 막지 않는다.
  await _adoptIntoCurrentFolder(id);
  // 자동 PM 폴더 보장 (Goditor 프로젝트만) — 실패해도 프로젝트 진입 막지 않음
  try {
    if (IS_ELECTRON && window.electronAPI?.ensureClaudePMFolder) {
      const res = await window.electronAPI.ensureClaudePMFolder({
        projectId: id,
        projectName: proj.name || 'Untitled',
      });
      if (res?.ok && res.folderPath) {
        try {
          const raw = localStorage.getItem('claudePM:folderMap') || '{}';
          const map = JSON.parse(raw);
          map[id] = res.folderPath;
          localStorage.setItem('claudePM:folderMap', JSON.stringify(map));
        } catch (_) {}
      }
    }
  } catch (e) {
    console.warn('[projects] ensureClaudePMFolder failed:', e?.message || e);
  }
  openProject(id);
}

/* ★[0920b] 기획모드 스위치 — 되살릴 땐 «이 한 줄»만 true 로. ⛔기능 코드는 지우지 않는다.
 *
 * 왜 껐나 (현빈 2026-09-20): 그때는 만들면 «만들었는데 사라지는» 경험이었다.
 *   실측(9397 격리 실기 2026-09-20): New Plan 을 누르면 plan_1789885549682 가 디스크에 생기는데
 *   projects:list 는 [] 를 돌려줬고 카드도 0개였다(빈 상태 화면이 그대로 떴다).
 *   원인 = main.js `_listProjectsImpl` 의 걸름망 «둘 다» /^proj_\d+$/ 라 plan_* 이 안 걸린다
 *   (신 레이아웃 디렉터리 루프 · flat 레거시 폴백 — 두 곳 모두).
 *
 * ★★2026-09-21 — 그 «원인»은 T-064 로 고쳐졌다(main.js `_isListableProjectId` 가 plan_<숫자> 도
 *   받는다. 실측 9547: 기획 카드가 목록에 뜨고 📋 기획 배지·기획 화면 열기·이름 바꾸기·삭제/휴지통이
 *   된다). ⇒ **이 스위치를 막고 있는 것은 이제 T-064 가 «아니라» 현빈 지시다** — 「New Plan 단추는
 *   일부러 숨겨 둔다, 되살리지 마라」(2026-09-21). 조건이 풀렸다고 여기를 true 로 바꾸지 마라.
 *   켜려면 «현빈의 말»이 있어야 하고, 그때 tests/unit/darkforms-newplan.test.mjs ·
 *   tests/dom/darkforms-newplan.dom.spec.js 의 뜻을 같이 뒤집는다.
 * ★화면만 막지 않는다 — 함수 자신도 막는다. pages/planning.html 이 같은 이유로
 *   「화면을 숨기는 쪽이 아니라 «페이지 자신»이 막는다. 입구가 하나여야 한다」로 갔다. */
const PLAN_MODE_ENABLED = false;

async function createPlanningProject() {
  if (!PLAN_MODE_ENABLED) {
    console.warn('[projects] 기획모드는 꺼져 있습니다 (PLAN_MODE_ENABLED=false — 현빈 지시 2026-09-21). 프로젝트를 만들지 않습니다.');
    return;
  }
  const id = 'plan_' + Date.now();
  const now = new Date().toISOString();
  const proj = { id, name: '기획 Untitled', type: 'planning', createdAt: now, updatedAt: now };
  await saveNewProject(proj);
  window.location.href = 'planning.html?project=' + id;
}

function openProject(id, type) {
  if (type === 'planning') {
    window.location.href = 'planning.html?project=' + id;
  } else {
    window.location.href = '../index.html?project=' + id;
  }
}

/* [version-history] 카드의 🕐 버튼 → 버전 기록 모달.
 * ★js/version-history-ui.js 는 이 인라인 스크립트보다 «뒤»에 로드된다 → 옵셔널 호출로 방어한다
 *   (fsub 의 openFontSubstituteUI 와 같은 형태·같은 이유). */
/* ── 휴지통 탭 (2026-09-08 현빈 지시) ──────────────────────────────────────
 * ★OS 휴지통이 아니라 «앱 안»에 30일 둔다. 그래야 되살릴 때 id 가 그대로다
 *   (OS 휴지통을 거치면 .gdt 임포트가 되어 «새 프로젝트»가 된다 — §7-4).
 * ★남은 날짜를 «같이» 보여준다. 안 보여주면 30일 뒤 조용히 사라진 걸로 읽힌다.
 * ⛔여기서 «영구삭제»라고 말하지 않는다 — 실제로는 OS 휴지통으로 넘어간다. 말과 동작을 맞춘다.
 */
let _galleryView = 'projects';   // 'projects' | 'trash'

function _setGalleryView(v) {
  _galleryView = v;
  const onTrash = v === 'trash';
  document.getElementById('gal-tab-projects').classList.toggle('is-on', !onTrash);
  document.getElementById('gal-tab-trash').classList.toggle('is-on', onTrash);
  document.getElementById('gal-tab-projects').setAttribute('aria-pressed', String(!onTrash));
  document.getElementById('gal-tab-trash').setAttribute('aria-pressed', String(onTrash));
  document.getElementById('project-grid').style.display = onTrash ? 'none' : '';
  document.getElementById('trash-list').style.display = onTrash ? '' : 'none';
  // 빈 상태·보기전환·새로만들기는 «프로젝트 탭의 것»이다 — 휴지통에선 감춘다
  const es = document.getElementById('empty-state'); if (es && onTrash) es.style.display = 'none';
  for (const id of ['view-toggle', 'btn-new', 'btn-new-planning']) {
    const el = document.getElementById(id);
    if (el) el.style.visibility = onTrash ? 'hidden' : '';
  }
  // [T-A/T-B → B안] 폴더 구역·라벨·경로·검색 — 휴지통은 renderTrash() 라는 별도 렌더러라 필터가 안 먹는다(범위 밖으로 명시).
  //   visibility 가 아니라 display — 자리를 «접어야» 휴지통 화면이 안 밀린다.
  for (const id of ['folder-zone', 'loose-label', 'gal-crumb', 'proj-search']) {
    const el = document.getElementById(id);
    if (el) el.style.display = onTrash ? 'none' : '';
  }
  renderFolderChrome();   // ★돌아올 땐 모드(루트/폴더 안)에 맞게 «즉시» 되살린다 — renderGrid 의 IPC 를 기다리면 빈 경로가 번쩍인다
  if (onTrash) renderTrash(); else renderGrid();
}

async function _trashItems() {
  try { const r = await window.electronAPI.trashList(); return (r && r.items) || []; }
  catch (_) { return []; }
}

/** 탭 옆 개수 배지.
 *  ⚠️2026-09-08 현빈 지시(「휴지통에 숫자는 안 알려줘도 돼」)로 «배지를 걷어냈다» —
 *    #gal-trash-count 가 DOM 에 없으므로 이 함수는 지금 «아무 일도 안 한다»(아래 guard 에서 빠진다).
 *    ⛔지우지 않고 남긴 이유: 호출부 3곳이 살아 있고, 배지를 되살릴 때 여기만 되돌리면 된다.
 *    되살리려면 탭 버튼 안에 <span id="gal-trash-count"></span> 를 다시 넣으면 그만이다. */
async function refreshTrashCount() {
  const el = document.getElementById('gal-trash-count');
  if (!el) return;
  const n = (await _trashItems()).length;
  el.textContent = n ? `(${n})` : '';
}

async function renderTrash() {
  const box = document.getElementById('trash-list');
  const items = await _trashItems();
  if (!items.length) {
    box.innerHTML = '<div id="trash-empty">휴지통이 비어 있습니다.</div>';
    await refreshTrashCount();
    return;
  }
  const esc = _escHtml;   // ★공용 이스케이프 하나로 — renderGrid() 도 이걸 쓴다(재사용, 새 벌 금지)
  const when = (iso) => { const d = new Date(iso); return isNaN(d) ? '—'
    : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
  box.innerHTML =
    `<div class="trash-note">지운 프로젝트는 <b>30일</b> 동안 여기 있습니다. 여기서 되살리면 <b>버전 기록까지 그대로</b> 돌아옵니다.<br>`
    + `30일이 지나면 <b>«이름».gdt</b> 파일로 만들어 컴퓨터 휴지통으로 옮깁니다 — 꺼내서 더블클릭하면 열립니다. `
    + `<b>다만 그때는 버전 기록·메모가 함께 가지 않습니다.</b></div>`
    + items.map(it => `
      <div class="trash-row" data-id="${esc(it.projectId)}">
        <span class="trash-name" title="${esc(it.name)}">${esc(it.name)}</span>
        <span class="trash-when">${when(it.deletedAt)} 삭제</span>
        <span class="trash-left${it.daysLeft <= 3 ? ' soon' : ''}">${it.daysLeft}일 남음</span>
        <button type="button" class="trash-btn" data-act="restore">되살리기</button>
        <button type="button" class="trash-btn danger" data-act="purge">지금 내보내기</button>
      </div>`).join('');
  await refreshTrashCount();
}

/* 행 안의 버튼 — 위임으로 받는다(행이 다시 그려져도 배선이 안 끊긴다) */
document.getElementById('trash-list').addEventListener('click', async (e) => {
  const btn = e.target.closest('.trash-btn'); if (!btn) return;
  const row = btn.closest('.trash-row'); const id = row && row.dataset.id; if (!id) return;
  const name = row.querySelector('.trash-name').textContent;
  btn.disabled = true;                                  // ★연타 방어 — 파일 이동은 느릴 수 있다
  try {
    if (btn.dataset.act === 'restore') {
      const r = await window.electronAPI.trashRestore(id);
      if (!r || r.ok !== true) {
        // ★«왜» 안 됐는지 말한다. 특히 자리가 차 있는 경우는 사용자가 할 일이 있다.
        alert(r && r.code === 'id_taken'
          ? `되살릴 수 없습니다 — 같은 자리에 다른 프로젝트가 있습니다.\n(${r.hint || ''})`
          : `되살리지 못했습니다 — ${(r && (r.error || r.code)) || '알 수 없는 이유'}`);
      }
    } else {
      // ⛔«영구삭제»라고 말하지 않는다 — 실제 동작은 컴퓨터 휴지통으로 옮기는 것이다
      if (!confirm(`"${name}" 을(를) 지금 컴퓨터 휴지통으로 옮길까요?\n\n여기 목록에서는 사라지고, 컴퓨터 휴지통에서 찾을 수 있습니다.`)) return;
      const r = await window.electronAPI.trashPurge(id);
      if (!r || r.ok !== true) alert(`내보내지 못했습니다 — ${(r && (r.error || r.code)) || '알 수 없는 이유'}`);
    }
  } finally {
    // ★어느 경로로 빠져나가도 «화면을 디스크와 맞춘다»(renderGrid 와 같은 규율)
    btn.disabled = false;
    await renderTrash();
  }
});

/* [R4] 「Projects」 한 버튼이 두 일을 한다 — 폴더 안(또는 검색 중 폴더 기억)에선 «밖으로», 휴지통에선 «돌아오기».
 *   ★휴지통에서 돌아올 땐 기억한 폴더로 복귀한다(선택 기억 유지) — 분기를 뒤집으면 기억이 풀린다. */
document.getElementById('gal-tab-projects').addEventListener('click', () => {
  if (_galleryView === 'projects' && _selectedFolderId) selectFolder(null);
  else _setGalleryView('projects');
});
document.getElementById('gal-tab-trash').addEventListener('click', () => _setGalleryView('trash'));

/* [U7] 삭제 진행 중인 프로젝트 — 휴지통 이동은 느릴 수 있고 그 사이 ✕ 가 살아 있다. */
const _deleting = new Set();

async function deleteProject(e, id) {
  e.stopPropagation();
  const list = await loadProjects();
  const proj = list.find(p => p.id === id);
  if (!proj) return;
  // [U7] 기대되는 «되돌림 가능성»이 달라졌으니 그걸 말해준다 — 휴지통에서 되살릴 수 있다.
  if (!confirm(`"${proj.name}" 을(를) 휴지통으로 보낼까요?\n\n«휴지통» 탭에서 30일 동안 되살릴 수 있습니다.`)) return;
  if (_deleting.has(id)) return;       // ★연타 방어 — 휴지통 이동은 느릴 수 있고, 그 사이 카드가 살아 있다
  _deleting.add(id);
  try {
    let r = await removeProject(id);
    if (r && r.ok === false) {
      // ★조용히 영구삭제로 폴백하지 «않는다» — 되돌릴 수 없다는 걸 알고 누르게 한다.
      if (r.reason === 'trash_failed' || r.reason === 'trash_partial') {
        // ★부분 이동이면 그렇게 말한다. 「옮길 수 없습니다」만 말하면 사실과 다르다
        //   (일부는 이미 휴지통에 있는데 「영구 삭제할까요」라고 물으면 사용자가 판단을 그르친다).
        // ★[A3] main 이 «잔재에서 실패하면 번들에 손대지 않고 중단»하도록 바뀌었다 —
        //   그래서 부분 이동은 이제 「낡은 잔재 몇 개만 치웠고 프로젝트는 온전하다」를 뜻한다.
        //   그 사실을 말해주지 않으면 사용자는 「반쯤 지워졌다」로 읽고 겁먹은 채 영구삭제를 누른다.
        const partial = r.reason === 'trash_partial'
          ? `\n\n낡은 잔재 ${r.deleted}개만 휴지통으로 옮겨졌고, 프로젝트 본체는 그대로 있습니다.` : '';
        if (!confirm(`휴지통으로 옮길 수 없습니다.\n(${r.message || '알 수 없는 이유'})${partial}\n\n«영구 삭제»하면 되돌릴 수 없습니다. 진행할까요?`)) return;
        r = await window.electronAPI.deleteProject(id, { permanent: true });
      }
      if (r && r.ok === false) { alert(`삭제하지 못했습니다 — ${r.message || r.reason}`); return; }
    }
    window.gdtFontReport?.clear?.(id);   // 글꼴 기록도 같이 거둔다(안 지우면 localStorage에 계속 쌓인다)
  } finally {
    // ★★어느 경로로 빠져나가도 «화면을 디스크와 맞춘다».
    //   초판은 실패/취소 return 이 renderGrid() 를 건너뛰어, 이미 휴지통에 간 프로젝트의 카드가 남았다.
    //   그 카드를 누르면 projects:load 폴백이 옛 잔재로 «좀비»를 되살린다.
    _deleting.delete(id);
    renderGrid();
    refreshTrashCount();   // ★안 하면 「지웠는데 휴지통 0」으로 보인다
  }
}

/* ── 원격으로 올리기 ────────────────────────────────────────────────────────
 * 이 프로젝트를 «방»으로 만든다. 내용은 여기서 안 올라간다 —
 * 에디터를 열어 동기화 루프가 섹션을 한 개씩 올린다.
 *   왜: proj.json 은 캔버스에 base64 이미지가 인라인돼 수십 MB 까지 간다(실측 85MB).
 *   서버리스 본문 한도(≈4.5MB)로는 통째 업로드가 «구조적으로» 불가능하다.
 * ★초대는 여기서 안 받는다 — Electron 은 native prompt() 를 «차단»한다(복제 기능이
 *   그것 때문에 한 번 죽었다, duplicateProjectUI 주석 참고). 초대는 환경설정 「협업」 탭.
 */
async function shareProjectUI(e, id) {
  e.stopPropagation();
  // ★킬스위치는 «버튼을 안 그리는 것»으로 끝나지 않는다 — 이 함수는 전역이라 남은 경로(콘솔·
  //   나중에 붙는 메뉴)로도 불릴 수 있다. 문을 두 겹으로 닫아 둔다(js/feature-flags.js).
  if (!window.COLLAB_ENABLED) return;
  if (!window.electronAPI?.collab) { alert('공동작업은 데스크탑 앱에서만 사용할 수 있습니다.'); return; }
  const st = await window.electronAPI.getAuthState?.();
  if (!st || !st.signedIn) { alert('공동작업은 로그인한 뒤에 쓸 수 있습니다.\n(계정이 있어야 상대를 초대할 수 있습니다.)'); return; }

  const list = await loadProjects();
  const src = list.find(p => p.id === id);
  if (!src) return;
  if (!confirm(`"${src.name || '이름 없음'}" 을(를) 원격으로 올릴까요?\n\n올리면 이메일로 다른 사람을 초대해 «같이» 편집할 수 있습니다.\n초대·끊기는 환경설정 › 협업 에서 관리합니다.`)) return;

  // ★없으면 «만들어서» 보낸다 — 빈 actorId 를 넘기면 서버가 내 패치를 못 걸러낸다.
  //   키·형식은 js/drag-utils.js getActorId 와 «같다»(블록 ID 에 박히는 값과 같아야 한다).
  const actorId = (() => {
    try {
      let v = localStorage.getItem('goditor.actorId') || '';
      if (!/^[a-z0-9]{4,8}$/.test(v)) { v = Math.random().toString(36).slice(2, 7); localStorage.setItem('goditor.actorId', v); }
      return v;
    } catch (_) { return ''; }
  })();
  const r = await window.electronAPI.collab.register({ projectId: id, name: src.name || '이름 없음', actorId });
  if (!r?.ok) { alert('원격으로 올리지 못했습니다: ' + collabReasonText(r?.reason, r)); return; }

  await renderGrid();
  requestAnimationFrame(() => {
    const card = document.querySelector(`.project-card[data-id="${id}"]`);
    if (card) { card.style.outline = '2px solid #2d6fe8'; setTimeout(() => { card.style.outline = ''; }, 1500); }
  });
}

/* 서버가 준 reason 을 «사용자가 다음에 뭘 할지 아는» 문장으로. 코드값을 그대로 보여주면
 * 사용자는 아무것도 못 한다. 모르는 값은 그대로 노출한다(빈칸이면 무슨 일인지조차 모른다). */
function collabReasonText(reason, r) {
  switch (reason) {
    case 'not_signed_in':  return '로그인이 필요합니다.';
    case 'invalid_session':return '로그인이 만료됐습니다. 다시 로그인해 주세요.';
    case 'offline':        return '서버에 닿지 못했습니다. 네트워크를 확인해 주세요.';
    case 'not_deployed':   return '서버에 공동작업 기능이 아직 배포되지 않았습니다.';
    case 'not_a_member':   return '이 공동작업본에 접근 권한이 없습니다.';
    case 'too_large':
    case 'section_too_large': return '섹션 하나가 너무 큽니다(이미지가 인라인으로 박혀 있습니다).';
    case 'server':         return `서버 오류(${r?.status || '5xx'}) — 잠시 뒤 다시 시도해 주세요.`;
    case 'bad_response':   return `서버가 알 수 없는 응답을 보냈습니다(${r?.status || '?'}).`;
    default:               return reason || '알 수 없는 오류';
  }
}

async function duplicateProjectUI(e, id) {
  e.stopPropagation();
  const list = await loadProjects();
  const src = list.find(p => p.id === id);
  if (!src) return;
  if (!IS_ELECTRON || !window.electronAPI?.duplicateProject) {
    alert('복제 기능은 데스크탑 앱에서만 사용 가능합니다.');
    return;
  }
  const defaultName = `${src.name || '이름 없음'} (사본)`;
  // Electron Chromium은 native prompt()를 차단함 — null/undefined만 반환되어 복제 불가했음.
  // window.prompt가 사용 가능한 경우(비-Electron)에만 시도, 실패하면 기본 이름으로 자동 복제.
  let input = null;
  try {
    if (typeof window.prompt === 'function') {
      input = window.prompt('새 프로젝트 이름', defaultName);
    }
  } catch (_) { /* Electron에서 throw 가능 */ }
  // input이 null이면 사용자가 cancel했거나 prompt 차단. 모달이 없으니 자동 진행 (취소 별도 제공).
  const newName = (input ?? '').trim() || defaultName;
  const res = await window.electronAPI.duplicateProject({ sourceProjectId: id, newName });
  if (!res?.ok) { alert('복제 실패: ' + (res?.error || '알 수 없는 오류')); return; }
  // ④ 폴더 안에서 복제하면 사본도 그 폴더에(09-19 2라운드 R2). main 이 원본 meta 를 복사해 이미 같은 값이지만(9370 실측)
  //   그 «우연»에 기대지 않는 방어선 — 같은 값을 다시 쓸 뿐이라 해가 없다. 루트·검색 중엔 원본 소속 그대로.
  await _adoptIntoCurrentFolder(res.newProjectId);
  await renderGrid();
  requestAnimationFrame(() => {
    const card = document.querySelector(`.project-card[data-id="${res.newProjectId}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.outline = '2px solid #2d6fe8';

function startRename(e, id) {
  e.stopPropagation();
  const nameEl = e.target;
  const current = nameEl.textContent;
  const input = document.createElement('input');
  input.className = 'card-name-input';
  input.value = current;
  nameEl.replaceWith(input);
  input.focus(); input.select();

  async function commit() {
    const newName = input.value.trim() || current;
    await renameProject(id, newName);
    renderGrid();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
  });
}

async function toggleFavorite(ev, id) {
  ev.stopPropagation();                       // 카드 열기로 번지지 않게
  const btn = ev.currentTarget;
  const next = !btn.classList.contains('on');
  // ★먼저 화면을 바꾸고 저장한다 — 별 하나 누르는 데 디스크를 기다리게 하지 않는다.

  btn.classList.toggle('on', next);
  btn.textContent = next ? '★' : '☆';
  btn.setAttribute('aria-pressed', String(next));
  btn.title = next ? '즐겨찾기 해제' : '즐겨찾기 — 목록 맨 위로';
  try {
    await window.electronAPI.saveProjectMeta(id, { favorite: next });
    /* ★한 틱 쉬고 다시 그린다 — 저장(파일 쓰기)과 목록 읽기가 붙어 있으면
       meta 의 mtime 이 아직 갱신 전이라 «방금 켠 별이 꺼진 채»로 그려질 수 있다.
       실제로 한 번 「저장은 됐는데 목록엔 안 뜬다」를 봤다. */
    await new Promise(r => setTimeout(r, 60));
    await renderGrid();                       // 정렬 반영
  } catch (e) {
    btn.classList.toggle('on', !next);
    btn.textContent = next ? '☆' : '★';
    alert('즐겨찾기를 저장하지 못했습니다.');
  }
}

let _sigStaleBannerClosedThisSession = false;

/* ══════════════════════════════════════════════════════════════════════════
 * [H3] 지난 실행의 사고 — 되찾기 + 원인 보내기
 * ──────────────────────────────────────────────────────────────────────────
 * ★판정·문구는 js/recovery-banner.js «하나»가 한다. 여기서 다시 해석하지 않는다
 *   (entitlement-banner 와 같은 규율 — 판정이 두 벌이 되면 갈라진다).
 * ★★노출 규칙(지디 확정) — 이 블록이 «마지막 관문»이다
 *   ⑴ 동의 없이 아무것도 안 나간다. 여기엔 전송 호출이 «없다» — [원인 보내기]는
 *      기존 신고 창을 «열» 뿐이고, 실제 전송은 거기서 [보내기]를 눌러야 일어난다.
 *   ⑵ 나갈 줄을 «그대로» 볼 수 있다 — [보낼 내용 그대로 보기] + 신고 창을 «펼친 채로» 연다.
 *   ⑶ 비상 사본(문서 본문)은 «절대» 신고에 안 붙는다. 되살리기·파일 열기는 로컬뿐이다.
 *   ⑷ 애매하면 «안 보내는» 쪽.
 * ★[✕]=이번만 숨김(다음 실행 때 다시 뜬다) / [이 안내 그만 보기]=도장(attachedAt).
 *   ⛔도장을 찍어도 원본 기록은 «안 지운다» — 나중에 다시 찾을 수 있어야 한다.
 * ══════════════════════════════════════════════════════════════════════════ */
let _recoveryPending = null;
function _recEl(id) { return document.getElementById(id); }

async function paintRecoveryBanner() {
  const box = _recEl('recovery-banner');
  if (!box) return;
  const api = window.electronAPI;
  if (!api || !api.recovery) return;              // 브라우저에서 열었을 때 — 조용히 생략
  let p = null;
  try { p = await api.recovery.pending(); } catch (_) { p = null; }
  _recoveryPending = p;
  const R = window.RecoveryBanner;
  const decided = (R && p) ? R.decide(p) : null;
  if (!decided) { box.style.display = 'none'; return; }
  _recEl('recovery-banner-headline').textContent = decided.headline;
  _recEl('recovery-banner-sub').textContent = decided.sub;
  const rb = _recEl('recovery-restore');
  rb.style.display = decided.restorable > 0 ? '' : 'none';
  renderRecoveryDetail();
  box.style.display = '';
}

/** 첫 «되살릴 수 있는» 저장 실패. 배너의 [되살리기]가 가리키는 대상이다. */
function _firstRestorable() {
  const items = (_recoveryPending && _recoveryPending.items) || [];
  return items.find(i => i.kind === 'save-failure' && i.emergencyExists) || null;
}

function renderRecoveryDetail() {
  const wrap = _recEl('recovery-detail');
  const R = window.RecoveryBanner;
  if (!wrap || !R) return;
  const p = _recoveryPending || {};
  const items = p.items || [];
  const lines = p.reportLines || [];
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  let html = items.map((it, i) =>
    '<div class="rec-item">' +
      '<span class="rec-item-txt">' +
        '<span class="rec-item-title">' + esc(R.itemTitle(it)) + '</span>' +
        '<small class="rec-item-meta">' + esc(R.itemDetail(it)) + '</small>' +
      '</span>' +
      '<span class="rec-acts">' +
        (it.emergencyExists
          ? '<button type="button" data-rec-restore="' + i + '">되살리기</button>' +
            '<button type="button" data-rec-reveal="' + i + '">파일 위치</button>'
          : '') +
      '</span>' +
    '</div>').join('');

  if (p.degraded && p.degraded.length) {
    // ★「없다」와 「못 읽었다」는 다른 말이다 — 삼키지 않고 화면에 적는다.
    html += '<div class="rec-item"><span class="rec-item-txt"><span class="rec-item-title">' +
      '일부 기록을 읽지 못했습니다</span><small class="rec-item-meta">' +
      esc(p.degraded.join(' / ')) + '</small></span></div>';
  }

  html +=
    '<div id="recovery-send-box">' +
      '<div class="rec-acts">' +
        '<button type="button" id="recovery-send"' + (lines.length ? '' : ' disabled') + '>원인 보내기…</button>' +
        '<button type="button" id="recovery-show-out" aria-expanded="false" aria-controls="recovery-outgoing">' +
          '보낼 내용 그대로 보기 (' + lines.length + '줄)</button>' +
        '<button type="button" id="recovery-dismiss" ' +
          'title="다시 안 띄웁니다. ⛔기록과 비상 사본 파일은 지우지 않습니다 — 나중에 다시 찾을 수 있습니다">' +
          '이 안내 그만 보기</button>' +
      '</div>' +
      /* ★비상 사본이 안 나간다는 사실을 «명시»한다 — 뭉뚱그리지 않는다. */
      '<small class="rec-item-meta">보내기를 눌러야 나갑니다. ' +
        '작업 내용(비상 사본)은 보내지지 않고 이 컴퓨터에만 남습니다.</small>' +
      '<pre id="recovery-outgoing">' + esc(R.outgoingText(lines)) + '</pre>' +
    '</div>';
  wrap.innerHTML = html;
}

(function wireRecoveryBanner() {
  const box = _recEl('recovery-banner');
  if (!box) return;
  const api = () => window.electronAPI && window.electronAPI.recovery;
  /* ★결과는 «배너 안 한 줄»로 말한다. ⛔alert/confirm 금지 — 이 배너는 사용자를 막지 않는다.
     (이 화면엔 showToast 가 없다. 있으면 그걸 쓰고, 없어도 «조용히» 끝나지 않게 줄을 남긴다.) */
  const say = (m) => {
    const s = _recEl('recovery-say');
    if (s) { s.textContent = m; s.style.display = ''; }
    if (typeof window.showToast === 'function') { try { window.showToast(m); } catch (_) {} }
  };

  const doRestore = async (it) => {
    if (!it || !api()) return;
    const r = await api().restore({ emergencyPath: it.emergencyPath, projectId: it.projectId });
    if (r && r.ok) {
      // 되살렸으면 그 기록은 «할 일을 다 했다» — 도장을 찍는다(원본 파일은 그대로 둔다).
      try { await api().ack([it.id]); } catch (_) {}
      /* ★반쪽이면 «반쪽이라고» 말한다 — 원본 폴더가 없으면 이미지 자산이 안 따라온다.
         조용히 그림 빠진 프로젝트를 주면 사용자는 두 번째로 잃는다. */
      say(r.assetsLinked === false
        ? '✅ 「' + r.name + '」으로 되살렸습니다 — ⚠️원본 프로젝트가 없어 «이미지가 빠졌을 수» 있습니다'
        : '✅ 「' + r.name + '」으로 되살렸습니다');
      try { await renderGrid(); } catch (_) {}
      await paintRecoveryBanner();
    } else {
      // ⛔실패를 «성공처럼» 말하지 않는다. 파일은 그대로 있으니 다른 통로를 알린다.
      say('⚠️ 되살리지 못했습니다 (' + ((r && (r.error || r.code)) || '알 수 없음') + ') — [파일 위치]로 사본을 직접 챙기실 수 있습니다');
    }
  };

  box.addEventListener('click', async (ev) => {
    const t = ev.target.closest('button');
    if (!t) return;
    const items = (_recoveryPending && _recoveryPending.items) || [];

    if (t.id === 'recovery-banner-close') { box.style.display = 'none'; return; }  // ★이번만
    if (t.id === 'recovery-toggle') {
      const d = _recEl('recovery-detail');
      const next = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', String(next));
      d.classList.toggle('on', next);
      return;
    }
    if (t.id === 'recovery-restore') { await doRestore(_firstRestorable()); return; }
    if (t.dataset.recRestore != null) { await doRestore(items[Number(t.dataset.recRestore)]); return; }
    if (t.dataset.recReveal != null) {
      const it = items[Number(t.dataset.recReveal)];
      const r = it && api() ? await api().reveal({ emergencyPath: it.emergencyPath }) : null;
      if (!r || !r.ok) say('⚠️ 사본 파일을 찾지 못했습니다');
      return;
    }
    if (t.id === 'recovery-show-out') {
      const pre = _recEl('recovery-outgoing');
      const next = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', String(next));
      pre.classList.toggle('on', next);
      return;
    }
    if (t.id === 'recovery-dismiss') {
      if (api()) { try { await api().ack(items.map(i => i.id)); } catch (_) {} }
      box.style.display = 'none';
      return;
    }
    if (t.id === 'recovery-send') {
      /* ★★여기서 «보내지 않는다» — 기존 신고 창을 열 뿐이다. 사용자가 거기서 [보내기]를
         눌러야 나간다. 그리고 창은 「함께 보내지는 것」을 «펼친 채로» 열려서
         나갈 줄이 그대로 보인다(report-modal.js open({extraErrors})). */
      const lines = (_recoveryPending && _recoveryPending.reportLines) || [];
      if (!window.openReportModal) { say('⚠️ 이 화면에서는 신고 창을 열 수 없습니다'); return; }
      window.openReportModal({
        type: 'bug',
        text: '지난 실행에서 예기치 않은 종료·저장 실패가 있었습니다.\n(무슨 작업을 하던 중이었는지 적어주시면 원인을 찾는 데 큰 도움이 됩니다.)\n\n',
        extraErrors: lines,
      });
      /* ★★★도장은 «크래시 기록만». ⛔되살릴 사본이 남은 저장 실패에는 찍지 않는다.
         실기가 잡은 진짜 결함(2026-09-06): 여기서 «전부» 찍었더니 [원인 보내기] 한 번에
         배너가 사라져 [되살리기]가 같이 없어졌다 — 사용자는 원인만 보내고 «문서는 잃는다».
         그게 바로 「복구할 수 있었는데 못 했다」다(지디 확정 반려 조건).
         ⇒ 크래시는 「보냈으니 할 일 끝」이지만, 저장 실패는 «되살려야» 할 일이 끝난다. */
      const crashIds = items.filter(i => i.kind === 'crash').map(i => i.id);
      if (api() && crashIds.length) { try { await api().ack(crashIds); } catch (_) {} }
      await paintRecoveryBanner();   // 남은 게 있으면 «계속 떠 있는다»
      if (_recEl('recovery-detail')) _recEl('recovery-detail').classList.remove('on');
      return;
    }
  });
})();

function paintAcct(st) {
  const box = document.getElementById('acct');
  if (!box) return;
  if (!st || !st.signedIn) { box.style.display = 'none'; closeAcctMenu(); return; }
  const code = String(st.plan || '').toLowerCase();
  const badge = document.getElementById('acct-plan');
  // ★모르는 코드값이면 «그 값을 그대로» 보여준다. 빈칸으로 두면 서버가 뭘 줬는지 알 수 없다.
  const planLabel = PLAN_LABEL[code] || (code ? code.toUpperCase() : '—');
  badge.textContent = planLabel;
  badge.className = 'acct-badge ' + (PLAN_CLASS[code] || '');
  const email = st.email || '';
  document.getElementById('acct-mail').textContent = email;
  document.getElementById('acct-menu-mail').textContent = email;
  // 아바타는 이니셜 한 글자 — 외부 이미지를 부르지 않는다(CSP img-src·오프라인).
  const av = document.getElementById('acct-avatar');
  if (av) av.textContent = (email.trim().charAt(0) || '?').toUpperCase();
  let until = '';
  if (st.accessUntil) {
    const d = new Date(st.accessUntil);
    if (!isNaN(d)) {
      const left = Math.ceil((d - Date.now()) / 86400000);
      until = d.toISOString().slice(0, 10) + ' 까지' + (left >= 0 && left <= 30 ? ' · ' + left + '일 남음' : '');
    }
  }
  // ★기간은 «평소엔 안 보인다» — 드롭다운 안에서만 「BETA · 2026-12-31 까지」 한 줄로.
  document.getElementById('acct-until').textContent = until ? (planLabel + ' · ' + until) : planLabel;
  box.style.display = 'block';
}

/* ── 계정 드롭다운 ───────────────────────────────────────────────────────
 * ★리스너는 «한 번만» 묶는다(acctWired). 이 페이지는 renderGrid()를 여러 번 도는데,
 *   그때마다 묶으면 클릭 한 번이 두 번 나간다 — 2026-08-15 설정 pane 이 두 번 그려져
 *   「클릭 한 번에 초대 두 번」이 나갔던 사고와 같은 계열이다.
 * ★키보드: Enter/Space(버튼 기본) 열기 · Esc 닫고 트리거로 복귀 · ↑↓ 항목 이동.
 */
let acctWired = false;
function acctItems() {
  return Array.from(document.querySelectorAll('#acct-menu [data-acct-item]'))
              .filter(el => !el.disabled);
}
function openAcctMenu(focusFirst) {
  const box = document.getElementById('acct');
  if (!box || box.style.display === 'none') return;
  box.classList.add('open');
  document.getElementById('acct-trigger')?.setAttribute('aria-expanded', 'true');
  if (focusFirst) acctItems()[0]?.focus();
}
function closeAcctMenu(focusTrigger) {
  const box = document.getElementById('acct');
  if (!box || !box.classList.contains('open')) return;
  box.classList.remove('open');
  const tr = document.getElementById('acct-trigger');
  tr?.setAttribute('aria-expanded', 'false');
  if (focusTrigger) tr?.focus();
}
function wireAcctMenu(api) {
  if (acctWired) return;                 // ★이중 결선 금지
  acctWired = true;

  const box  = document.getElementById('acct');
  const tr   = document.getElementById('acct-trigger');
  const menu = document.getElementById('acct-menu');
  if (!box || !tr || !menu) return;

  tr.addEventListener('click', (e) => {
    e.stopPropagation();
    box.classList.contains('open') ? closeAcctMenu() : openAcctMenu(false);
  });
  tr.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); openAcctMenu(true); }
  });
  // 바깥 클릭 — 문서에 «하나»만 건다
  document.addEventListener('click', (e) => {
    if (box.classList.contains('open') && !e.target.closest('#acct')) closeAcctMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && box.classList.contains('open')) { e.preventDefault(); closeAcctMenu(true); }
  });
  menu.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const items = acctItems();
    if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    items[n < 0 ? 0 : n].focus();
  });

  /* ★새로고침 = «서버에 물어 plan·accessUntil 을 새로 받는» 유일한 경로다.
   *   (auth:state 는 로컬 auth.json 을 다시 그릴 뿐이고, 이 앱엔 사용자용 ⌘R·리로드 메뉴가 없다.)
   *   아이콘 버튼으로 바뀌었을 뿐 분기(오프라인/기간만료/invalid_session)는 그대로 산다. */
  const rf = document.getElementById('acct-refresh');
  const rs = document.getElementById('acct-refresh-state');
  const setState = (t) => { if (rs) rs.textContent = t || ''; };
  if (rf) rf.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (rf.disabled) return;
    rf.disabled = true; rf.classList.add('is-busy'); setState('확인 중…');
    try {
      const r = await (api.refreshAuth ? api.refreshAuth() : null);
      // ★세션이 폐기됐으면(다른 기기 로그인 등) 이 화면에 머물게 두면 안 된다 —
      //   등급 표시가 사라진 채 「왜 안 되지」로 남는다. 만료 화면으로 넘겨서 다시 로그인하게 한다.
      if (r && r.reason === 'invalid_session') {
        rf.classList.remove('is-busy');
        setState('다시 로그인');
        setTimeout(() => { window.location.href = 'license.html'; }, 900);
        return;
      }
      const freshSt = await api.getAuthState();
      paintAcct(freshSt);
      paintSigStaleBanner(freshSt);
      // ★오프라인이면 «조용히 실패»하면 안 된다 — 눌렀는데 아무 일도 안 일어난 걸로 보인다.
      //   만료도 마찬가지다 — 서버는 대답했는데 「갱신됨」이라고 쓰면 거짓말이 된다.
      setState((r && r.ok) ? '갱신됨'
             : (r && r.reason === 'offline') ? '오프라인'
             : (r && r.reason === 'expired') ? '기간만료'
             : '');
    } catch (_) { setState(''); }
    rf.classList.remove('is-busy');
    setTimeout(() => { setState(''); rf.disabled = false; }, 1600);
  });

  const up = document.getElementById('acct-upgrade');
  if (up) up.addEventListener('click', async (e) => {
    e.stopPropagation();
    closeAcctMenu();
    const st = await api.getAuthState();
    if (st && st.purchaseUrl && api.openExternalUrl) await api.openExternalUrl(st.purchaseUrl);
  });

  /* ★로그아웃 — 세션(userData/auth.json)을 지우고 로그인 화면으로 «되돌린다».
   *   ⛔새 IPC 를 만들지 않는다 — 이미 있는 auth:logout(main.js) / authLogout(preload) 을 쓴다.
   *   ★확인을 «받는다»: 위 두 항목(새로고침·요금제 열기)은 잘못 눌러도 되돌아오는데,
   *     이건 다시 들어오려면 이메일·비밀번호를 «다시» 쳐야 한다(오프라인이면 못 들어온다).
   *     좁은 드롭다운에서 한 칸 아래를 누르는 실수의 대가가 다른 항목과 다르다.
   *     (Electron 은 prompt() 만 막는다 — confirm() 은 이 파일이 이미 여러 곳에서 쓴다.)
   *   ★화면을 «반드시» 되돌린다: 지우기만 하고 이 화면에 남으면 프로젝트가 열리는데
   *     로그인은 안 된 «반쯤 로그아웃» 상태가 된다. 이동 경로는 위 acct-refresh 의
   *     invalid_session 분기와 «같은» license.html 이다(입구를 두 벌 만들지 않는다). */
  const out = document.getElementById('acct-logout');
  if (out) out.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('로그아웃할까요?\n\n다시 쓰려면 이메일·비밀번호로 다시 로그인해야 합니다.\n(작업한 프로젝트는 이 컴퓨터에 그대로 남습니다.)')) return;
    closeAcctMenu();
    try { await api.authLogout?.(); } catch (_) {}
    window.location.href = 'license.html';
  });
}

(async () => {
  const api = window.electronAPI;
  if (!api || !api.getAuthState) return;          // 브라우저에서 열었을 때 — 조용히 생략
  const bootSt = await api.getAuthState();
  paintAcct(bootSt);
  paintSigStaleBanner(bootSt);
  wireAcctMenu(api);
  /* ★[H3] 지난 실행의 사고 — 계정 그리기 «뒤»에 돈다. 실패해도 이 화면이 안 죽게 따로 잡는다
     (복구 안내가 못 떠도 프로젝트 목록은 떠야 한다 — 안내는 «정보»지 관문이 아니다). */
  try { await paintRecoveryBanner(); } catch (e) { console.warn('[recovery] 배너 실패:', e && e.message); }
})();

/* ── 보기 전환(그리드 / 리스트) ──────────────────────────────────────────
 * ★렌더러를 새로 만들지 않는다 — 카드 DOM 은 그대로 두고 #project-grid 의 클래스만 바꿔
 *   같은 카드를 한 줄 행으로 «접는다». 그래서 카드 열기·삭제·이름변경·배지·글꼴배지가
 *   두 보기에서 «같은 코드»로 돈다(분기 = 클래스 하나).
 * ★저장은 이 페이지가 이미 쓰는 localStorage 를 그대로 쓴다(새 저장소 신설 금지 —
 *   web-editor-open-tabs·claudePM:folderMap 과 같은 자리, Electron 이 ud 에 디스크로 남긴다).
 */
const VIEW_KEY = 'goditor_projects_view';
function getViewMode() {
  try { return localStorage.getItem(VIEW_KEY) === 'list' ? 'list' : 'grid'; } catch (_) { return 'grid'; }
}
function applyViewMode(mode, persist) {
  const m = (mode === 'list') ? 'list' : 'grid';
  document.getElementById('project-grid')?.classList.toggle('is-list', m === 'list');
  document.getElementById('gallery-col')?.classList.toggle('is-list-mode', m === 'list');   // 폴더 타일 압축형(B안)
  // ★선택 표시는 radio 의 checked 하나로 끝난다 — 클래스 토글을 따로 두지 않는다
  //   (두 개면 반드시 어긋난다). CSS 가 :has(.vt-radio:checked) 로 칩을 그린다.
  document.querySelectorAll('#view-toggle .vt-radio').forEach(r => { r.checked = (r.dataset.view === m); });
  if (persist) { try { localStorage.setItem(VIEW_KEY, m); } catch (_) {} }
}
(function wireViewToggle() {
  const wrap = document.getElementById('view-toggle');
  if (!wrap) return;
  // 클릭도 방향키도 결국 radio 의 change 로 모인다 — 결선은 «한 곳»뿐이다.
  wrap.addEventListener('change', (e) => {
    const r = e.target.closest('.vt-radio');
    if (r) applyViewMode(r.dataset.view, true);
  });
  applyViewMode(getViewMode(), false);   // 저장된 값으로 복원(첫 렌더 전에 켜도 무해)
})();
</script>

     카드의 🕐 버튼은 renderGrid() 가 «인라인 onclick» 으로 그리므로 별도 후처리가 필요 없다. -->
