name: Release Windows

# GODITOR Windows 빌드 (NSIS .exe) — macOS에서 cross-compile하지 않고
# 진짜 Windows runner에서 빌드 후 GitHub Releases에 자산 추가.
#
# 트리거:
# - tag push (v*): 자동으로 빌드 + 게시. 릴리스 흐름의 정규 경로.
# - workflow_dispatch: 수동. 기본은 "게시 안 함"(빌드 검증만) — 태그를 내지 않고도
#   워크플로가 살아있는지 확인할 수 있게. 게시까지 하려면 publish 입력을 켠다.
#
# ⚠️ 이 워크플로가 켜진 뒤로는 릴리스 때 로컬에서 `npm run release:win`을 돌리지 말 것.
#    같은 릴리스에 같은 자산을 양쪽에서 올리면 충돌한다. 맥은 로컬, 윈도우는 여기.
#
# 미서명: Windows 코드서명 인증서 없음. SmartScreen 경고는 사용자가 1회 수락.
# 자동업데이트: electron-updater + NSIS는 미서명에서도 동작.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'GitHub Releases에 게시까지 할지 (끄면 빌드 검증만)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 같은 ref에 대해 중복 실행 방지(태그 푸시 + 수동이 겹칠 때)
concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci는 package.json↔package-lock.json이 어긋나면 즉시 죽는다(2026-05-28 실패 원인).
      # 결정성을 위해 ci를 유지하되, 어긋났을 때 원인이 로그에 바로 보이게 둔다.
      - name: Install deps
        run: npm ci

      - name: Build only (게시 안 함)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npx electron-builder --win --publish never

      - name: Build & publish
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: win-dist
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: warn
          retention-days: 7
