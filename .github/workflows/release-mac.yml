name: Release macOS

# GODITOR macOS 빌드(dmg + zip) — 코드서명 + 공증까지 CI에서 수행.
#
# ⚠️ 윈도우와 달리 맥은 서명·공증이 사실상 필수다(hardenedRuntime·notarize:true).
#    그래서 아래 Secrets가 반드시 있어야 하고, 없으면 빌드가 실패한다.
#
#   MAC_CERT_P12        Developer ID Application 인증서+개인키를 .p12로 내보내 base64 인코딩한 값
#   MAC_CERT_PASSWORD   위 .p12를 내보낼 때 지정한 암호
#   APPLE_ID            공증에 쓰는 Apple 계정 이메일
#   APPLE_APP_PASSWORD  그 계정의 앱 암호(app-specific password)
#   APPLE_TEAM_ID       팀 ID (7WFC36CDZ7)
#
# 트리거는 윈도우와 동일 — 태그 푸시 시 자동, 수동 실행은 기본 '게시 안 함'.
# ⚠️ 이 워크플로가 켜진 뒤로는 로컬에서 `npm run release:mac`을 돌리지 말 것(자산 중복 업로드 충돌).
#    ★2026-09-22 실행 기록으로 확인 — v0.8.5 이후 릴리스는 맥도 «여기서» 빌드됐다
#    (Release macOS 워크플로가 매 태그마다 success). release-win.yml 의 「맥은 로컬」은 늙은 줄이다.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'GitHub Releases에 게시까지 할지 (끄면 빌드 검증만)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-latest
    # ★★2026-10-19 — 60 → 120 (현빈 GO · msg 4697 「너의 제안 대로 … 서둘러서 배포」)
    #   ★왜: v0.9.8 에서 DOM 전수가 ★60분 벽에 ★두 번 잘렸다(attempt 1·2 둘 다 cancelled).
    #   ★실측  0.9.7 성공  검사 36.6분 · job 43.8분 · 3476 tests · 95.1 tests/분
    #          0.9.8      검사 56.7분에 ★72.8%(3071/4217)에서 잘림 ⇒ ★전수 ★78분 추정
    #   ★까닭 둘: ⑴시험이 늘었다(3476 → 4217) ⑵★같은 시험이 ★CI 에서 ★느려졌다(+64.6%)
    #            ★인텔 맥에선 같은 시험이 ★+7.6% 뿐이다 ⇒ ★★증폭은 ★CI 쪽이고 ★까닭은 ★아직 모른다.
    #   ★120 의 근거: 전수 78분 + 서명·공증·업로드(0.9.7 때 6.9분, 자산 커져 ~15분) ≈ 93분 ⇒ ★여유 27분.
    #   ⛔이것은 ★임시 처방이다 — ★시험은 계속 는다. ★근본은 ★샤딩(matrix)이고 ★배포 뒤 별건으로 한다.
    #   ⛔workers 는 ★안 건드렸다 — ★러너 ★코어 수를 ★안 쟀다(로그에 없다). ★재기 전엔 ★추측으로 올리지 마라.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ★전체 히스토리 — 골든 검사가 «기준판»을 git 에서 뜬다
          #   (tests/unit/grid-gap-clamp.test.js: git show 55f3a1a:js/blocks/grid-block.js).
          #   기본값 depth:1 이면 그 커밋이 없어 골든 11건이 전부 빨강이 된다(0.9.4 실측).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 인증서를 '임시 키체인'에 심는다. 러너는 실행이 끝나면 통째로 폐기되므로
      # 키가 남지 않는다. 로그인 키체인을 건드리지 않는 것이 핵심.
      # ══ 배포 전 관문 (2026-09-22 신설) ═══════════════════════════════════
      # ★왜 여기냐 — 「배포 하드 게이트」(tools/deploy-gate.js, 2026-08-15)는
      #   package.json 의 release:mac / release:win «앞»에만 달려 있었다.
      #   그런데 정규 배포 경로는 «태그 푸시 → 이 워크플로»이고, 여기서는
      #   npx electron-builder 를 «직접» 부른다 ⇒ 게이트를 통째로 비껴갔다.
      #   실측(2026-09-22): v0.8.5 · v0.8.6 · v0.9.0 · v0.9.1 · v0.9.2 · v0.9.3
      #   여섯 태그의 맥·윈 실행이 전부 success 였고, 그 단계 목록 아홉 개에
      #   게이트도 검사도 «없었다». 게이트 머리말은 「안 지키면 배포가 실패하는
      #   구조」라고 적혀 있었지만 이 경로에선 아무것도 안 막고 있었다.
      # ★검사도 같다 — npm test / npm run test:dom 을 부르는 자리가
      #   훅·CI·배포 어디에도 없었다(T-144). 지금까지 돈 건 사람이 생각났을 때뿐이다.
      # ⛔게이트를 «경고»로 낮추지 마라 — 그러면 다시 「검사처럼 생긴 문장」이 된다.
      - name: 배포 하드 게이트 (먼저 — 1초, 빨리 죽으라고)
        shell: bash
        run: node tools/deploy-gate.js

      - name: 검사 — 단위
        shell: bash
        run: npm test

      - name: 검사 — DOM
        shell: bash
        run: |
          npx playwright install chromium
          npm run test:dom
      # ═══════════════════════════════════════════════════════════════════

      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS=$(openssl rand -base64 24)
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # codesign이 암호 프롬프트 없이 키를 쓰도록 허용
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f /tmp/cert.p12
          echo "설치된 서명 ID:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[A-F0-9]\{40\}/<지문숨김>/'

      - name: Build only (게시 안 함)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: build.keychain
        run: npx electron-builder --mac --publish never

      - name: Build & publish
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEYCHAIN: build.keychain
        run: npx electron-builder --mac --publish always

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true
