<!doctype html>
<meta charset="utf-8">
<title>U6b 교체 — 렌더러 호출 순서 실측</title>
<link rel="stylesheet" href="../../css/editor-base.css">
<link rel="stylesheet" href="../../css/settings-modal.css">
<link rel="stylesheet" href="../../css/version-history.css">
<body style="margin:0;background:#1a1a1a">
<script src="../../js/version-diff.js"></script>
<script src="../../js/version-history.js"></script>
<script>
/* ── 실앱을 «흉내내되», 재는 건 «호출 순서»다 ────────────────────────────
 * autosave 경합 회피의 성립 조건은 하나다:
 *   applyProjectData 가 «불리는 그 순간» state._suppressAutoSave 가 true 여야 한다.
 *   억제를 걸었다가 apply 전에 풀면(또는 apply 뒤에 걸면) 경합은 그대로 난다.
 * ⇒ apply 시점의 억제값을 «그 안에서» 기록한다. 전후만 보면 이 실수를 못 잡는다. */
const LOG = [];
window.state = { _suppressAutoSave: false };
window.openTabs = [{ id: 'proj_1', name: 'T' }];
window.activeProjectId = 'proj_1';
window.serializeProject = () => JSON.stringify({ id: 'proj_1', version: 2,
  pages: [{ id: 'page_1', canvas: '<div class="section-block" id="sec_live" data-name="화면최신"></div>' }] });
window.applyProjectData = (d) => {
  LOG.push({ step: 'apply', suppressed: window.state._suppressAutoSave, sections: (JSON.stringify(d).match(/section-block/g) || []).length });
};
window.showToast = (m) => LOG.push({ step: 'toast', m });
window.renderGrid = async () => LOG.push({ step: 'renderGrid' });
// ★실앱은 save-load.js:1772 가 항상 window.saveProjectToFile 을 깔아둔다. 프로브가 그걸 «안 정의»해서
//   교체 경로의 정상 저장 분기를 한 번도 안 밟았다 — 그 안에 죽은 가드가 있었다.
//   반환은 실계약만: { ok:true } / { ok:false, reason } / { ok:false, skipped:true } / undefined(큐잉)
window.__saveReply = { ok: true };
window.saveProjectToFile = async (snap, opts) => { LOG.push({ step: 'saveToFile', opts }); return window.__saveReply; };
window.__alerts = [];
window.alert = (m) => { window.__alerts.push(m); LOG.push({ step: 'alert', m }); };
window.confirm = (m) => { LOG.push({ step: 'confirm', m }); return window.__confirmAnswer !== false; };

const TARGET = { id: 'proj_1', version: 2, pages: [{ id: 'page_1',
  canvas: '<div class="section-block" id="sec_a" data-name="혜택정리"></div>'
        + '<div class="section-block" id="sec_b" data-name="FAQ"></div>'
        + '<div class="section-block" id="sec_c" data-name="배송안내"></div>' }] };
const NOW = Date.now();
const S = (k, n) => ({ k, n });
window.__restoreReply = { ok: true, applyInRenderer: true, preRestoreTs: NOW - 1000, ts: NOW - 3 * 3600e3, data: TARGET, source: 'live' };
window.electronAPI = {
  historyList: async () => ({ ok: true,
    current: { ts: NOW, bytes: 1000, counts: { pages: 1, sections: 1, blocks: 1, images: 0 }, secs: [S('page_1::sec_a', '혜택정리')] },
    entries: [{ ts: NOW - 3 * 3600e3, file: 'a.json', reason: 'auto', pinned: false, canon: 1, bytes: 2000,
      counts: { pages: 1, sections: 3, blocks: 3, images: 0 },
      secs: [S('page_1::sec_a', '혜택정리'), S('page_1::sec_b', 'FAQ'), S('page_1::sec_c', '배송안내')] }],
    legacyCount: 0, pendingCount: 0, totalBytes: 2000 }),
  historyRestore: async (args) => { LOG.push({ step: 'restoreCall', args: { openProjectIds: args.openProjectIds, hasCurrentData: !!args.currentData } }); return window.__restoreReply; },
  saveProject: async () => { LOG.push({ step: 'save', suppressed: window.state._suppressAutoSave }); return { ok: true }; },
  historyOpenCopy: async () => ({ ok: true, newProjectId: 'p2', newName: '사본' }),
};
</script>
<script src="../../js/version-history-ui.js"></script>
<script>
(async function () {
  const R = { ok: true, problems: [], env: {} };
  const P = (m) => R.problems.push(m);
  const open = async () => { await window.openVersionHistory({ projectId: 'proj_1', projectName: 'T' }); await new Promise(r => setTimeout(r, 50)); };
  const clickRestore = async () => {
    const b = document.querySelector('[data-vh-restore]');
    if (!b) { P('★「이 버전으로 교체」 버튼이 없다'); return false; }
    b.click(); await new Promise(r => setTimeout(r, 120)); return true;
  };

  /* ① 교체가 «기본»(primary)인가 — 현빈 Q2 */
  await open();
  const rb = document.querySelector('[data-vh-restore]');
  const cb = document.querySelector('[data-vh-open]');
  R.env.restoreIsPrimary = !!(rb && rb.classList.contains('settings-btn-primary'));
  R.env.copyIsSecondary = !!(cb && cb.classList.contains('settings-btn-secondary'));
  if (!R.env.restoreIsPrimary) P('★교체가 primary 가 아니다 — 현빈 확정은 「교체가 기본」이다');
  if (!R.env.copyIsSecondary) P('사본이 secondary 가 아니다');

  /* ② ★호출 순서 — apply 시점에 억제가 켜져 있나 */
  LOG.length = 0;
  await clickRestore();
  R.env.order = LOG.map(x => x.step);
  const apply = LOG.find(x => x.step === 'apply');
  const save = LOG.find(x => x.step === 'save');
  R.env.suppressedAtApply = apply ? apply.suppressed : null;
  R.env.suppressReleasedAfter = window.state._suppressAutoSave === false;
  if (!apply) P('★applyProjectData 가 안 불렸다 — 렌더러 적용 경로가 안 돈다');
  else if (apply.suppressed !== true)
    P('★applyProjectData 가 불리는 «그 순간» 억제가 꺼져 있었다 — 1.5초 뒤 autosave 가 되돌린다');
  if (!R.env.suppressReleasedAfter) P('★억제가 안 풀렸다 — 이후 편집이 저장되지 않는다');
  if (!save) P('★적용 뒤 저장이 없다 — 다음 autosave 까지 디스크는 옛 상태다');
  else if (R.env.order.indexOf('save') < R.env.order.indexOf('apply')) P('저장이 적용보다 «먼저» 일어났다');
  if (apply && apply.sections !== 3) P(`적용된 데이터가 대상이 아니다 (섹션 ${apply.sections})`);

  /* ③ 확인창이 «되돌릴 수 있다»를 말하나 */
  const conf = LOG.find(x => x.step === 'confirm');
  R.env.confirmText = conf ? conf.m : null;
  if (!conf) P('★확인 없이 파괴가 일어났다');
  else if (!/자동으로 버전으로 저장|다시 되돌릴 수 있/.test(conf.m))
    P('확인창이 「직전 상태가 저장된다·되돌릴 수 있다」를 안 말한다');

  /* ④ 열린 탭·화면 최신 상태를 넘기나 */
  const call = LOG.find(x => x.step === 'restoreCall');
  R.env.sentOpenIds = call ? call.args.openProjectIds : null;
  R.env.sentCurrentData = call ? call.args.hasCurrentData : null;
  if (!Array.isArray(R.env.sentOpenIds)) P('★openProjectIds 를 «항상» 배열로 넘겨야 한다(안 넘기면 main 이 거부)');
  if (!R.env.sentCurrentData) P('★열려 있는데 화면 최신 상태를 안 넘겼다 — 미저장분이 안전판에서 빠진다');

  /* ⑤ ★확인창에서 «취소»하면 아무 일도 안 일어나나 (음성대조) */
  window.__confirmAnswer = false;
  LOG.length = 0;
  await open(); await clickRestore();
  R.env.cancelledSteps = LOG.map(x => x.step).filter(s => s !== 'confirm');
  if (R.env.cancelledSteps.length) P(`★취소했는데 뭔가 일어났다: ${R.env.cancelledSteps.join(',')}`);
  window.__confirmAnswer = true;

  /* ⑥ ★거부 응답을 «왜»와 «대안»으로 보여주나 */
  window.__restoreReply = { ok: false, reason: 'multiple_windows', windowCount: 2,
    message: '창이 2개 열려 있어 교체할 수 없습니다(다른 창에서 이 프로젝트를 편집 중일 수 있습니다) — 새 프로젝트로 복원하세요.' };
  window.__alerts.length = 0; LOG.length = 0;
  await open(); await clickRestore();
  R.env.refuseAlert = window.__alerts[0] || null;
  if (!R.env.refuseAlert) P('★거부됐는데 사용자에게 아무 말도 안 했다 — 조용한 거부가 제일 나쁘다');
  else {
    if (!/창이 2개|다른 창/.test(R.env.refuseAlert)) P('거부 «이유»를 안 말한다');
    if (!/사본으로|새 프로젝트/.test(R.env.refuseAlert)) P('★«대신 뭘 하면 되는지»를 안 말한다');
  }
  if (LOG.some(x => x.step === 'apply')) P('★거부됐는데 적용이 일어났다');

  /* ⑦ 실패 응답에서도 적용이 «안» 일어나나 */
  window.__restoreReply = { ok: false, reason: 'pre_restore_failed' };
  LOG.length = 0;
  await open(); await clickRestore();
  if (LOG.some(x => x.step === 'apply')) P('★안전판 실패인데 적용이 일어났다 — 이 기능의 존재 이유가 무너진다');

  /* ⑦-b ★저장이 «실패»하거나 «스킵»되면 「교체됨」이라 말하지 않는다 (죽은 가드가 여기서 잡힌다) */
  for (const [label, reply] of [['EACCES', { ok: false, reason: 'EACCES' }],
                                ['빈캔버스 스킵', { ok: false, skipped: true, reason: 'empty_canvas_skipped' }]]) {
    window.__restoreReply = { ok: true, applyInRenderer: true, preRestoreTs: NOW, ts: NOW, data: TARGET };
    window.__saveReply = reply;
    window.__alerts.length = 0; LOG.length = 0;
    await open(); await clickRestore();
    const said = LOG.filter(x => x.step === 'toast').map(x => x.m).join(' ');
    R.env['saveFail_' + label] = { alerts: window.__alerts.length, toast: said };
    if (!window.__alerts.length) P(`★저장 ${label} 인데 사용자에게 «아무 말도» 안 했다`);
    if (/교체됨/.test(said)) P(`★저장 ${label} 인데 「교체됨」이라고 말했다 — 화면만 바뀌고 디스크는 그대로다`);
  }
  window.__saveReply = { ok: true };

  /* ⑧ 검출기 자가시험 — 「apply 시점 억제」 판정이 «진짜로» 빨강을 낼 수 있나 */
  window.__restoreReply = { ok: true, applyInRenderer: true, preRestoreTs: NOW, ts: NOW, data: TARGET };
  const realApply = window.applyProjectData;
  window.applyProjectData = (d) => LOG.push({ step: 'apply', suppressed: false, sections: 3 });  // 일부러 «억제 꺼짐»
  LOG.length = 0;
  await open(); await clickRestore();
  const bad = LOG.find(x => x.step === 'apply');
  R.env.selftestDetectsUnsuppressed = !!(bad && bad.suppressed === false);
  window.applyProjectData = realApply;
  if (!R.env.selftestDetectsUnsuppressed) P('★자가시험 실패 — 「억제 꺼짐」을 못 잡는다면 위 초록은 무효다');

  R.ok = R.problems.length === 0;
  window.__RESULT = R;
})();
</script>
