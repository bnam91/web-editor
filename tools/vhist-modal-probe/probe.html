<!doctype html>
<meta charset="utf-8">
<title>버전 기록 모달 — 렌더 실측</title>
<link rel="stylesheet" href="../../css/editor-base.css">
<link rel="stylesheet" href="../../css/settings-modal.css">
<link rel="stylesheet" href="../../css/version-history.css">
<body style="margin:0;background:#1a1a1a">
<script src="../../js/version-diff.js"></script>
<script src="../../js/version-history.js"></script>
<script>
// ── main 의 projects:history-list 응답을 «실제 모양 그대로» 흉내낸다 ─────────
const NOW = Date.now();
window.__TS = { tooLarge: 0, moved: 0 };   // 아래에서 entries 시각으로 채운다
const S = (k, n) => ({ k, n });
window.electronAPI = {
  historyList: async () => ({
    ok: true,
    current: { ts: NOW, bytes: 41_500_000, projMtimeMs: 1, name: '세이프본 무릎보호대',
      counts: { pages: 1, sections: 21, blocks: 187, images: 7 },
      secs: [S('page_1::sec_a', '메인비주얼'), S('page_1::sec_b', '상세컷')] },
    entries: [
      { ts: NOW - 3 * 3600e3, file: 'a.json', reason: 'auto', pinned: false, canon: 1, bytes: 248_000,
        counts: { pages: 1, sections: 24, blocks: 203, images: 7 },
        secs: [S('page_1::sec_a', '메인비주얼'), S('page_1::sec_b', '상세컷'),
               S('page_1::sec_c', '혜택정리'), S('page_1::sec_d', 'FAQ'), S('page_1::sec_e', '배송안내')] },
      { ts: NOW - 26 * 3600e3, file: 'b.json', reason: 'pre-restore', pinned: true, canon: 1, bytes: 244_000,
        counts: { pages: 1, sections: 22, blocks: 190, images: 7 },
        secs: [S('page_1::sec_a', '메인비주얼'), S('page_1::sec_b', '상세컷'), S('page_1::sec_c', '혜택정리')] },
      { ts: NOW - 9 * 86400e3, file: 'c.json', reason: 'unload', pinned: false, canon: 1, bytes: 240_000,
        counts: { pages: 1, sections: 21, blocks: 185, images: 7 },
        secs: [S('page_1::sec_a', '메인비주얼'), S('page_1::sec_b', '상세컷')] },
      { ts: NOW - 40 * 86400e3, file: 'd.json', reason: 'auto', pinned: false, canon: 0, bytes: 41_500_000,
        counts: null, secs: [], pending: true },
    ],
    legacyCount: 1, pendingCount: 1, totalBytes: 42_232_000,
  }),
  historyOpenCopy: async () => ({ ok: true, newProjectId: 'proj_x', newName: '사본' }),
  /* ★[C3] 상세 비교 — 여기서만 «진짜 DOMParser» 가 돈다(CI 는 배선만 잰다).
   *   ts 별로 다른 상황을 준다: 정상 / 너무 큼 / 혼재 / 페이지 이동(중대③ 재현). */
  historyDiffPayload: async ({ ts }) => {
    window.__diffCalls = (window.__diffCalls || 0) + 1;
    const SEC = (id, n, body) => `<div class="section-block" id="${id}" data-name="${n}">`
      + `<div class="section-inner">${body || ''}</div></div>`;
    if (ts === window.__TS.tooLarge) return { ok: false, reason: 'too_large', bytes: 41_500_000 };
    if (ts === window.__TS.moved) {
      // ★섹션을 1페이지 → 2페이지로 «옮기기만» 했다. 손실이 있다고 말하면 거짓 경보다.
      return { ok: true, ts,
        snapCanvas: { page_1: SEC('sec_a', '메인비주얼') + SEC('sec_b', '상세컷'), page_2: '' },
        curCanvas:  { page_1: SEC('sec_a', '메인비주얼'), page_2: SEC('sec_b', '상세컷') }, bytes: 900 };
    }
    return { ok: true, ts,
      snapCanvas: { page_1: SEC('sec_a', '메인비주얼', '<p>원래 문구</p>') + SEC('sec_c', '혜택정리')
                          + SEC('sec_d', 'FAQ') + SEC('sec_e', '배송안내 — 아주 긴 이름으로 폭을 밀어보는 섹션 이름입니다') },
      curCanvas:  { page_1: SEC('sec_a', '메인비주얼', '<p>바뀐 문구</p>') + SEC('sec_new', '새로 생긴 섹션') },
      bytes: 1200 };
  },
};
window.__TS.moved    = NOW - 26 * 3600e3;   // pre-restore 행 = 「페이지만 옮김」 상황
window.__TS.tooLarge = NOW - 40 * 86400e3;  // 레거시 행 = too_large
window.showToast = (m) => { window.__toast = m; };
</script>
<script src="../../js/version-history-ui.js"></script>
<script>
(async function () {
  const R = { ok: true, problems: [], env: {} };
  const P = (m) => R.problems.push(m);

  await window.openVersionHistory({ projectId: 'proj_1', projectName: '세이프본 무릎보호대' });
  await new Promise(r => setTimeout(r, 60));

  const ov = document.getElementById('vhist-overlay');
  if (!ov) { P('모달이 안 생겼다'); window.__RESULT = R; return; }
  R.env.display = getComputedStyle(ov).display;
  if (R.env.display !== 'flex') P(`모달이 안 열렸다 (display=${R.env.display})`);

  const rows = [...ov.querySelectorAll('.vhist-row')];
  R.env.rowCount = rows.length;
  if (rows.length !== 5) P(`행 수가 5(지금 1 + 버전 4)가 아니다: ${rows.length}`);

  // ★손실 줄 — 3시간 전 버전에는 «혜택정리·FAQ·배송안내»가 있고 지금은 없다
  const losses = [...ov.querySelectorAll('.vhist-loss')].map(e => e.textContent.trim());
  R.env.losses = losses;
  if (!losses.some(t => t.includes('지금은 없는 섹션 3') && t.includes('혜택정리')))
    P('★손실 줄이 「지금은 없는 섹션 3 — 혜택정리…」를 못 보여준다 — 이 기능의 헤드라인이다');
  if (!losses.some(t => t.includes('아직 분석 안 함')))
    P('미분석(pending) 행이 «모른다»고 말하지 않는다 — 숫자를 지어내면 안 된다');
  // 손실 0 인 행은 손실 줄 자체가 없어야 한다(노이즈 제거)
  const noLossRows = rows.filter(r => !r.querySelector('.vhist-loss')).length;
  R.env.rowsWithoutLossLine = noLossRows;
  if (noLossRows < 2) P('손실 0 인 행에도 손실 줄이 그려졌다 — 사고 직후 노이즈가 제일 해롭다');

  // 배지
  const badges = [...ov.querySelectorAll('.vhist-badge')].map(e => e.textContent.trim());
  R.env.badges = badges;
  if (!badges.includes('되돌리기 직전')) P('pre-restore 행이 「되돌리기 직전」으로 안 보인다');
  if (!badges.some(b => b.includes('옛 형식'))) P('레거시 행이 「옛 형식」으로 안 보인다');

  // ★파괴 채널이 화면에 없어야 한다(U6 은 아직)
  const btnLabels = [...ov.querySelectorAll('button')].map(b => b.textContent.trim());
  R.env.buttons = [...new Set(btnLabels)];
  // ★U6 이 승인·구현된 뒤라 「이 버전으로 교체」는 «있어야» 한다(U3 시점 단언을 그대로 두면 거짓 빨강).
  //   대신 승인된 적 없는 파괴 어휘가 새지 않았는지를 본다.
  if (!btnLabels.some(t => t.includes('이 버전으로 교체'))) P('★교체 버튼이 없다 — Q2 확정은 「교체가 기본」이다');
  for (const bad of ['삭제', '영구']) {
    if (btnLabels.some(t => t.includes(bad))) P(`★승인된 적 없는 파괴 버튼 「${bad}」이 화면에 나왔다`);
  }
  if (!btnLabels.some(t => t.includes('사본으로'))) P('비파괴 액션(사본으로)이 없다');
  // 「지금」 행에는 액션이 없어야 한다(버전이 아니다)
  const curActions = ov.querySelector('.vhist-row.is-current .vhist-actions');
  if (curActions && curActions.children.length) P('「지금」 행에 액션 버튼이 붙었다 — 되돌릴 대상이 아니다');

  /* ★디자인 일관성 — 감이 아니라 측정
   *  ① 껍데기가 공용 클래스인가  ② 신작 클래스가 .vhist-* 로만 제한되나
   *  ③ 하드코딩 색이 없나(토큰만) */
  R.env.usesSharedShell = !!(ov.classList.contains('settings-modal-overlay')
    && ov.querySelector('.settings-modal-shell') && ov.querySelector('.settings-modal-footer'));
  if (!R.env.usesSharedShell) P('★공용 모달 껍데기(.settings-modal-*)를 안 쓴다 — 룩어라이크 신작이다');
  const allCls = new Set();
  ov.querySelectorAll('*').forEach(e => e.classList.forEach(c => allCls.add(c)));
  const foreign = [...allCls].filter(c => !/^(settings-|vhist-|is-)/.test(c));
  R.env.foreignClasses = foreign;
  if (foreign.length) P(`공용/전용 밖 클래스가 섞였다: ${foreign.join(', ')}`);

  // 버튼이 공용 .settings-btn 을 쓰는가
  const nonShared = [...ov.querySelectorAll('button')].filter(b =>
    !b.classList.contains('settings-btn') && !b.classList.contains('settings-modal-close'));
  R.env.nonSharedButtons = nonShared.map(b => b.className);
  if (nonShared.length) P(`공용 버튼 클래스를 안 쓰는 버튼: ${R.env.nonSharedButtons.join(' | ')}`);

  // ★글자 잘림 — panel-clip-probe 에서 배운 판정식(자연 폭을 따로 잰다)
  const ruler = document.createElement('span');
  ruler.style.cssText = 'position:absolute;left:-9999px;white-space:pre;visibility:hidden';
  document.body.appendChild(ruler);
  const clipped = [];
  ov.querySelectorAll('.vhist-when, .vhist-meta, .vhist-loss, button').forEach(e => {
    if (e.children.length) return;
    const cs = getComputedStyle(e);
    ruler.style.font = cs.font; ruler.style.letterSpacing = cs.letterSpacing;
    ruler.textContent = e.textContent;
    const inner = e.getBoundingClientRect().width
      - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0)
      - (parseFloat(cs.borderLeftWidth) || 0) - (parseFloat(cs.borderRightWidth) || 0);
    if (ruler.getBoundingClientRect().width > inner + 0.5)
      clipped.push(`${e.className || e.tagName}: «${e.textContent.slice(0, 24)}»`);
  });
  R.env.clipped = clipped;
  if (clipped.length) P(`글자 잘림 ${clipped.length}건: ${clipped.slice(0, 3).join(' / ')}`);
  // 검출기 자가시험 — 일부러 좁힌 것이 잡히는가(「검출 0」이 «무딤»일 수 있다)
  const t = document.createElement('button');
  t.className = 'settings-btn'; t.style.cssText = 'width:20px;overflow:hidden;white-space:nowrap';
  t.textContent = '아주 긴 라벨입니다';
  ov.querySelector('.settings-modal-footer').appendChild(t);
  const cs2 = getComputedStyle(t);
  ruler.style.font = cs2.font; ruler.textContent = t.textContent;
  R.env.selftestDetected = ruler.getBoundingClientRect().width > t.getBoundingClientRect().width;
  t.remove();
  if (!R.env.selftestDetected) P('★잘림 검출기가 강제 케이스를 못 잡았다 — 위 「잘림 0」은 무효다');

  /* ═══ [C3] 상세 비교 — «진짜 DOM 에서만» 잴 수 있는 것들 ═══════════════
   * CI 의 가짜 DOM 은 CSS 를 모른다. display:flex/gap · 실제 가로폭 · disabled 클릭 차단은 여기서만 난다. */
  const dbtns = [...ov.querySelectorAll('[data-vh-detail]')];
  R.env.detailButtons = dbtns.length;
  if (!dbtns.length) P('★「펼치기」 버튼이 하나도 없다 — C3 가 화면에 안 붙었다');
  if (ov.querySelector('.vhist-row.is-current [data-vh-detail]'))
    P('★「지금」 행에 펼치기가 붙었다 — 자기 자신과 비교하게 된다');

  // ⒜ 정상 비교 — 펼쳐서 «내용»이 나오는가
  const b0 = dbtns[0];
  const box0 = b0.closest('.vhist-row').querySelector('[data-vh-detail-box]');
  b0.click();
  // ★연타 — disabled 가 진짜로 클릭을 막는가(가짜 DOM 이 못 재는 자리)
  b0.click(); b0.click();
  await new Promise(r => setTimeout(r, 120));
  R.env.diffCallsAfterTripleClick = window.__diffCalls;
  if (window.__diffCalls !== 1) P(`★연타로 IPC 가 ${window.__diffCalls}회 나갔다 — 비교 중 버튼이 안 잠긴다`);

  const cs0 = getComputedStyle(box0);
  R.env.detailDisplay = cs0.display;
  R.env.detailGap = cs0.rowGap || cs0.gap;
  if (cs0.display !== 'flex')
    P(`★.vhist-detail 이 flex 가 아니다 (display=${cs0.display}) — 인라인 스타일이 CSS 를 덮었다(경미⑧). gap 이 안 붙는다`);
  const dtext = box0.textContent;
  R.env.detailText = dtext.trim().slice(0, 160);
  if (!/달라진 섹션/.test(dtext)) P('★내용이 바뀐 섹션을 못 보여준다');
  if (!/지금은 없는 섹션/.test(dtext)) P('★없어진 섹션을 못 보여준다');
  if (!/그 뒤에 생긴 섹션/.test(dtext)) P('★새로 생긴 섹션을 못 보여준다');
  const lostLine = box0.querySelector('.vhist-detail-line.is-lost');
  if (!lostLine) P('★손실 줄에 is-lost 가 없다 — 다른 줄과 색이 같아진다');
  else if (getComputedStyle(lostLine).color === getComputedStyle(box0.querySelector('.vhist-detail-line')).color
           && box0.querySelectorAll('.vhist-detail-line').length > 1)
    P('★손실 줄 색이 일반 줄과 같다 — --ui-danger 가 안 먹었다');

  // ⒝ ★가로 오버플로 — 긴 섹션 이름이 모달을 밀어내면 안 된다(행이 grid 라 한 칸만 넘쳐도 전체가 밀린다)
  const shell = ov.querySelector('.settings-modal-shell');
  R.env.shellOverflowX = shell.scrollWidth - shell.clientWidth;
  if (R.env.shellOverflowX > 1) P(`★모달이 가로로 ${R.env.shellOverflowX}px 밀렸다 — 긴 섹션 이름이 안 끊긴다`);
  const row0 = box0.closest('.vhist-row');
  if (row0.scrollWidth - row0.clientWidth > 1) P('★행이 가로로 밀렸다');

  // ⒞ 접기/펴기 상태전환
  b0.click(); await new Promise(r => setTimeout(r, 30));
  if (getComputedStyle(box0).display !== 'none') P('★접었는데 안 사라진다');
  if (b0.textContent.trim() !== '펼치기') P(`★접었는데 버튼이 「${b0.textContent.trim()}」이다`);
  b0.click(); await new Promise(r => setTimeout(r, 60));
  if (getComputedStyle(box0).display !== 'flex') P('★다시 펼쳤는데 flex 가 아니다');
  if (window.__diffCalls !== 1) P('★같은 행을 여닫을 때마다 다시 읽는다(캐시가 안 먹는다)');

  // ⒟ ★중대③ 재현 — 페이지만 옮긴 섹션을 «사라졌다»고 말하면 안 된다
  const bm = dbtns.find(b => Number(b.dataset.vhDetail) === window.__TS.moved);
  if (!bm) P('중대③ 재현 대상 행을 못 찾았다(프로브 픽스처 문제)');
  else {
    const bmBox = bm.closest('.vhist-row').querySelector('[data-vh-detail-box]');
    bm.click(); await new Promise(r => setTimeout(r, 120));
    R.env.movedDetail = bmBox.textContent.trim();
    if (/지금은 없는 섹션/.test(bmBox.textContent))
      P('★★페이지만 옮긴 섹션을 «없어졌다»고 빨갛게 말한다 — L1 은 손실 0 이라고 한 같은 행이다(중대③)');
    if (/그 뒤에 생긴 섹션/.test(bmBox.textContent))
      P('★같은 섹션이 «새로 생긴 것»으로도 세진다');
  }

  // ⒠ too_large — 「생략」이라고 말하고 «이유+용량»을 준다
  const bl = dbtns.find(b => Number(b.dataset.vhDetail) === window.__TS.tooLarge);
  if (bl) {
    const blBox = bl.closest('.vhist-row').querySelector('[data-vh-detail-box]');
    bl.click(); await new Promise(r => setTimeout(r, 120));
    R.env.tooLargeDetail = blBox.textContent.trim();
    if (!/상세 비교 생략/.test(blBox.textContent)) P('★too_large 를 「생략」이라 말하지 않는다');
    if (!/MB/.test(blBox.textContent)) P('★생략 사유에 용량이 없다 — 사용자가 판단할 수 없다');
    if (/too_large/.test(blBox.textContent)) P('★영어 reason 토큰이 화면에 그대로 나갔다');
  }

  // ⒡ 신작 클래스 재검(상세가 붙은 뒤에도 .vhist-*/settings-* 밖이 없나) — 위 검사 재실행
  const allCls2 = new Set();
  ov.querySelectorAll('*').forEach(e => e.classList.forEach(c => allCls2.add(c)));
  const foreign2 = [...allCls2].filter(c => !/^(settings-|vhist-|is-)/.test(c));
  if (foreign2.length) P(`상세를 펼친 뒤 공용/전용 밖 클래스가 섞였다: ${foreign2.join(', ')}`);

  R.ok = R.problems.length === 0;
  window.__RESULT = R;
})();
</script>
