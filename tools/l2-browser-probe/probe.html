<!doctype html>
<meta charset="utf-8">
<title>L2 changeDiff — 실브라우저 DOMParser 검증</title>
<body><pre id="out">running…</pre>
<script src="../../js/market-merge.js"></script>
<script src="../../js/version-diff.js"></script>
<script src="./data.js"></script>
<script>
(function () {
  const R = { ok: true, env: {}, cases: [], problems: [] };
  R.env.hasDOMParser = typeof DOMParser === 'function';
  R.env.hasMarketMerge = !!(window.marketMerge && window.marketMerge.normSection);
  R.env.hasVersionDiff = !!(window.versionDiff && window.versionDiff.changeDiff);
  R.env.pairs = (window.__PAIRS || []).length;

  const P = (msg) => R.problems.push(msg);
  if (!R.env.hasDOMParser) P('DOMParser 없음');
  if (!R.env.hasMarketMerge) P('marketMerge 미로드 — 로컬 사본으로 폴백되면 «표준»을 검증하는 게 아니다');
  if (!R.env.hasVersionDiff) P('versionDiff 미로드');

  for (const p of (window.__PAIRS || [])) {
    const c = { id: p.id, ts: p.ts, canon: p.canon, snapSections: p.snapSections, curSections: p.curSections };
    const t0 = performance.now();
    let r;
    try { r = window.versionDiff.changeDiff(p.snapCanvas, p.curCanvas); }
    catch (e) { c.threw = String(e && e.message || e); P(p.id + ': changeDiff THREW ' + c.threw); R.cases.push(c); continue; }
    c.ms = Math.round(performance.now() - t0);
    c.summary = r.summary;
    c.mixedEncoding = r.mixedEncoding === true;
    c.changedNames = r.changed.map(x => x.n).slice(0, 5);
    c.lostNames = r.lost.map(x => x.n).slice(0, 5);

    // ★성질 검사
    // ① 양쪽 다 정규화해서 넘겼으니 mixedEncoding 이 뜨면 안 된다
    if (c.mixedEncoding) P(p.id + ': ★mixedEncoding — 정규화해서 넘겼는데 한쪽에 base64 가 남았다');
    // ② 분할 불변식
    const s = r.summary;
    if (s.same + s.changed + s.lost + s.gained !== s.total)
      P(p.id + ': 분할 불변식 깨짐 ' + JSON.stringify(s));
    // ③ ★가짜 변경의 벽 — 이 쌍들은 「스냅샷 = 최근 저장본」이라 대부분 same 이어야 한다.
    //    이미지 든 섹션이 전부 changed 로 뜨는 게 §6-2 가 경고한 실패 모드다.
    const common = s.same + s.changed;
    if (common > 0 && s.changed / common > 0.8 && s.changed >= 3)
      P(p.id + ': ★changed 가 ' + s.changed + '/' + common + ' — 가짜 변경의 벽일 수 있다');
    // ④ L1 과 L2 의 lost 가 어긋나면 안 된다(같은 재료를 다르게 읽는다는 뜻)
    R.cases.push(c);
  }

  // ⑤ 음성대조 — 같은 캔버스를 양쪽에 넣으면 changed 0
  if (R.env.pairs > 0) {
    const p = window.__PAIRS[0];
    const self = window.versionDiff.changeDiff(p.curCanvas, p.curCanvas);
    R.selfCompare = self.summary;
    if (self.summary.changed !== 0 || self.summary.lost !== 0 || self.summary.gained !== 0)
      P('★음성대조 실패 — 같은 캔버스끼리 비교했는데 차이가 나온다: ' + JSON.stringify(self.summary));
  }

  // ⑥ 양성대조 — 현재본에서 섹션을 하나 지우면 lost 1
  const big = (window.__PAIRS || []).find(x => x.curSections >= 2);
  if (big) {
    const key = Object.keys(big.curCanvas)[0];
    const doc = new DOMParser().parseFromString('<div id="c">' + big.curCanvas[key] + '</div>', 'text/html');
    const root = doc.getElementById('c');
    const secs = root.querySelectorAll('.section-block');
    const removedName = secs[secs.length - 1].getAttribute('data-name') || secs[secs.length - 1].id;
    secs[secs.length - 1].remove();
    const cut = Object.assign({}, big.curCanvas); cut[key] = root.innerHTML;
    const r2 = window.versionDiff.changeDiff(big.curCanvas, cut);
    R.positiveControl = { removedName, lost: r2.lost.map(x => x.n), summary: r2.summary };
    if (r2.lost.length !== 1) P('★양성대조 실패 — 섹션 1개를 지웠는데 lost=' + r2.lost.length);
  } else {
    P('양성대조를 태울 쌍이 없다(섹션 2개 이상인 프로젝트 없음)');
  }

  R.ok = R.problems.length === 0;
  window.__RESULT = R;
  document.getElementById('out').textContent = JSON.stringify(R, null, 1);
})();
</script>
