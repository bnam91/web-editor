<!doctype html>
<!--
  figma-killswitch-probe — 「Figma 3종이 «보이되 안 눌리고», 뒤에서도 안 도는가」를 숫자로 잰다.
  ★index.html 의 «진짜» 마크업 + «진짜» 킬스위치 IIFE 를 파일에서 읽어 태운다(기억이 아니라 파일을 잰다).
  ⛔실앱 불필요.
-->
<meta charset="utf-8"><title>Figma 킬스위치 실측</title>
<body style="margin:0;background:#111">
<div id="stage"></div>
<pre id="out" style="color:#ddd;font:11px monospace;white-space:pre-wrap"></pre>
<script type="module">
const R = { ok: true, env: {}, problems: [] };
const P = m => R.problems.push(m);
try {
  const html = await (await fetch('../../index.html')).text();
  const i = html.indexOf('<div id="publish-dropdown-menu"');
  const j = html.indexOf('\n  </div>\n</div>', i);
  if (i === -1 || j === -1) { P('index.html 에서 드롭다운 마크업을 못 찾았다'); throw new Error('markup'); }
  // ★진짜 구조: #publish-dropdown-wrap > #publish-dropdown-menu (열기 토글이 wrap 의 클래스를 만진다)
  document.getElementById('stage').innerHTML =
    '<div id="publish-dropdown-wrap">' + html.slice(i, j) + '</div>';

  const calls = [];
  window.electronAPI = {
    figmaBridgeStatus: async () => { calls.push('figmaBridgeStatus'); return false; },
    figmaBridgeStart:  async () => { calls.push('figmaBridgeStart');  return {}; },
    figmaBridgeStop:   async () => { calls.push('figmaBridgeStop');   return {}; },
  };
  window.closePublishDropdown = () => {};
  window.togglePublishDropdown = () => {};

  const { FIGMA_ENABLED } = await import('../../js/globals.js');
  R.env.FIGMA_ENABLED = FIGMA_ENABLED;

  const need = document.createElement('div');
  need.innerHTML = '<div id="layer-panel-body"></div><div id="canvas"></div><div id="canvas-wrap"></div>'
    + '<div id="figma-upload-modal"><div id="figma-section-list"></div>'
    + '<input id="figma-channel-input"><input type="checkbox" id="figma-select-all"></div>'
    // 킬스위치 IIFE 가 Plugins 패널도 잠근다 — 그 자리도 진짜 마크업에 가깝게 깔아 준다
    + '<div id="fp-plugin-panel">'
    + '  <div class="fp-plugin-item" id="plugin-figma-upload"><span class="fp-plugin-name">Figma Upload</span></div>'
    + '  <div class="fp-plugin-item" id="plugin-figma-import"><span class="fp-plugin-name">Figma Import</span></div>'
    + '  <div class="fp-plugin-item" id="plugin-iconify"><span class="fp-plugin-name">Iconify</span></div>'
    + '  <div class="fp-plugin-item" id="plugin-mockup"><span class="fp-plugin-name">Device Mockup</span></div>'
    + '</div>';
  document.body.appendChild(need);
  let loaded = false;
  try { await import('../../js/io/figma-publish.js'); loaded = true; }
  catch (e) { P('★figma-publish.js 를 못 올렸다 — 뒷단 검사가 «안 돈 것»이다: ' + e.message); }
  R.env.publishModuleLoaded = loaded;

  const k = html.indexOf('(function () {\n  if (window.FIGMA_ENABLED) return;');
  if (k === -1) P('★킬스위치 IIFE 를 index.html 에서 못 찾았다 — 사라졌거나 형태가 바뀌었다');
  else {
    try { (0, eval)(html.slice(k, html.indexOf('})();', k) + 5)); R.env.killSwitchRan = true; }
    catch (e) { P('★킬스위치 IIFE 가 던졌다 — 프로브 픽스처가 부족하거나 IIFE 가 방어적이지 않다: ' + e.message); }
  }
  await new Promise(r => setTimeout(r, 20));

  const items = [...document.querySelectorAll('.pub-dd-item')];
  R.env.items = items.map(e => e.textContent.replace(/\s+/g, ' ').trim());
  const find = re => items.find(e => re.test(e.textContent));
  const FIGMA = [[/Figma Bridge/, 'Figma Bridge'], [/Figma 업로드/, 'Figma 업로드'], [/Figma 가져오기/, 'Figma 가져오기']];

  for (const [re, name] of FIGMA) {
    const el = find(re);
    if (!el) { P(`★「${name}」이 사라졌다 — 현빈 지시는 «보이되 안 눌리게» 다`); continue; }
    if (el.getAttribute('aria-disabled') !== 'true') P(`★「${name}」에 aria-disabled 가 없다`);
    if (!el.style.opacity || parseFloat(el.style.opacity) >= 1) P(`★「${name}」이 «안 눌리게 보이지» 않는다`);
  }
  let fired = 0;
  window.toggleFigmaBridge = () => { fired++; };
  window.openFigmaUploadModal = () => { fired++; };
  window.openFigmaImportPreview = () => { fired++; };
  for (const [re, name] of FIGMA) {
    const el = find(re); if (!el) continue;
    el.click();
    if (fired) { P(`★「${name}」이 «실제로 눌렸다» — 보이기만 하고 못 막았다`); fired = 0; }
  }
  const imp = document.getElementById('figma-import-file-input');
  if (imp && !imp.disabled) P('★가져오기 file input 이 안 잠겼다 — 라벨을 눌러 파일창이 열린다');

  for (const [re, name] of [[/불러오기/, '불러오기'], [/저장/, '저장'],
                            [/이미지로 내보내기/, '★이미지로 내보내기(PNG)'],
                            [/JSON 내보내기/, 'JSON 내보내기'], [/참고 이미지 일괄 추가/, '참고 이미지 일괄 추가']]) {
    const el = find(re);
    if (!el) { P(`★「${name}」이 사라졌다`); continue; }
    if (el.getAttribute('aria-disabled') === 'true') P(`★「${name}」까지 잠갔다 — 대상이 아니다`);
  }

  /* ★★뒤에서 도는가 — «드롭다운을 여는 경로»로 태운다.
   *   figma-publish.js 가 togglePublishDropdown 을 감싸며 initFigmaBridge() 를 부른다.
   *   그 호출은 «모듈 내부 참조»라, window.initFigmaBridge 를 덮는 것만으로는 안 막힌다. */
  calls.length = 0;
  if (typeof window.togglePublishDropdown === 'function') {
    window.togglePublishDropdown({ stopPropagation() {} });
    await new Promise(r => setTimeout(r, 30));
  }
  R.env.ipcAfterDropdownOpen = calls.slice();
  if (calls.length) P(`★★드롭다운을 여니 브릿지 상태조회가 나갔다: ${calls.join(', ')} — `
    + '메뉴는 잠갔는데 뒤에서 TCP 127.0.0.1:3055 를 두드린다');
} catch (e) { P('프로브가 던졌다: ' + (e && e.message)); }
R.ok = R.problems.length === 0;
window.__RESULT = R;
document.getElementById('out').textContent = JSON.stringify(R, null, 1);
</script>
